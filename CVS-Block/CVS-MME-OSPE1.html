<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CVS OSPE Practice Exam</title>
<style>
:root{--bg:#c8f0e6;--card:#f6fffc;--ink:#10302c;--mute:#3f6660;--line:#9fd3c7;--accent:#16857a;--good:#2f9e66;--goodbg:#d3f3e1;--bad:#d44b4b;--badbg:#fde0df;--warn:#e3a92a;--warnbg:#fff1cc;--bar:#e6fbf5;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 130px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);border-bottom:2px solid var(--line);padding:8px 12px}
.bar .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:960px;margin:0 auto}
.score{font-weight:700;font-size:1.05rem}
.pct{color:var(--accent);font-weight:700}
.meter{flex:1;min-width:110px;height:10px;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);width:0}
.prog{font-size:.85rem;color:var(--mute)}
button{font:inherit;cursor:pointer}
.fin{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:6px 12px;font-weight:600}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.nb{border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:4px 12px;font-weight:600}
.nb.prog{background:var(--warnbg);border-color:var(--warn)}
.nb.good{background:var(--goodbg);border-color:var(--good)}
.nb.miss{background:var(--badbg);border-color:var(--bad)}
.nb.cur{outline:3px solid var(--accent);outline-offset:1px}
main{max-width:960px;margin:0 auto;padding:14px 12px 60px}
h2{margin:6px 0 4px}
.stem{color:var(--mute);margin:0 0 10px}
.figs{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 14px}
.fig{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;flex:1 1 200px;max-width:320px}
.fig img{max-width:100%;height:auto;display:block;margin:0 auto}
.fig b{display:block;font-size:.9rem;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 14px}
.qh{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.qn{font-weight:700;color:var(--accent)}
.tag{background:#dff6ef;border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:.78rem;color:var(--mute)}
.mk{margin-left:auto;font-size:.82rem;color:var(--mute)}
.qt{font-weight:600;margin:4px 0 8px}
textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;background:#fff;color:var(--ink);resize:vertical}
.hint{font-size:.78rem;color:var(--mute);margin:2px 0 8px}
.btn{background:#fff;border:2px solid var(--accent);color:var(--accent);border-radius:8px;padding:6px 14px;font-weight:600}
.part{border-top:1px dashed var(--line);margin-top:12px;padding-top:10px}
.pl{font-weight:600}
.pl small{font-weight:400;color:var(--mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{border:1px solid var(--accent);background:#e8fbf5;color:var(--ink);border-radius:8px;padding:4px 10px;text-align:left}
.chip.on{background:var(--accent);color:#fff}
.chip i{font-size:.72rem;opacity:.8}
.why{background:#fff;border-left:4px solid var(--accent);border-radius:4px;padding:6px 10px;margin:4px 0;font-size:.92rem}
.mark{display:flex;gap:8px;margin-top:6px}
.mark button{border:2px solid var(--line);background:#fff;border-radius:8px;padding:4px 14px;font-weight:600}
.mark .r.on{background:var(--good);border-color:var(--good);color:#fff}
.mark .w.on{background:var(--bad);border-color:var(--bad);color:#fff}
.note{background:var(--warnbg);border:1px solid var(--warn);border-radius:8px;padding:6px 10px;margin-top:12px;font-size:.88rem}
.pager{display:flex;justify-content:space-between;gap:8px;margin-top:8px}
.info{font-size:.85rem;color:var(--mute);margin-top:6px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:6px 0 16px;font-size:.92rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
th{background:#dff6ef}
.big{font-size:2rem;font-weight:800}
.wrap{overflow-x:auto}
.mis{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:6px 0}
.mis .st{font-size:.82rem;color:var(--mute)}
.bad{color:var(--bad);font-weight:600}
.dim{color:var(--mute)}
</style>
</head>
<body>
<header class="bar">
 <div class="row">
  <span class="score" id="sc">0 / 0</span>
  <span class="pct" id="pc">0%</span>
  <div class="meter" title="Progress"><i id="pm"></i></div>
  <span class="prog" id="pt">0 / 0 judged</span>
  <button class="fin" id="fin">Finish and see results</button>
 </div>
 <div class="row"><div class="nav" id="nav"></div></div>
</header>
<main id="stage"></main>
<script type="application/json" id="data">{"lectures": [{"id": "L1", "subject": "Anatomy", "name": "Overview of Thoracic Cage and Mediastinal structure"}, {"id": "L2", "subject": "Anatomy", "name": "Pericardium and external features of the heart"}, {"id": "L3", "subject": "Physiology", "name": "Recording of heart sounds"}, {"id": "L4", "subject": "Physiology", "name": "Blood pressure measurement and effect of posture"}, {"id": "L5", "subject": "Microbiology", "name": "Laboratory diagnosis of infective endocarditis"}], "stations": [{"label": "Station 1", "stem": "Study the three figures and answer the questions.", "figures": [{"img": "s1f1", "cap": "Figure 1"}, {"img": "s1f2", "cap": "Figure 2"}, {"img": "s1f3", "cap": "Figure 3"}], "questions": [{"id": "1.1", "text": "Identify the structure pointed at in Figure 1. Where does it terminate?", "tags": ["L1"], "note": "The key writes “plane of Ludwig”; this is the same plane (sternal angle, T4/T5) that Station 2 calls the plane of Louis, so both names are accepted. “Azygous” silently corrected to azygos.", "parts": [{"l": "Structure (Figure 1)", "any": true, "acc": [{"a": "Azygos vein", "why": "A single vertical vein running up the right side of the vertebral bodies in the posterior mediastinum; right posterior intercostal veins drain into it."}, {"a": "Azygos venous system", "why": "The key’s wording: the azygos vein with its left-sided partners (hemiazygos and accessory hemiazygos) that cross to join it."}]}, {"l": "Where it terminates", "any": true, "acc": [{"a": "Superior vena cava", "why": "The azygos arches forward over the root of the right lung and opens into the posterior wall of the SVC just before the SVC enters the pericardium."}, {"a": "SVC at the level of the sternal angle (plane of Louis / Ludwig, T4–T5)", "why": "The azygos arch lies at the T4–T5 plane, the same transverse plane as the sternal angle, which is the key’s “plane of Ludwig”."}]}]}, {"id": "1.2", "text": "Identify the structures A and B in Figure 2.", "tags": ["L1"], "note": "Checked on a magnified crop: arrow A points at the yellow beaded cord on the vertebral bodies and arrow B at the large red vessel in front of it, matching the key.", "parts": [{"l": "A", "any": true, "acc": [{"a": "Sympathetic chain (sympathetic trunk)", "why": "A beaded cord of ganglia running along the sides of the vertebral column / rib heads, seen here as the yellow-white chain."}]}, {"l": "B", "any": true, "acc": [{"a": "Descending thoracic aorta", "why": "The continuation of the aortic arch, passing down to the left of the vertebral column behind the heart in the posterior mediastinum."}]}]}, {"id": "1.3", "text": "Identify the structure in Figure 3 and name one of its branches.", "tags": ["L1"], "note": "The arrow tip sits low on the arch near where it turns into the descending aorta; I followed the key (arch of aorta). Left common carotid and left subclavian are standard branches not listed in the key.", "parts": [{"l": "Structure (Figure 3)", "any": true, "acc": [{"a": "Arch of aorta", "why": "The curved part of the aorta between the ascending and descending aorta, giving off the great vessels to the head, neck and arms."}]}, {"l": "One branch", "any": true, "acc": [{"a": "Brachiocephalic trunk", "why": "First and largest branch of the arch; divides into the right common carotid and right subclavian arteries."}, {"a": "Left common carotid artery", "x": true, "why": "Second branch of the arch; supplies the left side of the head and neck."}, {"a": "Left subclavian artery", "x": true, "why": "Third branch of the arch; supplies the left upper limb."}]}]}]}, {"label": "Station 2", "stem": "Study the three figures and answer the questions.", "figures": [{"img": "s2f1", "cap": "Figure 1"}, {"img": "s2f2", "cap": "Figure 2"}, {"img": "s2f3", "cap": "Figure 3"}], "questions": [{"id": "2.1", "text": "Identify the black line pointed at in Figure 1 and mention two of its significances.", "tags": ["L1"], "note": "The key lists three significances and the question asks for two, so any two different valid ones score. Extra standard answers marked “also valid” are not in the key.", "parts": [{"l": "Structure (black line)", "any": true, "acc": [{"a": "Sternal angle (angle of Louis)", "why": "The palpable ridge at the manubriosternal joint, where the 2nd costal cartilages attach."}, {"a": "Manubriosternal joint / angle of Ludwig", "why": "Alternative names for the same angle between the manubrium and the body of the sternum."}]}, {"l": "Significance 1", "any": true, "acc": [{"a": "Arch of aorta begins and ends at this level", "why": "The ascending aorta becomes the arch, and the arch becomes the descending aorta, at the T4–T5 plane."}, {"a": "Trachea bifurcates into right and left main bronchi", "why": "The carina lies at about T4–T5, the level of the sternal angle."}, {"a": "Second rib articulates directly here; used for rib counting", "why": "The 2nd costal cartilage meets the sternum at the angle, so it is the landmark for counting ribs and intercostal spaces in examination."}, {"a": "Lies at the T4–T5 intervertebral disc level", "x": true, "why": "The transverse plane through the sternal angle passes through the T4–T5 disc posteriorly."}, {"a": "Separates superior from inferior mediastinum", "x": true, "why": "The plane of the sternal angle is the boundary between the superior and inferior mediastinum."}, {"a": "Azygos vein arches into the SVC at this level", "x": true, "why": "The azygos arch enters the SVC at T4, in the plane of the sternal angle."}]}, {"l": "Significance 2 (a different one)", "any": true, "copy": true, "acc": [{"a": "Arch of aorta begins and ends at this level", "why": "The ascending aorta becomes the arch, and the arch becomes the descending aorta, at the T4–T5 plane."}, {"a": "Trachea bifurcates into right and left main bronchi", "why": "The carina lies at about T4–T5, the level of the sternal angle."}, {"a": "Second rib articulates directly here; used for rib counting", "why": "The 2nd costal cartilage meets the sternum at the angle, so it is the landmark for counting ribs and intercostal spaces in examination."}, {"a": "Lies at the T4–T5 intervertebral disc level", "x": true, "why": "The transverse plane through the sternal angle passes through the T4–T5 disc posteriorly."}, {"a": "Separates superior from inferior mediastinum", "x": true, "why": "The plane of the sternal angle is the boundary between the superior and inferior mediastinum."}, {"a": "Azygos vein arches into the SVC at this level", "x": true, "why": "The azygos arch enters the SVC at T4, in the plane of the sternal angle."}]}]}, {"id": "2.2", "text": "Identify the groove in Figure 2 and two of its components.", "tags": ["L2"], "note": "Two structures are lodged in the groove, so they are the two components. Spelling “inter ventricular” normalised.", "parts": [{"l": "Groove", "any": true, "acc": [{"a": "Posterior interventricular groove", "why": "The groove on the diaphragmatic (inferior) surface of the heart marking the boundary between the right and left ventricles."}]}, {"l": "Component 1", "any": true, "acc": [{"a": "Posterior descending (posterior interventricular) artery", "why": "Usually a branch of the right coronary artery (right dominance), running in the groove toward the apex."}, {"a": "Middle cardiac vein", "why": "Runs up the posterior interventricular groove and drains into the coronary sinus."}]}, {"l": "Component 2 (the other one)", "any": true, "copy": true, "acc": [{"a": "Posterior descending (posterior interventricular) artery", "why": "Usually a branch of the right coronary artery (right dominance), running in the groove toward the apex."}, {"a": "Middle cardiac vein", "why": "Runs up the posterior interventricular groove and drains into the coronary sinus."}]}]}, {"id": "2.3", "text": "Identify the heart chamber in Figure 3, its embryological origin, and one vessel arising from it.", "tags": ["L2"], "note": "The key gives both embryological parts for the single “origin” item, so either (or both) earns the mark. “traneculae carnae” and “bulbous cordis” silently corrected to trabeculae carneae and bulbus cordis. Embryology is only loosely within the heart lecture; tagged to the nearest topic.", "parts": [{"l": "Chamber", "any": true, "acc": [{"a": "Right ventricle", "why": "Forms most of the anterior (sternocostal) surface of the heart, just behind the sternum."}]}, {"l": "Embryological origin", "any": true, "acc": [{"a": "Rough trabeculated part (trabeculae carneae) from the primitive ventricle", "why": "The inflow part of the right ventricle develops from the primitive ventricular chamber of the heart tube."}, {"a": "Smooth outflow part (infundibulum / conus arteriosus) from the bulbus cordis", "why": "The bulbus cordis forms the smooth outflow tract of the right ventricle leading to the pulmonary trunk."}]}, {"l": "One vessel arising from it", "any": true, "acc": [{"a": "Pulmonary trunk", "why": "Leaves the infundibulum of the right ventricle and carries deoxygenated blood toward the lungs."}]}]}]}, {"label": "Station 4", "stem": null, "figures": [], "questions": [{"id": "4.1", "text": "Write the appropriate heart sound for each of the following. One heart sound can be used more than once.", "tags": ["L3"], "note": "“non complaint” in the key corrected to non-compliant.", "parts": [{"l": "Rapid passive ventricular filling during early diastole", "acc": [{"a": "S3", "why": "The third sound comes from blood rushing into the ventricle during rapid filling after the AV valves open."}]}, {"l": "After the onset of QRS complex on ECG", "acc": [{"a": "S1", "why": "Ventricular depolarisation (QRS) is followed by contraction and closure of the mitral and tricuspid valves, which makes S1."}]}, {"l": "Atria contract against non-compliant “stiff” ventricles", "acc": [{"a": "S4", "why": "The fourth sound is atrial contraction forcing blood into a stiff ventricle at end diastole, just before S1."}]}, {"l": "At start of isovolumetric contraction", "acc": [{"a": "S1", "why": "The AV valves shut as ventricular pressure rises above atrial pressure, starting isovolumetric contraction."}]}, {"l": "Immediately after T wave on ECG", "acc": [{"a": "S2", "why": "After ventricular repolarisation (T wave) the ventricles relax and the aortic and pulmonary valves close, making S2."}]}]}]}]}</script>

<script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent);
var IM=JSON.parse(document.getElementById('imgs').textContent);
var LEC={};D.lectures.forEach(function(l){LEC[l.id]=l;});
var KEY='cvs-ospe-v1';
var S={ans:{},rev:{},mark:{},open:{},cur:0,view:'station'};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);if(o&&o.ans){S.ans=o.ans||{};S.rev=o.rev||{};S.mark=o.mark||{};S.open=o.open||{};S.cur=o.cur||0;}}}catch(e){}
if(S.cur>=D.stations.length)S.cur=0;
var confirmReset=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function tagLabel(id){var l=LEC[id];return l.subject+' \u00b7 '+l.name;}
function $(id){return document.getElementById(id);}

function allParts(){var r=[];D.stations.forEach(function(st,si){st.questions.forEach(function(q){q.parts.forEach(function(p,pi){r.push({st:st,si:si,q:q,p:p,pi:pi,k:q.id+'|'+pi});});});});return r;}
var PARTS=allParts();
function totals(){var j=0,r=0;PARTS.forEach(function(x){var m=S.mark[x.k];if(m!==undefined){j++;if(m===1)r++;}});return{total:PARTS.length,judged:j,right:r};}
function stationStatus(si){var n=0,j=0,w=0,touched=false;PARTS.forEach(function(x){if(x.si!==si)return;n++;var m=S.mark[x.k];if(m!==undefined){j++;touched=true;if(m===0)w++;}if(S.ans[x.q.id]||S.rev[x.q.id])touched=true;});
 if(!touched)return'';if(j===n)return w?'miss':'good';return'prog';}

function buildNav(){var h='';D.stations.forEach(function(st,i){h+='<button class="nb" data-act="go" data-i="'+i+'">'+esc(st.label.replace('Station ',''))+'</button>';});
 $('nav').innerHTML='<span class="prog" style="align-self:center">Station</span>'+h;}
function updateNav(){var bs=$('nav').querySelectorAll('.nb');for(var i=0;i<bs.length;i++){var si=+bs[i].getAttribute('data-i');bs[i].className='nb '+stationStatus(si)+((S.view==='station'&&si===S.cur)?' cur':'');}}
function updateBar(){var t=totals();$('sc').textContent='Score '+t.right+' / '+t.judged;$('pc').textContent=(t.judged?Math.round(100*t.right/t.judged):0)+'%';$('pt').textContent=t.judged+' / '+t.total+' marks judged';$('pm').style.width=(100*t.judged/t.total)+'%';}

function qHTML(q){
 var rev=!!S.rev[q.id];
 var h='<section class="card" data-q="'+q.id+'"><div class="qh"><span class="qn">Q'+q.id+'</span>';
 q.tags.forEach(function(t){h+='<span class="tag">'+esc(tagLabel(t))+'</span>';});
 h+='<span class="mk">'+q.parts.length+' mark'+(q.parts.length>1?'s':'')+'</span></div>';
 h+='<div class="qt">'+esc(q.text)+'</div>';
 h+='<textarea data-q="'+q.id+'" placeholder="Type your answer here">'+esc(S.ans[q.id]||'')+'</textarea>';
 h+='<div class="hint">Enter shows the answers \u00b7 Shift+Enter adds a new line</div>';
 h+='<button class="btn" data-act="rev" data-q="'+q.id+'">'+(rev?'Hide answers':'Show answers')+'</button>';
 if(rev){
  q.parts.forEach(function(p,pi){
   var k=q.id+'|'+pi,m=S.mark[k];
   h+='<div class="part"><div class="pl">'+esc(p.l)+' <small>(1 mark'+(p.acc.length>1&&p.any?' \u00b7 any one accepted':'')+')</small></div><div class="chips">';
   p.acc.forEach(function(a,ai){var ok=k+'|'+ai;h+='<button class="chip'+(S.open[ok]?' on':'')+'" data-act="chip" data-k="'+ok+'" data-q="'+q.id+'">'+esc(a.a)+(a.x?' <i>also valid, not in key</i>':'')+'</button>';});
   h+='</div>';
   p.acc.forEach(function(a,ai){if(S.open[k+'|'+ai])h+='<div class="why">'+esc(a.why)+'</div>';});
   h+='<div class="mark"><button class="r'+(m===1?' on':'')+'" data-act="mark" data-k="'+k+'" data-v="1" data-q="'+q.id+'">\u2713 Right</button><button class="w'+(m===0?' on':'')+'" data-act="mark" data-k="'+k+'" data-v="0" data-q="'+q.id+'">\u2717 Wrong</button></div></div>';
  });
  if(q.note)h+='<div class="note"><b>Note:</b> '+esc(q.note)+'</div>';
 }
 return h+'</section>';
}
function findQ(id){var f=null;D.stations.forEach(function(st){st.questions.forEach(function(q){if(q.id===id)f=q;});});return f;}
function refreshCard(id){var el=document.querySelector('section.card[data-q="'+id+'"]');if(!el)return;var t=document.createElement('div');t.innerHTML=qHTML(findQ(id));el.replaceWith(t.firstChild);}

function renderStation(){
 var st=D.stations[S.cur];
 var h='<h2>'+esc(st.label)+'</h2>';
 if(st.stem)h+='<p class="stem">'+esc(st.stem)+'</p>';
 if(st.figures.length){h+='<div class="figs">';st.figures.forEach(function(f){h+='<div class="fig"><img src="'+IM[f.img]+'" alt="'+esc(f.cap)+'"><b>'+esc(f.cap)+'</b></div>';});h+='</div>';}
 st.questions.forEach(function(q){h+=qHTML(q);});
 h+='<div class="pager"><button class="btn" data-act="go" data-i="'+(S.cur-1)+'"'+(S.cur===0?' disabled style="opacity:.4"':'')+'>\u2190 Previous</button><button class="btn" data-act="go" data-i="'+(S.cur+1)+'"'+(S.cur===D.stations.length-1?' disabled style="opacity:.4"':'')+'>Next \u2192</button></div>';
 h+='<p class="info">Station 3 (a pharmacology prescription question) is not shown because it is outside your topic list.</p>';
 $('stage').innerHTML=h;
}

function agg(keyFn){var o={};PARTS.forEach(function(x){var ks=keyFn(x);var m=S.mark[x.k];ks.forEach(function(k){var e=o[k]||(o[k]={t:0,r:0,w:0,u:0});e.t++;if(m===1)e.r++;else if(m===0)e.w++;else e.u++;});});return o;}
function tbl(title,rows,fmt){
 var h='<h3>'+title+'</h3><div class="wrap"><table><tr><th>Name</th><th>Score</th><th>%</th><th>Wrong</th><th>Unmarked</th></tr>';
 rows.forEach(function(r){if(!r.e){h+='<tr><td>'+esc(r.n)+'</td><td colspan="4" class="dim">No questions in this file</td></tr>';return;}
  h+='<tr><td>'+esc(r.n)+'</td><td>'+r.e.r+' / '+r.e.t+'</td><td>'+Math.round(100*r.e.r/r.e.t)+'%</td><td>'+r.e.w+'</td><td>'+r.e.u+'</td></tr>';});
 return h+'</table></div>';
}
function renderResults(){
 var t=totals(),un=t.total-t.judged;
 var wrong=t.judged-t.right;
 var h='<h2>Results</h2><div class="card"><div class="big">'+t.right+' / '+t.total+' <span class="pct">('+Math.round(100*t.right/t.total)+'%)</span></div>';
 h+='<div>Right: '+t.right+' \u00b7 Wrong: '+wrong+' \u00b7 Unmarked (counted as missed): '+un+'</div></div>';
 var bs=agg(function(x){return[x.st.label];});
 h+=tbl('By station',D.stations.map(function(s){return{n:s.label,e:bs[s.label]};}));
 var sub=agg(function(x){var s={};x.q.tags.forEach(function(t){s[LEC[t].subject]=1;});return Object.keys(s);});
 var subs=[];D.lectures.forEach(function(l){if(subs.indexOf(l.subject)<0)subs.push(l.subject);});
 h+=tbl('By subject',subs.map(function(s){return{n:s,e:sub[s]};}));
 var lec=agg(function(x){return x.q.tags;});
 h+=tbl('By lecture',D.lectures.map(function(l){return{n:l.subject+' \u00b7 '+l.name,e:lec[l.id]};}));
 h+='<p class="info">A question with several tags counts toward each of its tags.</p>';
 h+='<h3>My mistakes by lecture</h3>';
 var any=false;
 D.lectures.forEach(function(l){
  var ms=PARTS.filter(function(x){return x.q.tags.indexOf(l.id)>=0&&S.mark[x.k]!==1;});
  if(!ms.length)return;any=true;
  h+='<h4>'+esc(l.subject+' \u00b7 '+l.name)+' ('+ms.length+')</h4>';
  ms.forEach(function(x){
   var m=S.mark[x.k];
   h+='<div class="mis"><div class="st">'+esc(x.st.label)+' \u00b7 Q'+x.q.id+' \u00b7 '+(m===0?'<span class="bad">Wrong</span>':'<span class="bad">Not marked</span>')+'</div>';
   h+='<div><b>'+esc(x.p.l)+'</b></div>';
   h+='<div>'+(x.p.acc.length>1&&x.p.any?'Any one of: ':'Answer: ')+esc(x.p.acc.map(function(a){return a.a;}).join(' / '))+'</div>';
   if(S.ans[x.q.id])h+='<div class="dim">You wrote: '+esc(S.ans[x.q.id])+'</div>';
   h+='</div>';});
 });
 if(!any)h+='<p>No mistakes recorded. Well done.</p>';
 h+='<div class="pager"><button class="btn" data-act="back">\u2190 Back to stations</button><button class="btn" data-act="reset">'+(confirmReset?'Tap again to erase everything':'Reset all answers and marks')+'</button></div>';
 $('stage').innerHTML=h;
}
function render(){if(S.view==='results')renderResults();else renderStation();updateNav();updateBar();window.scrollTo(0,0);}

document.addEventListener('click',function(e){
 var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
 var a=b.getAttribute('data-act');
 if(a==='go'){S.view='station';S.cur=+b.getAttribute('data-i');confirmReset=false;save();render();}
 else if(a==='back'){S.view='station';render();}
 else if(a==='rev'){var q=b.getAttribute('data-q');S.rev[q]=!S.rev[q];save();refreshCard(q);updateNav();}
 else if(a==='chip'){var k=b.getAttribute('data-k');S.open[k]=!S.open[k];save();refreshCard(b.getAttribute('data-q'));}
 else if(a==='mark'){var k2=b.getAttribute('data-k'),v=+b.getAttribute('data-v');if(S.mark[k2]===v)delete S.mark[k2];else S.mark[k2]=v;save();refreshCard(b.getAttribute('data-q'));updateBar();updateNav();}
 else if(a==='reset'){if(!confirmReset){confirmReset=true;renderResults();}else{S.ans={};S.rev={};S.mark={};S.open={};S.cur=0;S.view='station';confirmReset=false;save();render();}}
});
$('fin').addEventListener('click',function(){S.view='results';confirmReset=false;render();});
document.addEventListener('input',function(e){var t=e.target;if(t.tagName==='TEXTAREA'){S.ans[t.getAttribute('data-q')]=t.value;save();updateNav();}});
document.addEventListener('keydown',function(e){var t=e.target;if(t.tagName==='TEXTAREA'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();var q=t.getAttribute('data-q');S.rev[q]=true;S.ans[q]=t.value;save();refreshCard(q);updateNav();}});
buildNav();render();
})();
</script>
</body>
</html>
