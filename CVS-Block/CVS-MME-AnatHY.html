Q(1,"Anatomy","Anatomy of Mediastinal Structures","A patient has a tumor in the superior mediastinum. Which structure lies immediately anterior to the esophagus at this level?",[

Q(2,"Anatomy","Anatomy of Mediastinal Structures","Which of the following events occurs at the plane of Ludwig (transverse thoracic plane, T4/T5)?",[
["The esophagus passes through the diaphragm","No: This occurs at T10 (esophageal hiatus)."],
["The inferior vena cava passes through the diaphragm","No: This occurs at T8 (caval hiatus)."],
["The trachea bifurcates into left and right primary bronchi","Yes: The plane of Ludwig marks the bifurcation of the trachea (carina)."],

Q(3,"Anatomy","Anatomy of Major Vessels","Which artery passes through the transverse foramina of the upper 6 cervical vertebrae and enters the cranial cavity via the foramen magnum to supply the brain?",[

["Vertebral artery","Yes: It arises from the 1st part of the subclavian, ascends through C1-C6 foramina, and enters via the foramen magnum."],
["Deep cervical artery","No: It anastomoses with the occipital artery in the neck."],

["Superior intercostal artery","No: It supplies the upper intercostal spaces."]],1,"Focus: Vertebral artery (the only A. mentioned that supplies the brain)."),
Q(4,"Anatomy","Anatomy of Major Vessels","Which of the following is a direct branch of the third part of the subclavian artery?",[
["Thyrocervical trunk","No: It arises from the first part of the subclavian artery."],
["Costocervical trunk","No: It arises from the second part of the subclavian artery."],
["Vertebral artery","No: It arises from the first part of the subclavian artery."],
["Dorsal scapular artery","Yes: The dorsal scapular (descending scapular) artery is the usual branch of the third part of the subclavian."],
["Internal thoracic artery","No: It arises from the first part of the subclavian artery."]],3,"Focus: Branches of 3rd subclavian / Dorsal descending scapular A."),
Q(5,"Anatomy","Anatomy of Major Vessels","Which of the following veins drains directly into the superior vena cava (SVC)?",[

["Accessory hemiazygos vein","No: It drains into the azygos vein."],
["Azygos vein","Yes: The azygos vein arches over the right lung root and empties directly into the SVC."],
["Left superior intercostal vein","No: It drains into the left brachiocephalic vein."],
["Right internal thoracic vein","No: It drains into the right brachiocephalic vein."]],2,"Focus: Tributaries of azygous vein / What drains to SVC."),
Q(6,"Anatomy","Anatomy of Major Vessels","Which of the following is NOT a tributary of the azygos vein?",[

["Hemiazygos vein","No: It is a tributary of the azygos vein."],
["Accessory hemiazygos vein","No: It is a tributary of the azygos vein."],
["Right ascending lumbar vein","No: It helps form the azygos vein."],
["Left superior intercostal vein","Yes: The left superior intercostal vein drains into the left brachiocephalic vein, not the azygos."]],4,"Focus: Tributaries of azygous vein."),
Q(7,"Anatomy","Anatomy of Major Vessels","The thoracic duct usually drains into the venous system at the junction of which two veins?",[

Q(8,"Anatomy","Anatomy of Major Vessels","A patient has a laceration to the third part of the subclavian artery. Which artery is most likely to be affected?",[
