<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CVS Mock Exam 1</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#171a1f;--mute:#5a6371;--line:#d6dbe3;--acc:#2a56c6;--ok:#14784a;--okbg:#e2f4ea;--bad:#b3261e;--badbg:#fce8e6;--trk:#e3e7ee;--note:#fff4d6;--noteink:#6b4e00;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--card:#171c23;--ink:#e8ebf0;--mute:#9aa4b2;--line:#2b333e;--acc:#7da2ff;--ok:#5fd394;--okbg:#10301f;--bad:#ff8a80;--badbg:#3a1714;--trk:#27303b;--note:#352b0c;--noteink:#f0d58a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1318;--card:#171c23;--ink:#e8ebf0;--mute:#9aa4b2;--line:#2b333e;--acc:#7da2ff;--ok:#5fd394;--okbg:#10301f;--bad:#ff8a80;--badbg:#3a1714;--trk:#27303b;--note:#352b0c;--noteink:#f0d58a;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px 0}
.bar{max-width:720px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ttl b{display:block;font-size:16px}.ttl span{font-size:12.5px;color:var(--mute)}
.ctl{display:flex;align-items:center;gap:10px}
#cnt{font-size:14px;font-variant-numeric:tabular-nums}
#rs{font:inherit;font-size:14px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.trk{height:5px;background:var(--trk);margin:10px -16px 0}
.trk i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}
main,#sc{max-width:720px;margin:0 auto;padding:16px}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.qh{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.qn{font-weight:700;color:var(--acc);margin-right:4px}
.chip{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.stem{margin:0 0 12px;font-weight:500}
.qi{display:block;max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line);margin:0 0 12px}
.opt{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;margin:8px 0;cursor:pointer}
.opt:focus-visible,#rs:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:10px;align-items:flex-start}
.L{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:600}
.t{flex:1}
.mk{flex:none;font-size:12.5px;font-weight:700}
.ex{display:none;margin:6px 0 0 36px;font-size:13.5px;color:var(--mute)}
.done .opt{cursor:default}.done .ex{display:block}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .L{background:var(--ok);border-color:var(--ok);color:var(--card)}.opt.ok .mk{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}.opt.bad .L{background:var(--bad);border-color:var(--bad);color:var(--card)}.opt.bad .mk{color:var(--bad)}
.note{display:none;margin-top:10px;padding:9px 12px;border-radius:10px;background:var(--note);color:var(--noteink);font-size:13.5px}
.done .note{display:block}
#sc{padding-bottom:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.big{font-size:44px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.vd{margin:6px 0 0;color:var(--mute)}
.bk h3{margin:22px 0 8px;font-size:15px}
.br{margin:10px 0}.bt{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.mu{color:var(--mute);font-size:12.5px}
.bb{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--trk);margin:4px 0 2px}
.bb .g{background:var(--ok)}.bb .rd{background:var(--bad)}
.flt{max-width:720px;margin:0 auto;padding:12px 16px 0}.fh{font-size:13px;color:var(--mute);margin-top:6px}.fr{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.fchip{font:inherit;font-size:13px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}.fchip.on{background:var(--acc);border-color:var(--acc);color:var(--card)}
.chip.hy{border-color:var(--bad);color:var(--bad);font-weight:700}.q[hidden]{display:none}
</style></head><body>

const Q=(n,s,l,q,o,a,note,img,alt)=>({n,s,l,q,o,a,note,img,alt});
const MED="Anatomy of Mediastinal Structures",PER="Pericardium and External Features of the Heart",INT="Anatomy of Internal Structures of the Heart",COR="Coronary Circulation",CON="Innervation and Conducting System of the Heart",E1="Embryology of the Heart & CHD-1",E2="Embryology of the Heart & CHD-2",PCM="Properties of the Cardiac Muscle",PCS="Physiology of the Conductive System of the Heart",PCO="Physiology of the Cardiac Output",ATH="Pathology of Atherosclerosis",VAS="Pathology of Vasculitis and Diseases of Veins",IE="Infective Endocarditis",MIC="Microbiome in CVS Diseases",PCC="Physiology of the Cardiac Cycle",VES="Anatomy of the Major Vessels",TUM="Pathology of Vascular Tumors and Diseases of Lymphatics",HTN="Pathology of Hypertension";
const QS=[
Q(1,"Anatomy",CON,"Where is the sinoatrial (SA) node located on the external surface of the right atrium?",[
["Lower end of the sulcus terminalis, near the IVC","No: the lower end of the sulcus is near the IVC opening; the SA node sits at the upper end."],
["Opening of the coronary sinus","No: this region belongs to the AV node territory, not the SA node."],
["Upper end of the sulcus terminalis","Yes: the SA node lies at the SVC–right atrium junction, at the upper end of the sulcus terminalis."],
["Lower end of the interatrial septum","No: the lower interatrial septum is where the AV node lies."],
["Apex of the triangle of Koch","No: the apex of Koch’s triangle marks the AV node."]],2,
"Source offered “upper end of the sulcus terminalis” and “upper end of the crista terminalis”, which are the same site seen from outside and inside. I dropped the crista option and reworded the stem to “external surface” so only one answer fits."),
Q(2,"Physiology",PCS,"After complete heart block, the ventricles beat at about 30 bpm. Which structure generates this ventricular rhythm?",[
["SA node","No: the SA node (60–100 bpm) paces the atria, which are now disconnected from the ventricles."],
["AV node","No: the AV node (about 40–60 bpm) is at or above the block and is faster than 30 bpm."],
["Bundle of His","No: His bundle escape rhythms are usually about 40–50 bpm, faster than 30 bpm."],
["Purkinje fibers","Yes: ventricular escape pacemakers (Purkinje fibers) fire at roughly 15–40 bpm."],
["Internodal pathways","No: these conduct impulses between nodes; they do not generate a rhythm."]],3),
Q(3,"Physiology",PCM,"Hypercalcemia increases the strength of myocardial contraction. What is the mechanism?",[
["Potassium influx","No: K⁺ influx repolarizes the cell and does not strengthen contraction."],
["Increased intracellular calcium","Yes: more Ca²⁺ entry through L-type channels triggers more Ca²⁺-induced Ca²⁺ release, so contraction is stronger."],
["Sodium leak","No: Na⁺ leak underlies pacemaker depolarization, not contractile force."],
["Calcium efflux","No: Ca²⁺ efflux lowers intracellular Ca²⁺ and weakens contraction."],
["Reduced calcium release from the sarcoplasmic reticulum","No: less SR release would weaken contraction."]],1,
"Source option “inhibition of Na/Ca exchanger” also raises intracellular Ca²⁺ (the digoxin mechanism), so I replaced it with a clearly wrong option."),
Q(4,"Anatomy",MED,"Which structure lies immediately anterior to the esophagus in the superior mediastinum?",[
["Thoracic duct","No: the thoracic duct lies behind and to the left of the esophagus."],
["Brachiocephalic vein","No: the left brachiocephalic vein crosses higher and further anterior."],
["Superior vena cava","No: the SVC lies to the right, not directly in front of the esophagus."],
["Brachiocephalic artery","No: it lies anterior to the trachea, which separates it from the esophagus."],
["Trachea","Yes: the trachea lies directly anterior to the esophagus."]],4),
Q(5,"Pathology",ATH,"A 58-year-old woman has had chest pain at rest for the past year. The image shows the microscopic appearance of her left anterior descending artery (arrow). Which laboratory finding is most likely involved in the pathogenesis of the process illustrated?",[
["High platelet count","No: thrombocytosis promotes thrombosis but does not drive atheroma formation."],
["Low Lp(a)","No: it is elevated Lp(a) that is atherogenic."],
["High HDL cholesterol","No: HDL is protective through reverse cholesterol transport."],
["Low HDL cholesterol","Yes: low HDL impairs removal of cholesterol from the intima and is a risk factor for atheroma."],
["Low LDL cholesterol","No: low LDL is protective; high LDL drives atheroma."]],3,

Q(6,"Pathology",VAS,"Which histologic feature best characterizes giant cell (temporal) arteritis?",[
["Segmental fibrinoid necrosis of the vessel wall","No: segmental fibrinoid necrosis is the hallmark of polyarteritis nodosa."],
["Necrotizing granulomas rich in eosinophils","No: that pattern is seen in eosinophilic granulomatosis with polyangiitis."],
["Neutrophilic microabscesses","No: microabscesses are not a feature of giant cell arteritis."],
["Leukocytoclastic inflammation of small vessels","No: that is typical of hypersensitivity (small-vessel) vasculitis."],
["Granulomatous inflammation of the media with giant cells","Yes: giant cells and granulomas cluster around the media and internal elastic lamina, often fragmenting it."]],4,
"Source answer kept. Its distractor “transmural granulomatous inflammation” is also used in some textbooks, so I removed it and reworded the stem to “histologic feature”. Tell me if your lecture used the transmural wording."),
Q(7,"Pathology",ATH,"Autopsy studies show evidence of atheroma formation can begin even in children. What is the first visible gross evidence of atheroma formation?",[
["Fatty streak","Yes: fatty streaks (foam cell collections) are the earliest visible lesion and appear in childhood."],
["Hemorrhage","No: plaque hemorrhage is a late complication."],
["Ulceration","No: ulceration occurs in advanced, complicated plaques."],
["Thrombus","No: thrombosis follows plaque rupture or ulceration."],
["Calcification","No: calcification develops in established plaques."]],0),
Q(8,"Embryology",E2,"A 3-month-old infant has cyanosis, an overriding aorta, right ventricular outflow obstruction, and a large ventricular septal defect. What is the most likely diagnosis?",[
["Transposition of the great arteries","No: the aorta arises from the RV, with no RVOT obstruction or overriding aorta."],
["Truncus arteriosus","No: a single arterial trunk overrides a VSD; there is no separate pulmonary outflow obstruction."],
["Tetralogy of Fallot","Yes: VSD, overriding aorta, RVOT obstruction and RV hypertrophy, from anterosuperior displacement of the infundibular septum."],
["Tricuspid atresia","No: there is no right AV connection and the RV is hypoplastic."],
["Total anomalous pulmonary venous return","No: the problem is pulmonary vein drainage, not an overriding aorta."]],2,
"Source had no options and wrote “ventral septal defect”; I read it as ventricular and wrote five options."),
Q(9,"Embryology",E1,"A 19-year-old woman has an interatrial communication with intermittent shunting during the Valsalva maneuver (a probe-patent foramen ovale). Which structure failed to fuse with the septum secundum?",[
["Septum spurium","No: it is a right venous valve remnant that helps form the crista terminalis."],
["Endocardial cushions","No: cushion defects cause ostium primum and AV canal defects, not Valsalva-dependent shunting."],
["Aorticopulmonary septum","No: it divides the outflow tract."],
["Muscular interventricular septum","No: it separates the ventricles."],
["Septum primum","Yes: failure of the septum primum to fuse with the septum secundum leaves a probe-patent foramen ovale that opens when right atrial pressure rises."]],4,
"Source option “septum sperium” read as septum spurium. I reworded the stem to “fail to fuse with the septum secundum”, since both septa are involved. Lecture split (CHD-1 vs CHD-2) is my assumption."),
Q(10,"Pathology",VAS,"A 19-year-old woman has myalgia, arthritis, cold upper extremities and weakened radial pulses. MRA shows 75% stenosis of the main branches of the aorta. What is the diagnosis?",[
["Kawasaki disease","No: it affects young children and the coronary arteries."],
["Polyarteritis nodosa","No: it affects medium visceral arteries and spares the aorta and its large branches."],
["Takayasu arteritis","Yes: young woman, aortic branch stenosis, weak pulses and systemic symptoms fit Takayasu (pulseless disease)."],
["Giant cell arteritis","No: it occurs after age 50 and mainly involves temporal and cranial arteries."],
["Buerger disease","No: it affects distal limb vessels in young male smokers."]],2,
"Source had 4 options; I added Kawasaki disease as a fifth."),
Q(11,"Microbiology",IE,"A patient with SLE has small sterile vegetations on the mitral valve. What is the diagnosis?",[
["Libman–Sacks endocarditis","Yes: SLE causes small sterile verrucous vegetations on either side of the valve, typically mitral."],
["Nonbacterial thrombotic (marantic) endocarditis","No: it occurs with malignancy or hypercoagulable states, along the closure lines."],
["Rheumatic heart disease","No: it follows streptococcal infection, with small vegetations and Aschoff bodies."],
["Acute infective endocarditis","No: vegetations are large and friable and contain organisms."],
["Carcinoid heart disease","No: it causes plaque-like fibrosis of right-sided valves."]],0,
"Source had no options; I wrote five. Tagged under Infective Endocarditis as the closest lecture."),
Q(12,"Microbiology",IE,"A patient had valve surgery. Forty-five days later he presents with fever, weight loss and nail (splinter) hemorrhages. A coagulase-negative staphylococcus is isolated. Which organism is most likely?",[
["Viridans streptococci","No: they are streptococci that mainly infect damaged native valves."],
["Staphylococcus epidermidis","Yes: this coagulase-negative staphylococcus colonizes prosthetic material and is a classic cause of early prosthetic valve endocarditis."],
["Staphylococcus aureus","No: S. aureus is coagulase-positive."],
["Staphylococcus saprophyticus","No: this coagulase-negative species causes urinary tract infection, not prosthetic valve infection."],
["Enterococcus faecalis","No: it is not a staphylococcus and typically follows GI or GU procedures."]],1,
"Source had 2 options and wrote “S. epidermis”. I reworded the stem to “coagulase-negative staphylococcus” because streptococci also lack coagulase, and added 3 options."),
Q(13,"Microbiology",IE,"An IV drug user has tricuspid valve vegetations and nodules on the fingers. What is the most likely causative organism?",[
["Viridans streptococci","No: they usually infect damaged left-sided valves after dental procedures."],
["Enterococcus faecalis","No: it is linked to GI or GU instrumentation, mainly in older patients."],
["Staphylococcus aureus","Yes: S. aureus is the commonest cause of right-sided endocarditis in IV drug users."],
["Staphylococcus epidermidis","No: it targets prosthetic valves and indwelling catheters."],
["Streptococcus gallolyticus (bovis)","No: it is associated with colon cancer and left-sided disease."]],2,
"Source had no options and wrote “S. aurus”; I wrote five."),
Q(14,"Microbiology",IE,"A patient with suspected endocarditis has negative blood cultures for 7 days. Molecular testing identifies Aggregatibacter. What is the diagnosis?",[
["Libman–Sacks endocarditis","No: it is sterile, so no organism would be found."],
["Acute endocarditis caused by Staphylococcus aureus","No: S. aureus grows quickly in routine cultures."],
["Endocarditis caused by Coxiella burnetii","No: Coxiella is another culture-negative cause, but the molecular result here is Aggregatibacter."],
["Native valve endocarditis caused by a fastidious HACEK organism","Yes: Aggregatibacter belongs to HACEK (Haemophilus, Aggregatibacter, Cardiobacterium, Eikenella, Kingella), slow-growing causes of culture-negative endocarditis."],
["Prosthetic valve endocarditis caused by S. epidermidis","No: S. epidermidis grows in standard cultures and this is a native valve."]],3,
"Source wrote “Aggregator bacterium”; I read it as Aggregatibacter. Source had no options; I wrote five."),
Q(15,"Microbiology",MIC,"A patient has atherosclerotic cardiovascular disease despite normal cholesterol levels. Which gut microbiota-derived metabolite, formed from histidine, is implicated?",[
["TMAO","No: TMAO (from choline and carnitine) is also linked to CVD, but it is not formed from histidine."],
["Butyrate","No: this short-chain fatty acid is protective."],
["Indole-3-propionate","No: this tryptophan metabolite is associated with protection."],
["Urolithin A","No: this polyphenol metabolite has beneficial effects."],
["Imidazole propionate (ImP)","Yes: microbes make ImP from histidine; it is raised in atherosclerosis and promotes it independent of cholesterol."]],4,
"FLAG: source answer is ImP, but TMAO is the classic answer to the original stem, so it was ambiguous. I kept ImP and added “formed from histidine” so only it fits. If your lecture taught TMAO here, tell me and I will switch it."),
Q(16,"Anatomy",INT,"A muscular bridge crosses the right ventricle from the lower interventricular septum to the anterior papillary muscle. What is this structure and its function?",[
["Supraventricular crest: separates the inflow and outflow parts of the RV","No: the crest lies between the tricuspid and pulmonary valves; it is not a septum-to-papillary bridge."],
["Moderator band (septomarginal trabecula): carries right bundle branch fibers","Yes: it carries the right bundle branch to the anterior papillary muscle and helps prevent overdistension of the RV."],
["Chordae tendineae: anchor valve cusps","No: chordae are thin cords from papillary muscles to the cusps."],
["Pectinate muscles: enhance atrial contraction","No: pectinate muscles are in the atrial wall."],
["Papillary muscle: prevents valve eversion","No: papillary muscles are conical projections, not a bridge across the cavity."]],1,
"Source had no options; I wrote five."),
Q(17,"Anatomy",INT,"Muscular ridges in the right atrial wall extend up to the crista terminalis. What are they and what is their function?",[
["Trabeculae carneae: prevent blood turbulence","No: trabeculae carneae are ventricular ridges, not atrial."],
["Papillary muscles: prevent valve eversion","No: papillary muscles are in the ventricles."],
["Valve of the IVC: directs blood to the foramen ovale","No: this is a thin fold at the IVC opening, not a muscular ridge."],
["Pectinate muscles: enhance atrial contraction","Yes: they run off the crista terminalis and increase the force of atrial contraction without thickening the wall."],
["Chordae tendineae: anchor valve cusps","No: chordae are tendinous cords in the ventricles."]],3,
"Source had 2 options; I added 3."),
Q(18,"Anatomy",MED,"Which of the following begins at the level of the sternal angle?",[
["Azygos vein","No: it begins in the posterior abdominal wall and only arches over the right hilum to reach the SVC at T4."],
["Thoracic duct","No: it begins at the cisterna chyli (L1) and merely crosses from right to left near this level."],
["Arch of the aorta","Yes: the aortic arch begins (and ends) at the level of the sternal angle, T4/T5."],
["Superior vena cava","No: it forms higher, behind the right first costal cartilage."],
["Left brachiocephalic vein","No: it begins behind the sternoclavicular joint, well above the sternal angle."]],2,
"Source options 1 (arch of aorta) and 3 (thoracic duct crossing right to left) are both true at the sternal angle, and “azygos forms” is inaccurate. I reworded the stem to “begins” and rewrote the options so only the aortic arch fits."),
Q(19,"Anatomy",PER,"Which structure lies directly external to the pericardial cavity?",[
["Visceral serous pericardium (epicardium)","No: it lines the cavity on the heart side."],
["Fibrous pericardium","No: it lies outside the parietal layer, not directly against the cavity."],
["Parietal serous pericardium","Yes: the cavity lies between the visceral and parietal layers, so the parietal layer is directly external to it."],
["Mediastinal pleura","No: it lies further out, outside the fibrous pericardium."],
["Endocardium","No: it lines the heart chambers."]],2,
"Source had 4 options; I added mediastinal pleura as a fifth."),
Q(20,"Anatomy",COR,"Stenosis of the left circumflex artery would most probably affect which area?",[
["Lateral wall of the left ventricle","Yes: the circumflex supplies the lateral left ventricle through the obtuse marginal branches."],
["Anterior two-thirds of the interventricular septum","No: this is the LAD territory."],
["Posterior wall of the right ventricle","No: the RCA supplies the posterior right ventricle."],
["Anterior wall of the left ventricle","No: the LAD and its diagonal branches supply the anterior wall."],
["Inferior wall of the left ventricle in a right-dominant heart","No: the PDA from the RCA supplies it."]],0,
"Source had 3 options; I added 2."),
Q(21,"Anatomy",COR,"A 55-year-old man undergoes coronary angiography and is found to be right-dominant. Which artery supplies most of the posterior interventricular septum and the posterior wall of the left ventricle?",[
["Conus artery","No: it supplies the right ventricular outflow tract."],
["Diagonal artery","No: it is an LAD branch to the anterolateral left ventricle."],
["Left anterior descending artery","No: the LAD supplies the anterior wall and anterior two-thirds of the septum."],
["Left circumflex artery","No: it would supply this area only in a left-dominant heart."],
["Right coronary artery","Yes: in right dominance the RCA gives the PDA, which supplies the posterior septum and inferoposterior left ventricle."]],4),
Q(22,"Pathology",VAS,"Which feature is most characteristic of polyarteritis nodosa?",[
["ANCA-associated necrotizing inflammation of small vessels","No: that describes GPA, MPA and EGPA; PAN is ANCA-negative."],
["Immune complex–mediated segmental necrotizing inflammation of medium-sized muscular arteries","Yes: PAN shows segmental transmural fibrinoid necrosis of medium arteries, often immune complex–related (e.g. hepatitis B) and sparing the lungs."],
["Granulomatous inflammation of the aorta and its major branches in young women","No: that is Takayasu arteritis."],
["Thrombosing inflammation of distal limb vessels in smokers","No: that is Buerger disease."],
["Temporal artery giant cells in patients over 50","No: that is giant cell arteritis."]],1,
"Source answer kept, and I widened it to include “segmental necrotizing inflammation”. Source distractor was ANCA small-vessel vasculitis; I added three others. Immune complexes are only identified in a minority of PAN cases."),
Q(23,"Physiology",PCO,"Which cardiac adaptation mainly allows an athlete to reach a cardiac output of 35 L/min, almost double that of a normal fit person?",[
["Increased total peripheral resistance","No: higher resistance would reduce flow, not raise output."],
["Chronic sympathetic overactivity","No: trained athletes have increased vagal tone and lower resting sympathetic activity."],
["Hypertrophy of cardiac cells with increased contractile strength","Yes: a larger, stronger ventricle raises stroke volume, the main reason for the higher maximal output."],
["Higher maximal heart rate","No: maximal heart rate does not rise with training."],
["Increased blood volume","No: plasma volume does rise, but it is not a cardiac adaptation."]],2,
"Source option “more blood volume” is partly true in athletes, so I reworded the stem to “cardiac adaptation”. Source answer kept."),
Q(24,"Anatomy",CON,"Angina pain is referred to the chest and the medial aspect of the left arm. What is the reason?",[
["Vagal afferents carry cardiac pain straight to the brainstem","No: vagal afferents mediate cardiac reflexes, not the pain of angina."],
["The phrenic nerve carries cardiac pain from C3–C5","No: phrenic afferents refer pericardial and diaphragmatic pain to the shoulder."],
["Ischemia spreads directly to the pectoral and arm muscles","No: this does not explain the dermatomal pattern."],
["Visceral cardiac afferents and somatic afferents enter the same spinal cord segments","Yes: cardiac pain fibers (T1–T4) converge with somatic fibers from the chest and medial arm, so the brain misplaces the source."],
["Cardiac pain fibers synapse directly onto cutaneous nerves in the arm","No: convergence happens in the spinal cord, not in peripheral nerves."]],3,
"Source had no options; I wrote five."),
Q(25,"Pathology",ATH,"An elderly man with obesity and hypertension develops stenosis in one of his arteries. The image shows the lesions. What microscopic findings are expected?",[
["Lipid deposition with smooth muscle proliferation under a fibrous cap","Yes: atheromas contain lipid-laden foam cells and extracellular lipid, with smooth muscle proliferation and collagen forming the cap."],
["Cystic medial degeneration","No: this occurs in Marfan syndrome and aortic dissection."],
["Granulomatous inflammation with giant cells","No: this suggests giant cell or Takayasu arteritis."],
["Fibrinoid necrosis with neutrophils","No: this suggests polyarteritis nodosa or other necrotizing vasculitis."],
["Onion-skin hyperplasia of arteriolar walls","No: this is malignant hypertension of small arterioles, not the plaques shown."]],0,

Q(26,"Physiology",PCS,"Which event does the P wave on the ECG represent?",[
["Ventricular repolarization","No: ventricular repolarization is the T wave."],
["Atrial repolarization","No: it is small and hidden within the QRS complex."],
["Ventricular depolarization","No: ventricular depolarization is the QRS complex."],
["Atrial depolarization","Yes: the P wave is atrial depolarization, spreading from the SA node."],
["AV nodal conduction delay","No: this is the isoelectric PR segment."]],3,
"Source had 4 options; I added a fifth."),
Q(27,"Physiology",PCC,"What causes the c wave in the atrial (jugular) pressure tracing?",[
["Atrial contraction","No: atrial contraction produces the a wave."],
["Bulging of the AV valve into the atrium","Yes: during isovolumetric contraction the closed AV valve bulges into the atrium and raises atrial pressure."],
["Venous return when the tricuspid valve is open","No: filling through an open valve is the y descent."],
["Venous return filling the atrium while the AV valve is closed","No: filling against a closed AV valve produces the v wave."],
["Closure of the pulmonary valve","No: this does not affect atrial pressure."]],1,
"Source had 2 options; I added 3."),
Q(28,"Anatomy",VES,"Which vein drains into the superior vena cava?",[
["Hemiazygos vein","No: the hemiazygos drains into the azygos vein, not directly into the SVC."],
["Great cardiac vein","No: it drains into the coronary sinus."],
["Azygos vein","Yes: the azygos vein arches over the right main bronchus to enter the SVC."],
["Right gonadal vein","No: it drains into the IVC."],
["Left renal vein","No: it drains into the IVC."]],2,
"Source had no options; I wrote five. Tagged Major Vessels (the SVC and its tributaries)."),
Q(29,"Physiology",PCM,"What term describes the ability of cardiac cells to generate action potentials spontaneously?",[
["Excitability","No: excitability is the ability to respond to a stimulus."],
["Conductivity","No: conductivity is propagating an impulse from cell to cell."],
["Contractility","No: contractility is the ability to generate force."],
["Lusitropy","No: lusitropy is the rate of relaxation."],
["Autorhythmicity (automaticity)","Yes: spontaneous action potential generation, as in pacemaker cells."]],4,
"Source had no options; I wrote five."),
Q(30,"Physiology",PCM,"Inhibition of L-type calcium channels in a ventricular myocyte would mainly affect which phase of the cardiac action potential?",[
["Resting phase (phase 4)","No: phase 4 is held near −90 mV by the inward rectifier K⁺ current."],
["Early repolarization (phase 1)","No: phase 1 is transient K⁺ efflux."],
["Plateau (phase 2)","Yes: Ca²⁺ influx through L-type channels sustains the plateau."],
["Rapid repolarization (phase 3)","No: phase 3 is K⁺ efflux."],
["Depolarization (phase 0)","No: in ventricular myocytes phase 0 is fast Na⁺ influx."]],2,
"I added “in a ventricular myocyte”: in SA and AV nodal cells L-type Ca²⁺ channels do drive phase 0."),
Q(32,"Physiology",PCS,"Which ionic event primarily drives the initial spontaneous depolarization of cardiac pacemaker cells?",[
["Slow Na⁺ leak through funny channels (If)","Yes: HCN channels let Na⁺ in as the cell hyperpolarizes, creating the pacemaker potential."],
["Rapid Ca²⁺ influx through L-type channels","No: this drives phase 0 once threshold is reached."],
["K⁺ efflux through delayed rectifier channels","No: K⁺ efflux repolarizes the cell."],
["Rapid Na⁺ influx through fast voltage-gated channels","No: nodal cells largely lack fast Na⁺ channels."],
["Cl⁻ influx","No: chloride movement is not part of the pacemaker potential."]],0,
"Source had no options; I wrote five."),
Q(33,"Physiology",PCC,"The S4 heart sound is heard when:",[
["The AV valves close","No: AV valve closure produces S1."],
["The semilunar valves close","No: semilunar closure produces S2."],
["Rapid passive ventricular filling occurs","No: this produces S3."],
["The atria pump against stiffened ventricles","Yes: S4 is a late-diastolic sound from atrial contraction into a stiff, noncompliant ventricle."],
["The mitral valve opens","No: normal valve opening is silent; an opening snap occurs in mitral stenosis."]],3,
"Source had 3 options; I added 2."),
Q(34,"Pathology",HTN,"In the RAAS, aldosterone acting on the kidney helps regulate blood pressure through which mechanism?",[
["Direct vasoconstriction of arterioles","No: that is angiotensin II."],
["Natriuresis and diuresis","No: that is the action of ANP and BNP."],
["Retention of sodium and water","Yes: aldosterone increases Na⁺ reabsorption in the collecting duct, water follows, and volume and BP rise."],
["Sodium excretion with potassium retention","No: aldosterone does the opposite, retaining Na⁺ and excreting K⁺."],
["Stimulation of thirst","No: that is angiotensin II acting on the hypothalamus."]],2,
"Source had no options; I wrote five. Tagged Pathology of Hypertension (BP-regulating hormones): confirm if your lecture put RAAS elsewhere."),
Q(35,"Pathology",HTN,"Which pair of actions best describes B-type natriuretic peptide (BNP)?",[
["Natriuresis and vasodilation","Yes: BNP promotes sodium excretion and relaxes vascular smooth muscle, lowering BP and preload."],
["Sodium retention and vasoconstriction","No: this is the opposite of BNP."],
["Increased aldosterone secretion","No: BNP suppresses aldosterone."],
["Increased renin release","No: BNP inhibits renin release."],
["Water retention through ADH release","No: BNP opposes ADH."]],0,
"Source was just “BNP”; I turned it into a question and wrote five options. Tagged Pathology of Hypertension: confirm."),
Q(36,"Pathology",HTN,"Which hormone, released by atrial myocytes in response to stretch, lowers blood pressure by inhibiting renal sodium and water reabsorption?",[
["ADH (vasopressin)","No: ADH increases water reabsorption."],
["Aldosterone","No: aldosterone increases sodium and water retention."],
["Angiotensin II","No: it raises BP by vasoconstriction and aldosterone release."],
["Atrial natriuretic peptide (ANP)","Yes: ANP inhibits renal Na⁺ reabsorption (water follows) and dilates vessels."],
["Epinephrine","No: it raises cardiac output and constricts most vessels."]],3,
"Source had 2 options and ANP as correct. ANP acts mainly by blocking sodium reabsorption with water following, so I reworded the stem and added 3 options. Tagged Pathology of Hypertension: confirm."),
Q(37,"Physiology",PCS,"Which part of the cardiac conduction system has the slowest conduction velocity?",[
["Atrial muscle","No: about 0.3 m/s."],
["AV node","Yes: about 0.05 m/s, producing the delay that lets the ventricles fill."],
["Bundle of His","No: about 1 m/s."],
["Purkinje fibers","No: these are the fastest, about 2–4 m/s."],
["Ventricular muscle","No: about 0.3–0.5 m/s."]],1,
"Source had no options; I wrote five and left out the SA node as a distractor because its conduction is also slow."),
Q(38,"Physiology",PCO,"In hemorrhage, which mechanism is primarily responsible for the decrease in cardiac output?",[
["Compensatory decrease in heart rate","No: heart rate rises through sympathetic reflexes."],
["Decreased venous return and preload","Yes: blood loss lowers venous return and preload, so stroke volume and cardiac output fall (Frank–Starling)."],
["Direct loss of myocardial contractility","No: contractility is increased by sympathetic activation early in hemorrhage."],
["Acute valvular regurgitation","No: valve function is unaffected."],
["Excess vagal slowing from baroreceptor activation","No: baroreceptor unloading increases sympathetic outflow and reduces vagal tone."]],1,
"Source had 2 options; I added 3."),
Q(39,"Anatomy",MED,"A tumor in the posterior mediastinum is most likely to compress which structure?",[
["Trachea","No: the trachea lies in the superior mediastinum."],
["Thymus","No: the thymus lies in the anterior and superior mediastinum."],
