<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#171a1f;--mute:#5a6371;--line:#d6dbe3;--acc:#2a56c6;--ok:#14784a;--okbg:#e2f4ea;--bad:#b3261e;--badbg:#fce8e6;--trk:#e3e7ee;--note:#fff4d6;--noteink:#6b4e00;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--card:#171c23;--ink:#e8ebf0;--mute:#9aa4b2;--line:#2b333e;--acc:#7da2ff;--ok:#5fd394;--okbg:#10301f;--bad:#ff8a80;--badbg:#3a1714;--trk:#27303b;--note:#352b0c;--noteink:#f0d58a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1318;--card:#171c23;--ink:#e8ebf0;--mute:#9aa4b2;--line:#2b333e;--acc:#7da2ff;--ok:#5fd394;--okbg:#10301f;--bad:#ff8a80;--badbg:#3a1714;--trk:#27303b;--note:#352b0c;--noteink:#f0d58a;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px 0}
.bar{max-width:720px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ttl b{display:block;font-size:16px}.ttl span{font-size:12.5px;color:var(--mute)}
.ctl{display:flex;align-items:center;gap:10px}
#cnt{font-size:14px;font-variant-numeric:tabular-nums}
#rs{font:inherit;font-size:14px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.trk{height:5px;background:var(--trk);margin:10px -16px 0}
.trk i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}
main,#sc{max-width:720px;margin:0 auto;padding:16px}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.qh{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.qn{font-weight:700;color:var(--acc);margin-right:4px}
.chip{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.stem{margin:0 0 12px;font-weight:500}
.qi{display:block;max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line);margin:0 0 12px}
.opt{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;margin:8px 0;cursor:pointer}
.opt:focus-visible,#rs:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:10px;align-items:flex-start}
.L{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:600}
.t{flex:1}
.mk{flex:none;font-size:12.5px;font-weight:700}
.ex{display:none;margin:6px 0 0 36px;font-size:13.5px;color:var(--mute)}

.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .L{background:var(--ok);border-color:var(--ok);color:var(--card)}.opt.ok .mk{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}.opt.bad .L{background:var(--bad);border-color:var(--bad);color:var(--card)}.opt.bad .mk{color:var(--bad)}
.note{display:none;margin-top:10px;padding:9px 12px;border-radius:10px;background:var(--note);color:var(--noteink);font-size:13.5px}
.done .note{display:block}
#sc{padding-bottom:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.big{font-size:44px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.vd{margin:6px 0 0;color:var(--mute)}
.bk h3{margin:22px 0 8px;font-size:15px}
.br{margin:10px 0}.bt{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.mu{color:var(--mute);font-size:12.5px}
.bb{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--trk);margin:4px 0 2px}
.bb .g{background:var(--ok)}.bb .rd{background:var(--bad)}
.flt{max-width:720px;margin:0 auto;padding:12px 16px 0}.fh{font-size:13px;color:var(--mute);margin-top:6px}.fr{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.fchip{font:inherit;font-size:13px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}.fchip.on{background:var(--acc);border-color:var(--acc);color:var(--card)}
.chip.hy{border-color:var(--bad);color:var(--bad);font-weight:700}.q[hidden]{display:none}

<header><div class="bar"><div class="ttl"><b>CVS Mixed Question Bank MME · (Bichem has topics outside syllabus)</b><span id="sub"></span></div><div class="ctl"><span id="cnt" aria-live="polite"></span><button id="rs" type="button">Reset</button></div></div><div class="trk"><i id="pg"></i></div></header>

<script>
const Q=(n,s,l,q,o,a,note,img,alt)=>({n,s,l,q,o,a,note,img,alt});
const M=(n,s,l,q,r,e,w,note)=>{const o=w.map(x=>[x,``]),h=[...String(n)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7),k=h%5;o.splice(k,0,[r,e]);return Q(n,s,l,q,o,k,note)};
const RHD=`Rheumatic Heart Disease`,VAL=`Valvular Heart Diseases`,IHD=`Etiopathogenesis of Ischemic Heart Disease`,MYO=`Myocardial Disease`,HF=`Heart Failure`,PERI=`Pericardial Diseases`,RBC=`RBC Disorders and Anemias`,BLD=`Bleeding Disorders`,WBC=`WBC Disorders, Leukemias and Lymphomas`;
const MED="Anatomy of Mediastinal Structures",PER="Pericardium and External Features of the Heart",INT="Anatomy of Internal Structures of the Heart",COR="Coronary Circulation",CON="Innervation and Conducting System of the Heart",E1="Embryology of the Heart & CHD-1",E2="Embryology of the Heart & CHD-2",PCM="Properties of the Cardiac Muscle",PCS="Physiology of the Conductive System of the Heart",PCO="Physiology of the Cardiac Output",ATH="Pathology of Atherosclerosis",VAS="Pathology of Vasculitis and Diseases of Veins",IE="Infective Endocarditis",MIC="Microbiome in CVS Diseases",ENR="Myocardial Energy Metabolism in Ischemia and Heart Failure",CHO="Disorders of Cholesterol Metabolism",PCC="Physiology of the Cardiac Cycle",VES="Anatomy of the Major Vessels",TUM="Pathology of Vascular Tumors and Diseases of Lymphatics",HTN="Pathology of Hypertension";
const QS=[
Q(`M9`,`Physiology`,PCM,`Potassium efflux through leak channels contributes to which part of the cardiac action potential?`,[
[`Depolarization (phase 0)`,`No: phase 0 is rapid Na⁺ influx.`],
[`Early repolarization (phase 1)`,`No: phase 1 is transient K⁺ efflux through voltage-gated channels.`],
[`Plateau (phase 2)`,`No: the plateau is Ca²⁺ influx balanced by K⁺ efflux through voltage-gated channels.`],
[`Rapid repolarization (phase 3)`,`No: phase 3 uses voltage-gated delayed rectifier K⁺ channels, not leak channels.`],
[`Resting membrane potential (phase 4)`,`Yes: K⁺ leak (inward rectifier) channels hold the resting potential near the K⁺ equilibrium potential.`]],4,`Source had no options; I wrote five.`),
Q(`M10`,`Physiology`,PCC,`What occurs during ventricular systole?`,[
[`The aortic valve opens`,`Yes: when ventricular pressure exceeds aortic pressure the aortic valve opens and ejection begins.`],
[`The mitral valve opens`,`No: it opens in diastole, when ventricular pressure falls below atrial pressure.`],
[`Rapid ventricular filling`,`No: this is early diastole.`],
[`Atrial contraction tops up ventricular filling`,`No: atrial systole occurs in late diastole.`],
[`Isovolumetric relaxation`,`No: this follows aortic valve closure, at the start of diastole.`]],0,`Source had no options; I wrote five.`),
Q(`M11`,`Physiology`,PCC,`Atrial pressure rises during atrial contraction. Which wave of the atrial pressure curve reflects this rise?`,[
[`c wave`,`No: the c wave is the AV valve bulging into the atrium during isovolumetric ventricular contraction.`],
[`v wave`,`No: the v wave is atrial filling against the closed AV valve.`],
[`a wave`,`Yes: the a wave is the pressure rise from atrial contraction.`],
[`x descent`,`No: the x descent reflects atrial relaxation and downward valve motion in systole.`],
[`y descent`,`No: the y descent is rapid atrial emptying after the AV valve opens.`]],2,`FLAG: source answer was the c wave, but atrial contraction produces the a wave and the c wave comes from valve bulging. I used the a wave.`),
Q(`M12`,`Physiology`,PCS,`Which part of the conduction system delivers the impulse directly to the ventricular myocardium?`,[
[`SA node`,`No: it initiates the impulse in the right atrium.`],
[`AV node`,`No: it delays the impulse before it reaches the bundle of His.`],
[`Bundle of His`,`No: it carries the impulse from the AV node to the bundle branches.`],
[`Purkinje fibers`,`Yes: Purkinje fibers conduct fastest and activate the ventricular muscle.`],
[`Internodal pathways`,`No: they connect the SA and AV nodes within the atria.`]],3,`I reworded “conducts to the ventricular walls” to “delivers the impulse directly to the ventricular myocardium”, since the bundle of His also conducts toward the ventricles. Source had no options; I wrote five.`),
Q(`M13`,`Physiology`,PCO,`An athlete has a resting heart rate of 55 bpm and a normal resting cardiac output. Which adaptation allows this?`,[
[`Increased stroke volume`,`Yes: cardiac output = heart rate × stroke volume, so a larger stroke volume maintains output at a lower rate.`],
[`Increased total peripheral resistance`,`No: this would not maintain output and is not an athletic adaptation.`],
[`Decreased blood volume`,`No: training tends to raise plasma volume.`],
[`Decreased end-diastolic volume`,`No: athletes have larger end-diastolic volumes.`],
[`Increased sympathetic tone`,`No: athletes have lower resting sympathetic and higher vagal tone.`]],0,`Source answer kept. The bradycardia itself is mainly due to increased vagal tone, so I reworded the stem to ask which adaptation maintains cardiac output, so only one option fits.`),
Q(`M14`,`Pathology`,HTN,`A 19-year-old’s blood pressure is 125/95 mmHg. Which statement describes it correctly?`,[
[`Isolated systolic hypertension`,`No: the systolic pressure is not the raised value here.`],
[`Increased diastolic pressure`,`Yes: a diastolic pressure of 95 mmHg is elevated (90 or above) while the systolic is not.`],
[`Widened pulse pressure`,`No: the pulse pressure is 30 mmHg, which is narrow.`],
[`Hypotension`,`No: both values are well above hypotensive ranges.`],
[`Normal blood pressure`,`No: a diastolic pressure of 90 or above is abnormal.`]],1,`Source had no options; I wrote five. Tagged Pathology of Hypertension: confirm.`),
Q(`M15`,`Physiology`,PCO,`After a person stands up quickly, blood pressure falls briefly and then returns to normal. Which reflex change restores it?`,[
[`Increased firing of arterial baroreceptors`,`No: standing lowers pressure, so baroreceptor firing falls.`],
[`Cushing reflex`,`No: this responds to raised intracranial pressure.`],
[`Bainbridge reflex`,`No: it raises heart rate when atrial filling increases.`],
[`Decreased firing of arterial baroreceptors`,`Yes: reduced firing lowers vagal tone and raises sympathetic outflow, increasing heart rate and vascular tone.`],
[`Peripheral chemoreceptor reflex`,`No: it responds mainly to hypoxia, not postural pressure changes.`]],3,`Source had no options; I wrote five. Tagged Cardiac Output (neural control): confirm.`),
Q(`M16`,`Physiology`,PCO,`In hypotension, which mechanism acts within seconds but is only strongly activated when mean arterial pressure falls below about 60 mmHg?`,[
[`Renin–angiotensin–aldosterone system`,`No: it takes minutes to hours to act.`],
[`CNS ischemic response`,`Yes: brainstem ischemia triggers intense sympathetic discharge within seconds, as a last-ditch response.`],
[`Aldosterone-driven fluid retention`,`No: this acts over hours to days.`],
[`Stress-relaxation of vessels`,`No: this develops over minutes.`],
[`Fluid shift from interstitium into capillaries`,`No: this transcapillary shift takes minutes to hours.`]],1,`Source asked “which response is the fastest” with the CNS ischemic response as the answer, but the baroreceptor reflex also acts within seconds. I reworded the stem so the CNS ischemic response is the only fit. Tagged Cardiac Output: confirm.`),
Q(`M17`,`Physiology`,PCO,`In a study on rats, diastolic blood pressure falls during exercise. What is the main reason?`,[
[`Sympathetic vasoconstriction of skeletal muscle`,`No: muscle vessels dilate despite sympathetic activation.`],
[`Decreased cardiac output`,`No: cardiac output rises in exercise.`],
[`Local metabolic vasodilation in active skeletal muscle`,`Yes: adenosine, K⁺, CO₂ and lactate dilate muscle arterioles, lowering total peripheral resistance.`],
[`Increased venous tone`,`No: this raises preload and does not lower diastolic pressure.`],
[`Increased blood volume`,`No: blood volume does not rise acutely.`]],2,`FLAG: source answer was “increased sympathetic outflow to skeletal muscle”, but the standard explanation is local metabolic vasodilation lowering resistance (sympathetic outflow alone would constrict). I used the standard answer. Tagged Cardiac Output: confirm.`),
Q(`M18`,`Physiology`,PCO,`A patient with heart failure has reduced myocardial contractility. Which parameter is expected to be elevated?`,[
[`Stroke volume`,`No: stroke volume falls.`],
[`Ejection fraction`,`No: it falls.`],
[`Cardiac output`,`No: it falls, or is maintained only by compensation.`],
[`End-systolic volume`,`Yes: weaker contraction leaves more blood in the ventricle after ejection.`],
[`Maximum rate of pressure rise (dP/dt)`,`No: dP/dt reflects contractility and falls.`]],3,`Source had no options; I wrote five.`),
Q(`M19`,`Physiology`,PCS,`Which statement about the ECG is correct?`,[
[`The QRS complex represents ventricular repolarization`,`No: the QRS is ventricular depolarization.`],
[`The T wave represents ventricular depolarization`,`No: the T wave is ventricular repolarization.`],
[`The PR interval represents ventricular depolarization`,`No: the PR interval is atrial depolarization plus the AV nodal delay.`],
[`The PR interval is shortened in first-degree heart block`,`No: it is prolonged.`],
[`The P wave is absent in atrial fibrillation`,`Yes: disorganized atrial activity replaces P waves with fibrillatory waves.`]],4,`Source had no options; I wrote five.`),
Q(`M20`,`Physiology`,PCS,`An ECG shows a PR interval of 0.24 seconds. What does this describe?`,[
[`Mobitz type I (Wenckebach) block`,`No: the PR interval lengthens progressively until a beat is dropped.`],
[`Mobitz type II block`,`No: beats are dropped with a constant PR interval.`],
[`First-degree heart block`,`Yes: a PR interval above 0.20 s with every P wave conducted.`],
[`Third-degree heart block`,`No: this is complete AV dissociation.`],
[`Sinus bradycardia`,`No: it is defined by rate, not PR interval.`]],2,`Source had no options; I wrote five.`),
Q(`M21`,`Physiology`,PCS,`What is the function of the AV nodal delay?`,[
[`Simultaneous atrial and ventricular contraction`,`No: the delay separates the two contractions.`],
[`Increased ventricular contractility`,`No: the delay does not change contractility.`],
[`Initiation of ventricular repolarization`,`No: repolarization follows depolarization and plateau.`],
[`Atrial contraction preceding ventricular contraction`,`Yes: the delay lets the atria finish emptying into the ventricles before ventricular systole.`],
[`Faster SA node firing`,`No: the delay has no effect on SA node rate.`]],3,`Source had no options; I wrote five.`),
Q(`M22`,`Physiology`,PCS,`Atrial fibrillation most commonly starts from ectopic triggers at which site?`,[
[`Pulmonary vein ostia in the left atrium`,`Yes: ectopic firing from the muscle sleeves of the pulmonary veins triggers most AF, which is why ablation targets them.`],
[`SA node`,`No: SA node dysfunction causes sick sinus syndrome, not AF.`],
[`AV node`,`No: AV node disease causes heart block.`],
[`Bundle of His`,`No: His bundle disease causes conduction block.`],
[`Purkinje fibers`,`No: Purkinje disease produces ventricular, not atrial, rhythm disturbance.`]],0,`FLAG: source answer was the SA node, but AF is not caused by SA node damage (that gives sick sinus syndrome). I reworded the stem to ask for the usual trigger site, the pulmonary veins.`),
Q(`M23`,`Pathology`,HTN,`A patient with rapidly progressing hypertension (200/120 mmHg) and renal failure has a renal biopsy showing necrosis and neutrophilic infiltration of the arterioles. What is the lesion?`,[
[`Hyaline arteriolosclerosis`,`No: it shows homogeneous pink thickening without necrosis, in benign hypertension and diabetes.`],
[`Hyperplastic arteriolosclerosis (onion-skin)`,`No: this is concentric laminated thickening; necrosis with neutrophils points to necrotizing arteriolitis.`],
[`Necrotizing arteriolitis`,`Yes: fibrinoid necrosis with neutrophils in arteriolar walls is typical of malignant hypertension.`],
[`Mönckeberg medial calcific sclerosis`,`No: it is medial calcification without luminal narrowing, mostly in the elderly.`],
[`Atherosclerosis`,`No: it affects larger elastic and muscular arteries.`]],2,`Source had no options; I wrote five.`),
Q(`M24`,`Pathology`,ATH,`At autopsy, a patient who died of cardiovascular disease has raised yellow-white plaques in the abdominal aorta. What microscopic findings are expected?`,[
[`Cystic medial degeneration`,`No: this occurs in Marfan syndrome.`],
[`Granulomatous inflammation with giant cells`,`No: this suggests giant cell or Takayasu arteritis.`],
[`Fibrinoid necrosis with neutrophils`,`No: this suggests polyarteritis nodosa or malignant hypertension.`],
[`Lipid deposition and smooth muscle cell proliferation`,`Yes: foam cells, extracellular lipid and a fibrous cap with proliferating smooth muscle cells.`],
[`Hyaline thickening of arteriolar walls`,`No: this is hyaline arteriolosclerosis of small arterioles.`]],3,`Image-based in the source (no picture in your file), so I rewrote it as a text description. Source answer kept. Repeats an earlier atherosclerosis question.`),
Q(`M25`,`Pathology`,VAS,`A 60-year-old has a headache and a painful, bulging, indurated temporal artery. What is the most likely long-term manifestation if this is left untreated?`,[
[`Renal failure`,`No: giant cell arteritis spares the kidneys.`],
[`Blindness`,`Yes: ophthalmic artery involvement can cause sudden permanent vision loss, the main reason for urgent steroids.`],
[`Hemoptysis`,`No: lung hemorrhage is not a feature.`],
[`Limb gangrene`,`No: peripheral gangrene is not typical (think Buerger disease).`],
[`Pulmonary hypertension`,`No: it is not a typical outcome.`]],1,`Source had no options; I wrote five.`),
Q(`M26`,`Pathology`,VAS,`In polyarteritis nodosa, which vessels are most likely affected?`,[
[`Capillaries and venules`,`No: small-vessel vasculitis is seen in ANCA-associated disease.`],
[`Aorta and its major branches`,`No: this is Takayasu or giant cell arteritis.`],
[`Medium-sized muscular arteries`,`Yes: PAN affects medium muscular arteries, especially renal and visceral, with segmental necrotizing inflammation.`],
[`Veins`,`No: veins are not the target.`],
[`Cranial arteries only`,`No: cranial predominance describes giant cell arteritis.`]],2,`Source had no options; I wrote five. Close to an earlier PAN question.`),
Q(`M27`,`Pathology`,TUM,`A patient with AIDS has red-purple skin nodules. Which virus causes these skin changes?`,[
[`Epstein–Barr virus`,`No: EBV is linked to lymphomas and nasopharyngeal carcinoma.`],
[`Cytomegalovirus`,`No: CMV causes retinitis and colitis in AIDS.`],
[`Human papillomavirus`,`No: HPV causes warts and cervical cancer.`],
[`Human herpesvirus 8`,`Yes: HHV-8 causes Kaposi sarcoma, red-purple vascular nodules in AIDS.`],
[`Herpes simplex virus 1`,`No: it causes oral and genital vesicles.`]],3,`Source had no options; I wrote five.`),
Q(`M28`,`Pathology`,ATH,`A patient with Marfan syndrome has sudden chest pain and an ascending aortic dissection. What underlying change caused it?`,[
[`Rupture of an atherosclerotic plaque`,`No: that is the usual cause in atherosclerosis, not in Marfan syndrome.`],
[`Degeneration of medial elastic fibers`,`Yes: fibrillin-1 defects weaken the media (cystic medial degeneration), letting blood dissect the wall.`],
[`Granulomatous inflammation of the media`,`No: this is seen in giant cell and Takayasu arteritis.`],
[`Immune complex deposition`,`No: this causes vasculitis, not Marfan dissection.`],
[`Thrombosis of the intima`,`No: this is not the mechanism.`]],1,`Source had no options; I wrote five. Tagged Atherosclerosis (with aneurysms), the closest lecture: confirm.`),
Q(`M29`,`Microbiology`,IE,`A patient has fever and fatigue, retinal hemorrhages and painful fingertip nodules. He has mitral valve damage from rheumatic heart disease and a recent dental procedure. What is the most likely causative organism?`,[
[`Viridans streptococci`,`Yes: they infect previously damaged valves after dental procedures, with Roth spots and Osler nodes.`],
[`Staphylococcus aureus`,`No: it causes acute disease on normal valves, often in IV drug users.`],
[`Staphylococcus epidermidis`,`No: it targets prosthetic valves and catheters.`],
[`Enterococcus faecalis`,`No: it follows GI or GU procedures.`],
[`Streptococcus gallolyticus`,`No: it is linked to colon cancer.`]],0,`Source wrote “Streptococcus viridans”; I used viridans streptococci. Source had no options; I wrote five.`),
Q(`M37`,`Anatomy`,MED,`A tumor in the posterior mediastinum is likely to compress which structure?`,[
[`Ascending aorta`,`No: it lies in the middle mediastinum.`],
[`Superior vena cava`,`No: it lies in the superior and middle mediastinum.`],
[`Trachea`,`No: it lies in the superior mediastinum.`],
[`Thymus`,`No: it lies in the anterior and superior mediastinum.`],
[`Descending aorta`,`Yes: the descending thoracic aorta lies in the posterior mediastinum.`]],4,`Source answer kept. An earlier question has the same stem with the esophagus as the answer; both lie in the posterior mediastinum, so I left the esophagus out of the options here.`),
Q(`M38`,`Anatomy`,PER,`Which parts of the heart form the left border of the heart on a chest X-ray, below the pulmonary trunk?`,[
[`Right atrium and SVC`,`No: these form the right border.`],
[`Right ventricle and right atrium`,`No: the right ventricle forms the anterior surface and inferior border.`],
[`Left ventricle and left auricle`,`Yes: below the pulmonary trunk, the left auricle and left ventricle form the left border.`],
[`Right atrium and IVC`,`No: these form the lower right border.`],
[`Left atrium and pulmonary veins`,`No: they form the posterior surface (base).`]],2,`I added “below the pulmonary trunk”, since the aortic knob and pulmonary trunk also form the upper left border. Source had no options; I wrote five.`),
Q(`M39`,`Anatomy`,PER,`During open-heart surgery the pericardial sac is opened with a longitudinal incision. If a horizontal incision were used instead, which structures might be transected?`,[
[`Vagus nerves`,`No: they pass behind the lung roots, not on the sides of the pericardium.`],
[`Phrenic nerves`,`Yes: the phrenic nerves descend on the lateral sides of the fibrous pericardium, so a transverse incision may cut them.`],
[`Left coronary artery`,`No: coronary arteries lie on the heart surface within the pericardial cavity.`],
[`Thoracic duct`,`No: it lies in the posterior mediastinum.`],
[`Azygos vein`,`No: it lies posteriorly in the posterior mediastinum.`]],1,`Source had no options; I wrote five.`),
Q(`M40`,`Anatomy`,INT,`Which internal feature is found in the right ventricle?`,[
[`Pectinate muscles`,`No: these are in the right atrial wall and auricle.`],
[`Crista terminalis`,`No: this is a ridge in the right atrium.`],
[`Conus arteriosus (infundibulum)`,`Yes: the smooth outflow part of the right ventricle leading to the pulmonary valve.`],
[`Fossa ovalis`,`No: this lies on the interatrial septum, in the right atrium.`],
[`Opening of the coronary sinus`,`No: it opens into the right atrium.`]],2,`Source had no options; I wrote five.`),
Q(`M41`,`Anatomy`,COR,`During coronary graft surgery, a surgeon accidentally sutures the graft to the vein that runs adjacent to the posterior interventricular artery. Which vein is it?`,[
[`Great cardiac vein`,`No: it runs with the LAD in the anterior interventricular groove.`],
[`Small cardiac vein`,`No: it runs with the right marginal artery in the coronary sulcus.`],
[`Middle cardiac vein`,`Yes: it runs with the posterior interventricular artery in the posterior interventricular groove and drains into the coronary sinus.`],
[`Anterior cardiac veins`,`No: they cross the right ventricle and drain directly into the right atrium.`],
[`Oblique vein of the left atrium`,`No: it lies on the posterior left atrial wall.`]],2,`Source wording was garbled (“sutures the transplanted coronary artery the vein”); I read it as suturing the graft to the vein. Source had no options; I wrote five. Same fact as an earlier question in Exam 1.`),
Q(`M42`,`Anatomy`,COR,`Which artery mainly supplies the apex of the heart?`,[
[`Right coronary artery`,`No: it supplies the right atrium, right ventricle and inferior wall.`],
[`Left circumflex artery`,`No: it supplies the lateral and posterior left ventricle.`],
[`Posterior interventricular artery`,`No: it supplies the posterior septum and inferior wall.`],
[`Anterior interventricular (LAD) artery`,`Yes: the LAD supplies the apex and anterior wall of the left ventricle.`],
[`Right marginal artery`,`No: it supplies the inferior part of the right ventricle.`]],3,`Source had no options; I wrote five.`),
Q(`M43`,`Embryology`,E2,`A newborn with cyanosis has dextro-transposition of the great arteries (d-TGA): the aorta arises from the right ventricle and the pulmonary artery from the left ventricle. Which embryologic process was disrupted?`,[
[`Fusion of the endocardial cushions`,`No: failure causes AV septal defects.`],
[`Anterosuperior displacement of the infundibular septum`,`No: this causes tetralogy of Fallot.`],
