Q(`PHAR-013`,`Pharmacology`,L15,`A 55-year-old female with pernicious anemia presents with neurological symptoms. Why is parenteral vitamin B12 preferred in this case?`,[[`To avoid gastrointestinal side effects`,`Avoiding GI side effects is not the reason.`],[`Oral vitamin B12 absorption requires intrinsic factor, which is deficient in pernicious anemia`,`Pernicious anaemia lacks intrinsic factor, so oral B12 is poorly absorbed and parenteral B12 is needed.`],[`It is more cost-effective than oral therapy`,`Cost is not the reason.`],[`It increases MCV more effectively`,`It does not raise MCV more effectively.`],[`Oral therapy has no role in vitamin B12 deficiency`,`Oral therapy can work with very high doses, but it is unreliable here.`]],1),

Q(`PHAR-015`,`Pharmacology`,L15,`A 35-year-old male with megaloblastic anemia is prescribed folic acid. What precaution should be taken while prescribing folic acid for this patient?`,[[`Always give it with vitamin B12 to prevent worsening of neurological symptoms`,`Folic acid alone can correct the anaemia while neurological damage from B12 deficiency progresses, so give B12 with it.`],[`Administer it only via the parenteral route`,`Folic acid is given orally.`],[`Ensure it is combined with iron supplements`,`Iron is unrelated to megaloblastic anaemia.`],[`Limit therapy to one week to prevent toxicity`,`Therapy is continued until the deficiency is corrected.`],[`Monitor serum folate levels weekly`,`Weekly serum folate monitoring is not required.`]],0),

Q(`PHAR-017`,`Pharmacology`,L16,`What is the mechanism of action of trimetazidine in angina?`,[[`Inhibition of β1 receptors`,`Beta-1 blockade is not trimetazidine’s mechanism.`],[`Inhibition of long-chain 3-ketoacyl-CoA thiolase, shifting myocardial metabolism from fatty acid to glucose oxidation`,`Trimetazidine partially inhibits fatty acid oxidation (3-KAT), so the ischaemic heart uses more oxygen-efficient glucose.`],[`Activation of guanylyl cyclase`,`Guanylyl cyclase activation is the nitrate mechanism.`],[`Blocking L-type calcium channels`,`Calcium channel blockade is the verapamil and amlodipine mechanism.`],[`Inhibition of Na+/K+ ATPase`,`Na+/K+ ATPase inhibition is the digoxin mechanism.`]],1,`The source answer (lipid peroxidation) is not the mainstream mechanism; I replaced the correct option with the standard one.`),

Q(`PHAR-065`,`Pharmacology`,L19,`A 55-year-old woman presents to the clinic with palpitations, headache, and episodes of sweating. She has a history of hypertension and is currently taking an antihypertensive medication. On physical examination, her blood pressure is 160/100 mmHg, and her heart rate is 100 beats per minute. Laboratory tests reveal elevated levels of catecholamines in her urine. A diagnosis of pheocromoctoma was made. Which of the following medications is the most appropriate for managing her condition?`,[[`Atenolol`,`Atenolol alone, without prior alpha blockade, risks unopposed alpha stimulation and a hypertensive crisis.`],[`Clonidine`,`Clonidine is centrally acting and can suppress catecholamine levels but is not the treatment of choice.`],[`Phenoxybenzamine`,`Pheochromocytoma needs alpha blockade first, with phenoxybenzamine, before any beta-blocker.`],[`Metoprolol`,`Metoprolol alone risks unopposed alpha stimulation.`],[`Prazosin`,`Prazosin is an acceptable selective alpha-1 option, but phenoxybenzamine is the classic first choice.`]],2),
Q(`PHAR-066`,`Pharmacology`,L19,`A 55-year-old man presents to the clinic with complaints of frequent episodes of dizziness, fainting, and fatigue. He has a history of hypertension and benign prostatic hyperplasia (BPH), both of which are managed with medication. He reports that his symptoms have been progressively worsening over the past few months. Clinical History: • Age: 55 • Gender: Male • Relevant clinical features: Dizziness, fainting, fatigue • History: Hypertension, benign prostatic hyperplasia (BPH), managed with medication Physical Examination Findings: • Blood pressure: 120/80 mmHg (lying down), 90/60 mmHg (standing) • Heart rate: 80 bpm (lying down), 110 bpm (standing) • No focal neurological deficits Diagnosis: • Suspected orthostatic hypotension due to medication 2 Which of the following adrenergic antagonists is most likely responsible for the patient’s symptoms?`,[[`Prazosin`,`Prazosin (alpha-1 blocker) causes first-dose and orthostatic hypotension, especially with BPH treatment.`],[`Metoprolol`,`Metoprolol does not cause marked first-dose postural hypotension.`],[`Carvedilol`,`Carvedilol has alpha-1 blocking activity but is less likely to cause this picture in a BPH patient.`],[`Propranolol`,`Propranolol does not block alpha receptors, so it would not cause this pattern.`],[`Atropine`,`Atropine is an antimuscarinic and would cause tachycardia, not postural hypotension.`]],0),

Q(`PHAR-068`,`Pharmacology`,L19,`A 30-year-old man with a history of stimulant use is brought to the emergency department after an episode of amphetamine overdose. He presents with severe agitation, diaphoresis, and palpitations. His vital signs are as follows: Parameter Value Normal Range Blood Pressure (BP) 180/110 mmHg 90-120/60-80 mmHg Heart Rate (HR) 140 bpm 60-100 bpm Respiratory Rate (RR) 22 breaths/min 12-20 breaths/min Temperature 38.1°C (100.6°F) 36.1-37.2°C Oxygen Saturation (SpO₂) 97% on room air >95% ECG shows sinus tachycardia with occasional premature ventricular contractions (PVCs). Which of the following drugs is the most appropriate for treating the cardiovascular symptoms in this patient?`,[[`Alfuzosin`,`Alfuzosin is an alpha-1 blocker used in BPH and does not control the tachycardia.`],[`Propranolol`,`Propranolol alone risks unopposed alpha stimulation and worse hypertension.`],[`Esmolol`,`Esmolol alone also risks unopposed alpha stimulation.`],[`Labetalol`,`Labetalol lowers BP and heart rate in stimulant toxicity through combined alpha and beta blockade.`],[`Metoprolol`,`Metoprolol alone also risks unopposed alpha stimulation.`]],3),

Q(`PATH-018`,`Pathology & Hematology`,L11,`16-year-old girl comes to the hospital with chest pain and respiratory distress. On physical examination, the patient is short of breath, wheezing, and gasping for air. A prominent pansystolic heart murmur is heard on cardiac auscultation. An X-ray study of the chest shows marked enlargement of the heart. The patient expires despite intense supportive measures. At autopsy, microscopic examination of the myocardium discloses aggregates of mononuclear cells arranged around centrally located deposits of eosinophilic collagen and fibrinoid material. What is the appropriate diagnosis?`,[[`Acute bacterial endocarditis`,`Acute bacterial endocarditis produces vegetations with neutrophils.`],[`Rheumatic heart disease`,`Aggregates of mononuclear cells around fibrinoid material (Aschoff bodies) with a murmur indicate rheumatic heart disease.`],[`Subacute bacterial endocarditis`,`Subacute bacterial endocarditis produces vegetations with organisms.`],[`Systemic lupus erythematosus`,`SLE causes Libman-Sacks endocarditis.`],[`Viral myocarditis`,`Viral myocarditis shows lymphocytic infiltrates without Aschoff bodies.`]],1),
Q(`PATH-019`,`Pathology & Hematology`,L38,`A 50-year-old man underwent heart transplantation for heart failure that was unresponsive to medical treatment. The affected heart at autopsy is shown in the image. It weighs 950 g (normal up to 350 g) and shows no evidence of coronary artery atherosclerosis. Histologically, the myocardium demonstrates hypertrophic myocytes and foci of myocardial fibrosis but no evidence of inflammation or myofiber disarray. Which of the following is the most likely diagnosis?`,[[`Cardiac amyloidosis`,`Amyloidosis shows amyloid deposits.`],[`Dilated cardiomyopathy`,`Massive dilated heart with no atherosclerosis, inflammation or disarray points to dilated cardiomyopathy.`],[`Hypertrophic cardiomyopathy`,`Hypertrophic cardiomyopathy shows myocyte disarray.`],[`Restrictive cardiomyopathy`,`Restrictive cardiomyopathy shows a stiff, non-dilated heart.`],[`Ventricular aneurysm`,`A ventricular aneurysm follows infarction.`]],1),
Q(`PATH-020`,`Pathology & Hematology`,L39,`At autopsy, a 73-year-old male is found to have an enlarged liver and spleen (with microscopic evidence of chronic congestion), and pressure on his legs leaveslasting depressions. There is no fluid in the pleural cavities. Of the following, which is the most likely underlying source of the pathologic changes?`,[[`Coronary artery atherosclerosis`,`Coronary atherosclerosis causes left-sided failure.`],[`Systemic hypertension`,`Systemic hypertension causes left-sided failure.`],[`A calcified bicuspid aortic valve`,`A calcified bicuspid aortic valve causes left-sided failure.`],[`Pulmonary fibrosis`,`Chronic right heart failure (cor pulmonale from lung disease) gives systemic congestion and peripheral oedema without pulmonary effusions.`],[`Hypertrophic cardiomyopathy`,`Hypertrophic cardiomyopathy causes left-sided failure.`]],3),
Q(`PATH-021`,`Pathology & Hematology`,L7,`Which of the following types of fluid is most characteristic of pericardial effusion due to congestive heart failure?`,[[`Serous`,`Pericardial effusion from heart failure is a serous transudate.`],[`Serofibrinous`,`Serofibrinous effusion suggests inflammation such as uraemia or rheumatic fever.`],[`Fibrinous`,`Fibrinous exudate suggests acute pericarditis.`],[`Purulent`,`Purulent fluid suggests infection.`],[`Hemorrhagic`,`Haemorrhagic fluid suggests tumour, TB or trauma.`]],0),
Q(`PATH-022`,`Pathology & Hematology`,L40,`A 25-year-old woman presents with fatigue, pallor, and craving for ice (pagophagia). Laboratory results show low hemoglobin, microcytic hypochromic RBCs, low serum ferritin, and high TIBC. Which of the following is the most likely cause of her anemia?`,[[`Decreased erythropoietin production`,`Decreased erythropoietin gives normocytic anaemia.`],[`Chronic blood loss and poor dietary iron intake`,`Pagophagia with microcytic hypochromic cells, low ferritin and high TIBC indicates iron deficiency, most often from blood loss and poor intake.`],[`Vitamin B12 deficiency`,`Vitamin B12 deficiency gives macrocytic anaemia.`],[`Bone marrow failure`,`Bone marrow failure gives pancytopenia.`],[`Hemolytic anemia`,`Haemolysis gives raised bilirubin and reticulocytosis, not low ferritin.`]],1),
Q(`PATH-023`,`Pathology & Hematology`,L41,`A 35-year-old man presents with dark-colored urine in the morning. Laboratory tests reveal intravascular hemolysis and pancytopenia. Flow cytometry shows loss of CD59 on red blood cells. What is the most likely underlying abnormality?`,[[`Mutation in spectrin gene`,`Spectrin mutation causes hereditary spherocytosis.`],[`Mutation in PIGA gene causing deficiency of GPI-anchored proteins`,`Loss of CD59 from a PIGA mutation (GPI-anchor deficiency) makes red cells sensitive to complement: PNH.`],[`Mutation in β-globin gene`,`β-globin mutation causes thalassaemia or sickle cell disease.`],[`Defective NADPH synthesis`,`Defective NADPH synthesis is G6PD deficiency.`],[`IgM autoantibodies active at low temperatures`,`Cold IgM antibodies cause cold agglutinin haemolysis.`]],1),
Q(`PATH-024`,`Pathology & Hematology`,L42,`A 9-year-old girl develops widespread pinpoint skin hemorrhages. She recovered from a flu-like illness 1 week earlier. Laboratory findings reveal a platelet count of 20,000/mL but no other abnormalities. Her bone marrow shows an increased number of megakaryocytes. The platelet count is normal after 2 months. Which of the following is the appropriate diagnosis?`,[[`Antiphospholipid antibody syndrome`,`Antiphospholipid syndrome causes thrombosis.`],[`Disseminated intravascular coagulation`,`DIC has coagulation abnormalities.`],[`Hemolytic-uremic syndrome`,`HUS causes anaemia and renal failure.`],[`Idiopathic thrombocytopenic purpura`,`Acute self-limiting thrombocytopenia after a viral illness with many megakaryocytes is acute ITP.`],[`Thrombotic thrombocytopenic purpura`,`TTP has fever, renal and neurological signs.`]],3),
Q(`PATH-025`,`Pathology & Hematology`,L43,`Auer rods are cytoplasmic structures seen in:`,[[`Myeloblast`,`Auer rods are fused lysosomal granules in myeloblasts (AML).`],[`Lymphoblast`,`Lymphoblasts have no Auer rods.`],[`Red blood cells`,`Red blood cells have no Auer rods.`],[`Reed-Sternberg cells`,`Reed-Sternberg cells are in Hodgkin lymphoma.`],[`Megakaryocytes`,`Megakaryocytes have no Auer rods.`]],0),
Q(`PATH-026`,`Pathology & Hematology`,L43,`A lymph node biopsy from a 60-year-old man revealed complete effacement of nodal architecture and replacement by sheets of small round malignant lymphocytes. Peripheral blood showed lymphocytosis with presence of smudge cells. What is the most likely diagnosis?`,[[`Burkitt’s lymphoma`,`Burkitt lymphoma shows a starry-sky pattern.`],[`Follicular lymphoma`,`Follicular lymphoma has nodular follicles.`],[`Chronic lymphocytic leukemia/ small lymphocytic lymphoma`,`Effaced nodes of small lymphocytes with smudge cells indicate CLL/SLL.`],[`Acute myeloid leukemia`,`AML shows blasts, not small lymphocytes.`],[`Diffuse large B-cell lymphoma`,`DLBCL shows large cells.`]],2),
Q(`ANAT-149`,`Anatomy & Embryology`,L23,`Where is the sinoatrial node located?`,[[`Upper end of the sulcus terminalis / crista terminalis, at the junction of the SVC and right atrium`,`The SA node lies in the wall of the right atrium at the upper end of the sulcus terminalis (crista terminalis inside).`],[`Near the opening of the coronary sinus`,`This is the AV node area.`],[`Upper part of the interventricular septum`,`The bundle of His lies here, not the SA node.`],[`Lower end of the interatrial septum`,`The AV node region and Koch triangle lie near the septum, not the SA node.`],[`Tip of the right atrial appendage`,`The appendage has no pacemaker tissue.`]],0,`From the 2025-26 MME theory paper (Q1). The paper listed sulcus terminalis and crista terminalis as separate options; they mark the same site (outside vs inside), so I merged them. Extra options were written by Claude; the paper gave fewer than five.`),
Q(`PHYS-041`,`Physiology`,L25,`After complete heart block the ventricles beat at 30 bpm. Which structure generates the ventricular rhythm?`,[[`AV node`,`The block is at or above the node, so it cannot drive the ventricles.`],[`Internodal pathway`,`Internodal tracts carry atrial impulses to the AV node and cannot drive the ventricles.`],[`SA node`,`The SA node drives the atria, but its impulses do not reach the ventricles in complete block.`],[`Purkinje fibres`,`With complete block, an escape rhythm arises from the distal conducting tissue; the paper keys Purkinje fibres for about 30 bpm.`],[`Bundle of His`,`A His escape rhythm is usually a little faster (about 40-50/min); the paper keys Purkinje fibres for 30/min.`]],3,`From the 2025-26 MME theory paper (Q2).`),
Q(`PHYS-042`,`Physiology`,L29,`Hypercalcaemia increases the strength of myocardial contraction. What is the mechanism?`,[[`Increased intracellular calcium`,`Higher extracellular Ca2+ raises Ca2+ entry and intracellular Ca2+, strengthening contraction.`],[`Inhibition of the Na/Ca exchanger`,`This raises intracellular Ca2+ (the digoxin effect) but is not how hypercalcaemia acts.`],[`Sodium leak`,`The sodium leak is the pacemaker current, not the inotropic mechanism.`],[`Calcium efflux`,`Calcium efflux lowers intracellular Ca2+ and weakens contraction.`],[`Potassium influx`,`K+ movement affects repolarization, not contractile strength directly.`]],0,`From the 2025-26 MME theory paper (Q3).`),
Q(`ANAT-150`,`Anatomy & Embryology`,L24,`Which structure lies immediately anterior to the oesophagus in the superior mediastinum?`,[[`Thoracic duct`,`The thoracic duct lies on the left side of the oesophagus, behind it.`],[`Brachiocephalic vein`,`It lies more anteriorly, separated from the oesophagus by the trachea and arch branches.`],[`Superior vena cava`,`The SVC lies to the right and anterior, not directly in front of the oesophagus.`],[`Brachiocephalic artery`,`It lies in front of the trachea, not directly against the oesophagus.`],[`Trachea`,`The trachea lies directly in front of the oesophagus in the superior mediastinum.`]],4,`From the 2025-26 MME theory paper (Q4).`),
Q(`PATH-027`,`Pathology & Hematology`,L33,`Giant cell (temporal) arteritis is mainly characterized by:`,[[`Granulomatous inflammation in the media`,`GCA shows segmental granulomatous inflammation with giant cells around the internal elastic lamina and media.`],[`Fibrinoid necrosis`,`Fibrinoid necrosis is typical of polyarteritis nodosa and malignant hypertension.`],[`Eosinophil-rich granulomas with asthma`,`This describes eosinophilic granulomatosis with polyangiitis (Churg-Strauss).`],[`Granulomatous inflammation in all the layers (transmural)`,`Transmural granulomatous inflammation fits Takayasu arteritis better than the classic description of GCA.`],[`Microabscess`,`Microabscesses with giant cells in the thrombus are seen in Buerger disease.`]],0,`From the 2025-26 MME theory paper (Q6). The paper wrote “fibrinogen necrosis”, read here as fibrinoid necrosis. Extra options were written by Claude; the paper gave fewer than five.`),
Q(`PATH-028`,`Pathology & Hematology`,L32,`Atheroma formation can begin even in children. Which is the first visible gross evidence of atheroma?`,[[`Thrombus`,`Thrombosis follows plaque rupture or ulceration.`],[`Calcification`,`Calcification occurs in advanced plaques.`],[`Fatty streak`,`Fatty streaks (lipid-laden macrophages) are the earliest grossly visible lesion.`],[`Ulceration`,`Ulceration is a late complicated-plaque change.`],[`Haemorrhage`,`Plaque haemorrhage is a late complication.`]],2,`From the 2025-26 MME theory paper (Q7).`),
Q(`ANAT-151`,`Anatomy & Embryology`,L5,`A 3-month-old infant has cyanosis, an overriding aorta, right ventricular outflow obstruction and a large ventricular septal defect. What is the diagnosis?`,[[`Persistent truncus arteriosus`,`Truncus has a single outflow vessel overriding a VSD, without separate right outflow obstruction.`],[`Transposition of the great arteries`,`TGA has the aorta from the right ventricle without this pulmonary stenosis and VSD combination.`],[`Total anomalous pulmonary venous return`,`TAPVR sends pulmonary veins to the right atrium; no outflow obstruction or overriding aorta.`],[`Ebstein anomaly`,`Ebstein is apical displacement of the tricuspid valve.`],[`Tetralogy of Fallot`,`VSD, pulmonary (outflow) stenosis, overriding aorta and RV hypertrophy define tetralogy of Fallot.`]],4,`From the 2025-26 MME theory paper (Q8). The paper wrote “ventral septal defect”; read as ventricular. Options for this question were written by Claude; the paper gives only the answer.`),
Q(`ANAT-152`,`Anatomy & Embryology`,L5,`A 19-year-old woman has an interatrial defect with intermittent shunting induced by the Valsalva manoeuvre (a patent foramen ovale). Which structure failed to fuse?`,[[`Aorticopulmonary septum`,`This divides the outflow tract.`],[`Sinus venosus`,`Its defects give a high ASD near the SVC.`],[`Septum secundum`,`It forms the thick rim; the flap that fails to fuse is the septum primum.`],[`Septum primum`,`A PFO persists when the flap of septum primum fails to fuse with the septum secundum.`],[`Endocardial cushions`,`Cushion defects cause ostium primum and AV septal defects.`]],3,`From the 2025-26 MME theory paper (Q9). The paper listed “septum sperium” (read as septum secundum) and septum primum. Extra options were written by Claude; the paper gave fewer than five.`),
Q(`PATH-029`,`Pathology & Hematology`,L33,`A 19-year-old woman has myalgia, arthritis, cold upper extremities and a weak radial pulse. MRA shows 75% stenosis of the main aortic branches. What is the diagnosis?`,[[`Kawasaki disease`,`Kawasaki is a childhood vasculitis with coronary aneurysms.`],[`Buerger disease`,`Buerger disease affects distal limb vessels of smokers.`],[`Giant cell arteritis`,`GCA affects older patients (over 50), typically the temporal artery.`],[`Polyarteritis nodosa`,`PAN affects medium-sized visceral arteries, not the aortic arch branches.`],[`Takayasu arteritis`,`Young woman with weak pulses and aortic branch stenosis is Takayasu arteritis.`]],4,`From the 2025-26 MME theory paper (Q10). Extra options were written by Claude; the paper gave fewer than five.`),
Q(`PATH-030`,`Pathology & Hematology`,L35,`A patient with SLE has small sterile vegetations on the mitral valve. What is the diagnosis?`,[[`Libman-Sacks endocarditis`,`SLE causes small sterile verrucous vegetations on valve surfaces: Libman-Sacks endocarditis.`],[`Nonbacterial thrombotic endocarditis`,`This marantic type occurs with cancer and hypercoagulable states.`],[`Subacute infective endocarditis`,`Infective vegetations are larger, friable and contain organisms.`],[`Rheumatic endocarditis`,`Rheumatic disease gives small vegetations along closure lines with Aschoff bodies, after streptococcal infection, not SLE.`],[`Carcinoid heart disease`,`Carcinoid causes right-sided plaque-like fibrosis.`]],0,`From the 2025-26 MME theory paper (Q11). Options for this question were written by Claude; the paper gives only the answer.`),
Q(`MICR-039`,`Microbiology`,L8,`A patient had valve surgery. Forty-five days later he has fever, weight loss and nail haemorrhages, and a coagulase-negative organism is isolated. Which organism?`,[[`Viridans streptococci`,`They cause subacute endocarditis on damaged native valves.`],[`Staphylococcus epidermidis`,`Coagulase-negative S. epidermidis is the classic cause of early prosthetic valve endocarditis.`],[`Enterococcus faecalis`,`It is not coagulase-negative staphylococcus and is less typical here.`],[`Staphylococcus aureus`,`S. aureus is coagulase-positive.`],[`Candida albicans`,`Fungi are possible but are not a coagulase-negative bacterium.`]],1,`From the 2025-26 MME theory paper (Q12). Extra options were written by Claude; the paper gave fewer than five.`),
Q(`MICR-040`,`Microbiology`,L8,`An IV drug user has vegetations on the tricuspid valve and nodules on the fingers. What is the most likely organism?`,[[`Pseudomonas aeruginosa`,`It occurs in drug users but far less often than S. aureus.`],[`Staphylococcus aureus`,`S. aureus is the commonest cause of right-sided endocarditis in IV drug users.`],[`Enterococcus faecalis`,`It is less common in this setting.`],[`Viridans streptococci`,`They infect damaged left-sided native valves.`],[`Candida albicans`,`Fungal endocarditis occurs but is less likely than S. aureus.`]],1,`From the 2025-26 MME theory paper (Q13). Options for this question were written by Claude; the paper gives only the answer.`),
Q(`MICR-041`,`Microbiology`,L8,`Blood cultures stay negative for 7 days, but molecular tests show Aggregatibacter. What is the diagnosis?`,[[`Prosthetic valve endocarditis caused by S. epidermidis`,`Nothing suggests a prosthesis, and S. epidermidis grows in culture.`],[`Nonbacterial thrombotic endocarditis`,`This is sterile and linked to malignancy.`],[`Libman-Sacks endocarditis`,`This is sterile and linked to SLE.`],[`Native valve endocarditis caused by a fastidious HACEK organism`,`Aggregatibacter is a HACEK organism that grows slowly, causing culture-negative native valve endocarditis.`],[`Acute endocarditis caused by Staphylococcus aureus`,`S. aureus grows quickly in routine cultures.`]],3,`From the 2025-26 MME theory paper (Q14). Options for this question were written by Claude; the paper gives only the answer.`),
Q(`MICR-042`,`Microbiology`,L9,`A gut microbial molecule is responsible for cardiovascular disease despite a normal cholesterol level. Which molecule?`,[[`Trimethylamine-N-oxide (TMAO)`,`TMAO is also a gut-derived atherogenic metabolite and the one most often cited; this paper keys imidazole propionate.`],[`Butyrate`,`Butyrate is a protective short-chain fatty acid.`],[`Secondary bile acids`,`They mainly affect lipid and glucose handling, not this CVD mechanism.`],[`Imidazole propionate (ImP)`,`Per this paper, the gut-derived histidine metabolite imidazole propionate promotes cardiovascular disease independent of cholesterol.`],[`Coprostanol`,`It is a faecal cholesterol metabolite that lowers cholesterol absorption.`]],3,`From the 2025-26 MME theory paper (Q15). The paper listed only TMAO and ImP and keyed ImP. Extra options were written by Claude; the paper gave fewer than five.`),
Q(`ANAT-153`,`Anatomy & Embryology`,L1,`A muscular bridge runs from the lower interventricular septum to the base of the anterior papillary muscle. What is it and what does it do?`,[[`Crista terminalis: separates the smooth and rough atrium`,`The crista is an atrial ridge.`],[`Pectinate muscles: strengthen atrial contraction`,`Pectinate muscles are ridges in the right atrium.`],[`Papillary muscle: anchors the valve cusps`,`Papillary muscles anchor chordae tendineae but are not the bridge.`],[`Trabeculae carneae: prevent turbulence`,`Trabeculae are general ventricular ridges, not a bridge to the papillary muscle.`],[`Moderator band: carries right bundle branch fibres`,`The moderator band (septomarginal trabecula) carries the right bundle branch to the anterior papillary muscle.`]],4,`From the 2025-26 MME theory paper (Q16). Options for this question were written by Claude; the paper gives only the answer.`),
Q(`ANAT-154`,`Anatomy & Embryology`,L1,`Muscular ridges extend from the crista terminalis. What are they and what is their function?`,[[`Moderator band: carries the right bundle branch`,`The moderator band is in the right ventricle.`],[`Trabeculae carneae: prevent blood turbulence`,`Trabeculae carneae are ventricular ridges.`],[`Pectinate muscles: enhance atrial contraction`,`Pectinate muscles are ridges of the right atrial wall that increase the force of atrial contraction.`],[`Papillary muscles: anchor the AV valve cusps`,`Papillary muscles are ventricular.`],[`Chordae tendineae: tether the valve leaflets`,`Chordae are tendinous cords, not muscular ridges.`]],2,`From the 2025-26 MME theory paper (Q17). Extra options were written by Claude; the paper gave fewer than five.`),
Q(`ANAT-155`,`Anatomy & Embryology`,L24,`The sternal angle is an important landmark. Which structure is related to it?`,[[`Bifurcation of the common carotid artery`,`This occurs at about C4, level with the thyroid cartilage.`],[`Start (and end) of the arch of the aorta`,`The arch of the aorta begins and ends at the level of the sternal angle (T4/T5).`],[`Origin of the coeliac trunk`,`The coeliac trunk arises at T12.`],[`Passage of the aorta through the diaphragm`,`The aortic hiatus is at T12.`],[`Formation of the inferior vena cava`,`The IVC forms at L5.`]],1,`From the 2025-26 MME theory paper (Q18). The paper also offered the azygos arch and the thoracic duct crossing, which are at the same T4/T5 level, so I replaced them with unambiguous distractors. Extra options were written by Claude; the paper gave fewer than five.`),
Q(`ANAT-156`,`Anatomy & Embryology`,L2,`Which structure lies directly external to the pericardial cavity?`,[[`Parietal serous pericardium`,`The pericardial cavity lies between the parietal and visceral serous layers, so the parietal layer is directly external.`],[`Endocardium`,`It lines the heart chambers.`],[`Fibrous pericardium`,`It lies outside the parietal serous layer, not directly against the cavity.`],[`Myocardium`,`It lies deep to the visceral layer, on the inner side.`],[`Visceral serous pericardium`,`It forms the inner boundary of the cavity (epicardium).`]],0,`From the 2025-26 MME theory paper (Q19). The paper wrote “Endocardiaum”. Extra options were written by Claude; the paper gave fewer than five.`),

Q(`PHYS-043`,`Physiology`,L26,`Which physiological feature helps an athlete reach a cardiac output of 35 L/min, almost double that of a normal fit person?`,[[`Chronic sympathetic activity`,`Athletes tend to have lower resting sympathetic drive.`],[`More blood volume`,`Blood volume is somewhat larger, but the stronger, larger ventricle matters more.`],[`Higher resting heart rate`,`Athletes usually have a lower resting rate.`],[`Hypertrophy of the cardiac cells and increased contractile strength`,`Athletic training enlarges the ventricle and strengthens contraction, raising stroke volume and maximal output.`],[`Increased peripheral resistance`,`Higher resistance would oppose flow, not raise output.`]],3,`From the 2025-26 MME theory paper (Q23). Extra options were written by Claude; the paper gave fewer than five.`),
Q(`ANAT-159`,`Anatomy & Embryology`,L23,`Angina is referred to the chest and the medial aspect of the left arm. What is the reason?`,[[`Vagal afferents carry cardiac pain to the arm`,`Vagal afferents mediate cardiac reflexes, not referred somatic pain.`],[`The phrenic nerve carries cardiac pain to the arm`,`Phrenic referral goes to the shoulder tip (C3-C5) from the diaphragm.`],[`Coronary spasm spreads to the brachial artery`,`Referred pain is neural, not vascular.`],[`Visceral (autonomic) and somatic afferents converge on the same spinal segments`,`Cardiac pain fibres and somatic fibres from the chest and arm enter the same upper thoracic segments (T1-T4), so pain is felt in the somatic area.`],[`The heart is directly supplied by somatic nerves of the arm`,`The heart has autonomic, not somatic, innervation.`]],3,`From the 2025-26 MME theory paper (Q24). Options for this question were written by Claude; the paper gives only the answer.`),

Q(`PHYS-045`,`Physiology`,L28,`What causes the c wave in the atrial (jugular) pressure curve?`,[[`Venous return when the tricuspid valve is open`,`Flow through the open valve causes the y descent.`],[`Atrial contraction`,`This produces the a wave.`],[`Closure of the semilunar valves`,`This produces the dicrotic notch of the aortic curve.`],[`Atrial filling while the AV valve is closed`,`This produces the v wave.`],[`Bulging of the AV valve into the atrium during ventricular contraction`,`At the start of ventricular systole the closed AV valve bulges back into the atrium, producing the c wave.`]],4,`From the 2025-26 MME theory paper (Q27). Extra options were written by Claude; the paper gave fewer than five.`),

Q(`PHYS-046`,`Physiology`,L29,`What term describes the ability of cardiac cells to generate action potentials spontaneously?`,[[`Refractoriness`,`This is the period of reduced responsiveness after excitation.`],[`Conductivity`,`This is the ability to conduct impulses.`],[`Excitability`,`This is the ability to respond to a stimulus.`],[`Automaticity (autorhythmicity)`,`Automaticity is the ability to generate impulses spontaneously.`],[`Contractility`,`This is the ability to shorten and develop force.`]],3,`From the 2025-26 MME theory paper (Q29). Options for this question were written by Claude; the paper gives only the answer.`),
