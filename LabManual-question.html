        let currentTagFilter = 'all';
        let currentStatusFilter = 'all';
        const userState = {};

        function updateFilterCounts() {
            // Tag counts — total questions per tag (static)
            const tagCounts = {
                'all': questions.length,
                'anatomy-osteology': 0,
                'physiology-emg': 0,
                'biochemistry-metabolic': 0,
                'microbiology-wound': 0,
                'pathology-oncology': 0
            };
            questions.forEach(q => {
                if (tagCounts[q.tag] !== undefined) tagCounts[q.tag]++;
            });

            // Status counts — live, based on userState
            let unanswered = 0, incorrect = 0, bookmarked = 0;
            questions.forEach(q => {
                const state = userState[q.id] || {};
                if (state.selected === undefined) unanswered++;
                else if (state.selected !== q.correct) incorrect++;
                if (state.bookmarked) bookmarked++;
            });
            const statusCounts = {
                'all': questions.length,
                'unanswered': unanswered,
                'incorrect': incorrect,
                'bookmarked': bookmarked
            };

            // Write tag counts
            Object.keys(tagCounts).forEach(key => {
                const el = document.querySelector(`[data-count="tag-${key}"]`);
                if (el) el.textContent = tagCounts[key];
            });

            // Write status counts
            Object.keys(statusCounts).forEach(key => {
                const el = document.querySelector(`[data-count="status-${key}"]`);
                if (el) el.textContent = statusCounts[key];
            });
        }

        function renderQuiz() {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';

            let answeredCount = 0;
            let correctCount = 0;
            let incorrectCount = 0;

            questions.forEach(q => {
                const state = userState[q.id];
                if (state && state.selected !== undefined) {
                    answeredCount++;
                    if (state.selected === q.correct) correctCount++;
                    else incorrectCount++;
                }
            });

            const filtered = questions.filter(q => {
                const state = userState[q.id] || {};
                const matchesTag = currentTagFilter === 'all' || q.tag === currentTagFilter;

                if (!matchesTag) return false;

                if (currentStatusFilter === 'unanswered') {
                    return state.selected === undefined;
                } else if (currentStatusFilter === 'incorrect') {
                    return state.selected !== undefined && state.selected !== q.correct;
                } else if (currentStatusFilter === 'bookmarked') {
                    return state.bookmarked === true;
                }
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="card" style="text-align: center; color: var(--slate-500);">No questions match the selected filters.</div>`;
            }

            filtered.forEach((q, index) => {
                const state = userState[q.id] || {};
                const isAnswered = state.selected !== undefined;

                const card = document.createElement('div');
                card.className = "card";

                let optionsHtml = '';
                q.options.forEach((opt, optIndex) => {
                    let btnClass = "option-btn ";

                    if (!isAnswered) {
                        btnClass += "";
                    } else {
                        if (optIndex === q.correct) {
                            btnClass += "correct";
                        } else if (optIndex === state.selected) {
                            btnClass += "incorrect";
                        } else {
                            btnClass += "dimmed";
                        }
                    }

                    optionsHtml += `
                        <button onclick="handleSelect(${q.id}, ${optIndex})" ${isAnswered ? 'disabled' : ''} class="${btnClass}">
                            <span><b style="display:inline-block; width:24px;">${String.fromCharCode(65 + optIndex)}.</b> ${opt}</span>
                            ${isAnswered && optIndex === q.correct ? '<span style="color: var(--emerald-600); font-weight: 700; white-space: nowrap;">✓ Correct</span>' : ''}
                            ${isAnswered && optIndex === state.selected && optIndex !== q.correct ? '<span style="color: var(--rose-600); font-weight: 700; white-space: nowrap;">✗ Choice</span>' : ''}
                        </button>
                    `;
                });

                card.innerHTML = `
                    <div class="card-header">
                        <div style="display: flex; align-items: center; gap: 0.5rem;">
                            <span class="tag-pill">${q.tag.replace('-', ' ')}</span>
                            <span class="qid">QID: ${q.id}</span>
                        </div>
                        <button onclick="toggleBookmark(${q.id})" class="bookmark-btn">
                            ${state.bookmarked ? '⭐' : '☆'}
                        </button>
                    </div>
                    <div class="question-text">${index + 1}. ${q.text}</div>
                    <div class="options-container">
                        ${optionsHtml}
                    </div>
                    <div id="explanation-${q.id}" class="explanation-box ${isAnswered ? '' : 'hidden'}">
                        <span class="explanation-title">Detailed Explanation:</span>
                        ${q.explanation}
                    </div>
                `;
                container.appendChild(card);
            });

            const totalQ = questions.length;
            document.getElementById('stat-answered').innerText = answeredCount;
            document.getElementById('stat-total').innerText = totalQ;
            const accuracy = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
            document.getElementById('stat-accuracy').innerText = accuracy + '%';
            document.getElementById('stat-correct').innerText = correctCount + ' C';
            document.getElementById('stat-incorrect').innerText = incorrectCount + ' I';

            // Refresh filter counts on every render
            updateFilterCounts();
        }

        function handleSelect(qId, optIndex) {
            if (!userState[qId]) userState[qId] = {};
            userState[qId].selected = optIndex;
            renderQuiz();
        }

        function toggleBookmark(qId) {
            if (!userState[qId]) userState[qId] = {};
            userState[qId].bookmarked = !userState[qId].bookmarked;
            renderQuiz();
        }

        function setTagFilter(tag) {
            currentTagFilter = tag;
            document.querySelectorAll('.tag-btn').forEach(btn => {
                if (btn.dataset.tag === tag) {
                    btn.className = "tag-btn active";
                } else {
                    btn.className = "tag-btn";
                }
            });
            renderQuiz();
        }

        function setStatusFilter(status) {
            currentStatusFilter = status;
            document.querySelectorAll('.status-btn').forEach(btn => {
                if (btn.dataset.status === status) {
                    btn.className = "status-btn active";
                } else {
                    btn.className = "status-btn";
                }
            });
            renderQuiz();
        }

        renderQuiz();
    </script>
