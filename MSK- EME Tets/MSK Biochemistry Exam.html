<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>MSK Biochemistry Exam</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#5d6773;--bd:#d9dee5;--ac:#3b5bdb;--gb:#e3f6e8;--gt:#1c7a3a;--rb:#fde6e6;--rt:#b3261e;--tag:#eef1f6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1216;--card:#181c22;--tx:#e8ebef;--mu:#9aa5b1;--bd:#2c333c;--ac:#8ea2ff;--gb:#12301c;--gt:#6fdc92;--rb:#3a1717;--rt:#ff9a93;--tag:#232a33}}
:root[data-theme="dark"]{--bg:#0f1216;--card:#181c22;--tx:#e8ebef;--mu:#9aa5b1;--bd:#2c333c;--ac:#8ea2ff;--gb:#12301c;--gt:#6fdc92;--rb:#3a1717;--rt:#ff9a93;--tag:#232a33}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:720px;margin:0 auto}
.t{font-weight:700}.cnt{color:var(--mu);font-size:14px}
button.reset{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer}
.bar{max-width:720px;margin:8px auto 0;height:6px;background:var(--tag);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .25s}
main{max-width:720px;margin:0 auto;padding:14px}
.q{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.qn{color:var(--mu);font-size:13px;margin-bottom:4px}.hy{background:#ffd43b;color:#5c4400;border-radius:6px;padding:1px 7px;font-weight:700;font-size:12px;margin-left:6px}
.qt{font-weight:600;margin-bottom:10px}
.o{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px;font:inherit;cursor:pointer}
.o b{display:inline-block;width:22px;color:var(--mu)}.o small{display:none;margin-top:4px;font-size:13px;color:var(--mu)}
.done .o{cursor:default}.done .o small{display:block}
.o.ok{background:var(--gb);border-color:var(--gt)}.o.ok small,.o.ok b{color:var(--gt)}
.o.no{background:var(--rb);border-color:var(--rt)}.o.no small,.o.no b{color:var(--rt)}
.tags{display:none;flex-wrap:wrap;gap:6px;margin-top:6px}.done .tags{display:flex}
.tags span{background:var(--tag);color:var(--mu);border-radius:999px;padding:2px 9px;font-size:12px}
#score{display:none;background:var(--card);border:2px solid var(--ac);border-radius:14px;padding:16px}
#score h2{margin:0 0 4px}.big{font-size:34px;font-weight:800}
.bk{margin-top:12px}.bk h3{margin:14px 0 6px;font-size:15px}
.br{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--bd)}
.br span:last-child{white-space:nowrap}.g{color:var(--gt)}.r{color:var(--rt)}
.lec{font-weight:600;color:var(--ac);font-size:13px;margin-bottom:6px}#ov{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:14px}#ov summary{font-weight:700;cursor:pointer}.zero{color:var(--rt)}</style></head><body>
<header><div class="row"><span class="t">MSK Biochemistry Exam</span><span class="cnt" id="cnt">0 / 0 answered</span><button class="reset" id="rs">Reset</button></div><div class="bar"><i id="pb"></i></div></header>
<main><div id="ov"></div><div id="qs"></div><div id="score"></div></main>
<script>
const D=[{"s": "A 5-year-old passes orange crystals in his diaper and mutilates himself. What is the cause?", "sub": "Biochemistry", "lec": "Purine and Pyrimidine metabolism", "per": "After", "hy": 1, "c": 0, "o": [["HGPRT deficiency", "Correct: Lesch-Nyhan syndrome."], ["Adenosine deaminase deficiency", "SCID."], ["Xanthine oxidase deficiency", "Low uric acid."], ["PRPP synthetase superactivity", "Gout without self-mutilation."], ["Glucose-6-phosphatase deficiency", "Von Gierke disease."]]}, {"s": "A 4-year-old has recurrent infections, low WBC and low uric acid. Which enzyme is deficient?", "sub": "Biochemistry", "lec": "Purine and Pyrimidine metabolism", "per": "After", "hy": 0, "c": 2, "o": [["HGPRT", "Lesch-Nyhan, high uric acid."], ["Xanthine oxidase", "Low uric acid, no immunodeficiency."], ["Adenosine deaminase", "Correct: SCID. ⚠ PNP deficiency looks similar, so I left it out."], ["PRPP synthetase", "High uric acid."], ["Dihydrofolate reductase", "Folate metabolism."]]}, {"s": "A 7-year-old who lived in Canada for 3 years has bowed legs and rickets. Which test best confirms vitamin D deficiency?", "sub": "Biochemistry", "lec": "Bone remodeling and importance of Calcium", "per": "Before", "hy": 1, "c": 4, "o": [["Serum 1,25-dihydroxyvitamin D", "Can be normal or high."], ["Serum calcitonin", "Not diagnostic."], ["Serum creatine kinase", "Muscle injury."], ["Serum ferritin", "Iron stores."], ["Serum 25-hydroxyvitamin D", "Correct. ⚠ Your source called it an enzyme marker; it is the vitamin D status marker."]]}, {"s": "Which statement about muscle glycogenolysis is correct?", "sub": "Biochemistry", "lec": "Muscle energy metabolism", "per": "After", "hy": 0, "c": 1, "o": [["It is inhibited by glucose", "That is liver phosphorylase."], ["It is activated by cAMP", "Correct: adrenaline raises cAMP and activates phosphorylase. ⚠ Your source gave no answer."], ["It releases free glucose into blood", "Muscle lacks glucose-6-phosphatase."], ["It is activated by insulin", "Insulin favors glycogen synthesis."], ["It is inhibited by calcium", "Calcium activates it."]]}, {"s": "A sprinter runs very fast for the first 10 seconds. What is the main energy source?", "sub": "Biochemistry", "lec": "Muscle energy metabolism", "per": "After", "hy": 0, "c": 2, "o": [["Anaerobic glycolysis", "Takes over after about 10 seconds."], ["Oxidative phosphorylation", "Slow to ramp up."], ["Creatine phosphate", "Correct: immediate phosphagen system."], ["Fatty acid oxidation", "Slow, aerobic."], ["Protein catabolism", "Minor source."]]}, {"s": "Deficiency of the debranching enzyme in liver, heart and muscle is called what?", "sub": "Biochemistry", "lec": "Muscle energy metabolism", "per": "After", "hy": 0, "c": 0, "o": [["Cori disease (type III)", "Correct."], ["McArdle disease", "Muscle phosphorylase deficiency."], ["Pompe disease", "Lysosomal acid maltase."], ["Von Gierke disease", "Glucose-6-phosphatase."], ["Andersen disease", "Branching enzyme."]]}, {"s": "Which activated form of glucose is used by glycogen synthase in glycogenesis?", "sub": "Biochemistry", "lec": "Muscle energy metabolism", "per": "After", "hy": 0, "c": 3, "o": [["ADP-glucose", "Used for starch in plants."], ["Glucose-1-phosphate", "Precursor of UDP-glucose."], ["Glucose-6-phosphate", "Initial trapped intermediate."], ["UDP-glucose", "Correct. ⚠ Your source called it the first step; phosphorylation of glucose to G6P comes first."], ["UTP", "Provides the UDP carrier."]]}, {"s": "In the well-fed state, which compound inhibits CPT-1 and the carnitine shuttle?", "sub": "Biochemistry", "lec": "Muscle energy metabolism", "per": "After", "hy": 0, "c": 1, "o": [["Acetyl-CoA", "Not the inhibitor."], ["Malonyl-CoA", "Correct: blocks fatty acid entry into mitochondria."], ["Carnitine", "Substrate of the shuttle."], ["Glucagon", "Lowers malonyl-CoA."], ["Citrate", "Activates acetyl-CoA carboxylase."]]}, {"s": "Which statement about de novo purine synthesis is correct?", "sub": "Biochemistry", "lec": "Purine and Pyrimidine metabolism", "per": "After", "hy": 0, "c": 4, "o": [["Hypoxanthine is the first purine formed", "IMP is first."], ["The ring is built on a free base", "It is built on ribose-5-phosphate."], ["It requires no folate", "Folate supplies carbons."], ["It is inhibited by PRPP", "PRPP activates it."], ["PRPP amidotransferase catalyzes the committed step", "Correct."]]}, {"s": "What is the correct order of enzymes in the catabolism of AMP to uric acid?", "sub": "Biochemistry", "lec": "Purine and Pyrimidine metabolism", "per": "After", "hy": 0, "c": 0, "o": [["AMP deaminase, nucleotidase, nucleoside phosphorylase, xanthine oxidase", "Correct: AMP to IMP, inosine, hypoxanthine, then uric acid."], ["Nucleoside phosphorylase, deaminase, nucleotidase, xanthine oxidase", "Wrong order."], ["Xanthine oxidase, nucleotidase, phosphorylase, deaminase", "Reverse order."], ["Nucleotidase, phosphorylase, xanthine oxidase, deaminase", "Wrong order."], ["Nucleoside phosphorylase, nucleotidase, deaminase, xanthine oxidase", "Wrong order."]]}, {"s": "Which enzyme do the amino bisphosphonates (alendronate, risedronate) inhibit?", "sub": "Biochemistry", "lec": "Bone remodeling and importance of Calcium", "per": "Before", "hy": 0, "c": 1, "o": [["HMG-CoA reductase", "Statins."], ["Farnesyl pyrophosphate synthase", "Correct: impairs osteoclast function."], ["Carbonic anhydrase", "Acetazolamide."], ["Cathepsin K", "Odanacatib."], ["Xanthine oxidase", "Allopurinol."]]}, {"s": "Which statement about muscle training is INCORRECT?", "sub": "Biochemistry", "lec": "Muscle energy metabolism", "per": "After", "hy": 0, "c": 0, "o": [["It decreases ATP utilization", "Correct (incorrect statement): training raises capacity for ATP turnover."], ["It increases mitochondrial number", "True."], ["It increases myoglobin", "True."], ["It increases capillary density", "True."], ["It increases glycogen stores", "True."]]}, {"s": "A child fails to thrive with megaloblastic anemia that does not respond to folate and vitamin B12. What is the diagnosis?", "sub": "Biochemistry", "lec": "Purine and Pyrimidine metabolism", "per": "After", "hy": 0, "c": 0, "o": [["Orotic aciduria", "Correct: pyrimidine synthesis defect."], ["Lesch-Nyhan syndrome", "Self-mutilation and gout."], ["ADA deficiency", "SCID."], ["Xanthinuria", "Low uric acid, stones."], ["Von Gierke disease", "Hypoglycemia and hepatomegaly."]]}, {"s": "A man has pain in the great toe after an alcohol-heavy party. What is the diagnosis?", "sub": "Biochemistry", "lec": "Purine and Pyrimidine metabolism", "per": "After", "hy": 0, "c": 2, "o": [["Septic arthritis", "Fever, positive culture."], ["Rheumatoid arthritis", "Small joint polyarthritis."], ["Primary gout", "Correct: urate crystal arthritis, classic big toe."], ["Pseudogout", "Positively birefringent crystals, knee."], ["Osteoarthritis", "Degenerative, not acute."]]}, {"s": "What is the active form of vitamin D?", "sub": "Biochemistry", "lec": "Bone remodeling and importance of Calcium", "per": "Before", "hy": 0, "c": 1, "o": [["Calcifediol", "25-hydroxyvitamin D."], ["Calcitriol", "Correct: 1,25-dihydroxyvitamin D."], ["Cholecalciferol", "Vitamin D3."], ["Ergocalciferol", "Vitamin D2."], ["7-dehydrocholesterol", "Skin precursor."]]}, {"s": "Deficiency of which glycogen metabolism enzyme causes severe hypoglycemia?", "sub": "Biochemistry", "lec": "Muscle energy metabolism", "per": "After", "hy": 0, "c": 0, "o": [["Liver glucose-6-phosphatase", "Correct: von Gierke disease."], ["Muscle phosphorylase", "McArdle disease, no hypoglycemia."], ["Lysosomal acid maltase", "Pompe disease."], ["Branching enzyme", "Andersen disease."], ["Muscle phosphofructokinase", "Tarui disease."]]}, {"s": "Which statement about glycogen phosphorylase is correct?", "sub": "Biochemistry", "lec": "Muscle energy metabolism", "per": "After", "hy": 0, "c": 3, "o": [["It is stimulated by ATP", "ATP inhibits it."], ["It is stimulated by insulin", "Insulin inhibits glycogenolysis."], ["It is inhibited by epinephrine", "Epinephrine activates it."], ["In muscle it is stimulated by AMP", "Correct: signals low energy."], ["It is inhibited by calcium", "Calcium activates it in muscle."]]}, {"s": "Which statement about anaerobic exercise is INCORRECT?", "sub": "Biochemistry", "lec": "Muscle energy metabolism", "per": "After", "hy": 0, "c": 2, "o": [["It produces lactate by anaerobic glycolysis", "True."], ["It relies on fast-twitch fibers", "True."], ["It depends on oxidation of fatty acids", "Correct (incorrect statement): fatty acid oxidation is aerobic."], ["It uses creatine phosphate", "True."], ["It is limited in duration", "True."]]}];
const L="ABCDE";const LECT=["Bone remodeling and importance of Calcium", "Purine and Pyrimidine metabolism", "Muscle energy metabolism"];function ov(){const c={};D.forEach(q=>c[q.lec]=(c[q.lec]||0)+1);document.getElementById("ov").innerHTML='<details open><summary>'+D.length+' questions: lecture breakdown</summary>'+LECT.map(l=>'<div class="br"><span>'+l+'</span><span class="'+(c[l]?'':'zero')+'">'+(c[l]||"0, not covered yet")+'</span></div>').join('')+'</details>'}
let A=[];
function init(){A=Array(D.length).fill(null);const w=document.getElementById("qs");w.innerHTML="";ov();
D.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.id="q"+i;
d.innerHTML='<div class="qn">Question '+(i+1)+(q.hy?'<span class="hy">★ HIGH YIELD</span>':'')+'</div><div class="lec">'+q.lec+'</div><div class="qt">'+q.s+'</div>'+q.o.map((o,j)=>'<button class="o" data-i="'+i+'" data-j="'+j+'"><b>'+L[j]+'</b>'+o[0]+'<small>'+o[1]+'</small></button>').join('')+'<div class="tags"><span>'+q.sub+'</span><span>'+q.per+' Midterm</span></div>';w.appendChild(d)});
document.getElementById("score").style.display="none";upd()}
function upd(){const n=A.filter(a=>a!=null).length;document.getElementById("cnt").textContent=n+" / "+D.length+" answered";document.getElementById("pb").style.width=(100*n/D.length)+"%"}
document.addEventListener("click",e=>{const b=e.target.closest(".o");if(!b)return;const i=+b.dataset.i,j=+b.dataset.j;if(A[i]!=null)return;A[i]=j;
const c=document.getElementById("q"+i);c.classList.add("done");const bs=c.querySelectorAll(".o");bs[D[i].c].classList.add("ok");if(j!==D[i].c)bs[j].classList.add("no");upd();if(A.every(a=>a!=null))fin()});
function grp(k){const m={};D.forEach((q,i)=>{const key=k=="per"?q.per+" Midterm":q[k];m[key]=m[key]||[0,0];m[key][1]++;if(A[i]===q.c)m[key][0]++});
return Object.entries(m).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]).map(([n,v])=>{const p=Math.round(100*v[0]/v[1]);return '<div class="br"><span>'+n+' ('+v[0]+'/'+v[1]+')</span><span><span class="g">'+p+'% right</span> · <span class="r">'+(100-p)+'% wrong</span></span></div>'}).join('')}
function fin(){const s=D.filter((q,i)=>A[i]===q.c).length,p=Math.round(100*s/D.length);
const v=p>=85?"Excellent. You're exam-ready on this set.":p>=70?"Solid. Review the weak tags below.":p>=50?"Getting there. Focus on the weakest lectures first.":"Needs work. Revisit the lectures listed at the top below.";
const e=document.getElementById("score");e.style.display="block";e.innerHTML='<h2>Final score</h2><div class="big">'+s+' / '+D.length+' · '+p+'%</div><div>'+v+'</div><div class="bk"><h3>By lecture (weakest first)</h3>'+grp("lec")+'<h3>Before vs after midterm</h3>'+grp("per")+'</div>';e.scrollIntoView({behavior:"smooth"})}
document.getElementById("rs").onclick=()=>{init();window.scrollTo({top:0,behavior:"smooth"})};
init();
</script></body></html>
