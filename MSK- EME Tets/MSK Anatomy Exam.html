<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#5d6773;--bd:#d9dee5;--ac:#3b5bdb;--gb:#e3f6e8;--gt:#1c7a3a;--rb:#fde6e6;--rt:#b3261e;--tag:#eef1f6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1216;--card:#181c22;--tx:#e8ebef;--mu:#9aa5b1;--bd:#2c333c;--ac:#8ea2ff;--gb:#12301c;--gt:#6fdc92;--rb:#3a1717;--rt:#ff9a93;--tag:#232a33}}
:root[data-theme="dark"]{--bg:#0f1216;--card:#181c22;--tx:#e8ebef;--mu:#9aa5b1;--bd:#2c333c;--ac:#8ea2ff;--gb:#12301c;--gt:#6fdc92;--rb:#3a1717;--rt:#ff9a93;--tag:#232a33}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:720px;margin:0 auto}
.t{font-weight:700}.cnt{color:var(--mu);font-size:14px}
button.reset{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer}
.bar{max-width:720px;margin:8px auto 0;height:6px;background:var(--tag);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .25s}
main{max-width:720px;margin:0 auto;padding:14px}
.q{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.qn{color:var(--mu);font-size:13px;margin-bottom:4px}.hy{background:#ffd43b;color:#5c4400;border-radius:6px;padding:1px 7px;font-weight:700;font-size:12px;margin-left:6px}
.qt{font-weight:600;margin-bottom:10px}
.o{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px;font:inherit;cursor:pointer}
.o b{display:inline-block;width:22px;color:var(--mu)}.o small{display:none;margin-top:4px;font-size:13px;color:var(--mu)}
.done .o{cursor:default}.done .o small{display:block}
.o.ok{background:var(--gb);border-color:var(--gt)}.o.ok small,.o.ok b{color:var(--gt)}
.o.no{background:var(--rb);border-color:var(--rt)}.o.no small,.o.no b{color:var(--rt)}
.tags{display:none;flex-wrap:wrap;gap:6px;margin-top:6px}.done .tags{display:flex}
.tags span{background:var(--tag);color:var(--mu);border-radius:999px;padding:2px 9px;font-size:12px}
#score{display:none;background:var(--card);border:2px solid var(--ac);border-radius:14px;padding:16px}
#score h2{margin:0 0 4px}.big{font-size:34px;font-weight:800}
.bk{margin-top:12px}.bk h3{margin:14px 0 6px;font-size:15px}
.br{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--bd)}
.br span:last-child{white-space:nowrap}.g{color:var(--gt)}.r{color:var(--rt)}
.lec{font-weight:600;color:var(--ac);font-size:13px;margin-bottom:6px}#ov{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:14px}#ov summary{font-weight:700;cursor:pointer}.zero{color:var(--rt)}</style></head><body>

const D=[{"s": "Lymphatic vessels that accompany the cephalic vein drain into which group of lymph nodes?", "sub": "Anatomy", "lec": "Venous and lymphatic drainage of upper limb", "per": "Before", "hy": 1, "c": 2, "o": [["Lateral (humeral) axillary nodes", "Receive most arm lymph, but not the cephalic vessels."], ["Central axillary nodes", "Receive efferents from other groups."], ["Apical (infraclavicular) nodes", "Correct: vessels along the cephalic vein pass the deltopectoral groove to the apical nodes."], ["Posterior (subscapular) nodes", "Drain the back and scapular region."], ["Anterior (pectoral) nodes", "Drain the anterior chest wall and breast."]]}, {"s": "Congenital absence of the nipple, with normal breast tissue, is termed?", "sub": "Anatomy", "lec": "Mammary Gland", "per": "Before", "hy": 0, "c": 1, "o": [["Amastia", "Absence of the entire breast."], ["Athelia", "Correct: absent nipple."], ["Polythelia", "Supernumerary nipples."], ["Polymastia", "Supernumerary breast tissue."], ["Micromastia", "Underdeveloped breast."]]}, {"s": "A man can stand on his left lower limb but not on the right, because the pelvis drops. Which nerve is most likely injured?", "sub": "Anatomy", "lec": "Nerve injuries of LL", "per": "After", "hy": 1, "c": 1, "o": [["Right inferior gluteal nerve", "Weakens gluteus maximus (rising, climbing), not pelvic stability."], ["Right superior gluteal nerve", "Correct: gluteus medius and minimus stabilize the pelvis. ⚠ Your source said inferior gluteal, so I used the mainstream answer."], ["Right femoral nerve", "Weak knee extension."], ["Right obturator nerve", "Weak thigh adduction."], ["Right sciatic nerve", "Weak knee flexion and foot drop."]]}, {"s": "Which statement about nerve injuries of the lower limb is INCORRECT?", "sub": "Anatomy", "lec": "Nerve injuries of LL", "per": "After", "hy": 0, "c": 3, "o": [["Common fibular nerve injury causes foot drop.", "True."], ["Superior gluteal nerve injury causes a positive Trendelenburg sign.", "True."], ["Femoral nerve injury weakens knee extension.", "True."], ["Tibial nerve injury leads to loss of knee flexion.", "Correct (incorrect statement): hamstring branches leave the sciatic nerve above the knee, so flexion is preserved."], ["Obturator nerve injury weakens thigh adduction.", "True."]]}, {"s": "An elderly woman slips and breaks a bone; her leg is shortened and laterally rotated. Which site is most likely fractured?", "sub": "Anatomy", "lec": "Hip and knee joint", "per": "After", "hy": 0, "c": 0, "o": [["Neck of femur", "Correct: classic deformity. ⚠ Your source said ischium (hamstrings), which does not cause this; I used the mainstream answer and dropped 'adducted'."], ["Ischium", "Does not shorten or rotate the leg."], ["Shaft of tibia", "Affects the leg, not hip position."], ["Patella", "Affects knee extension."], ["Pubic ramus", "Causes groin pain, not deformity."]]}, {"s": "Which statement about the medial longitudinal arch is INCORRECT?", "sub": "Anatomy", "lec": "Arches of foot and ankle joint", "per": "After", "hy": 0, "c": 1, "o": [["Its keystone is the talus.", "True."], ["Its keystone is the middle cuneiform bone.", "Correct (incorrect statement): the keystone is the talus."], ["Tibialis posterior helps support it.", "True."], ["The spring ligament supports the head of the talus.", "True."], ["It is formed by the calcaneus, talus, navicular, three cuneiforms and three medial metatarsals.", "True."]]}, {"s": "A fracture of the medial malleolus most endangers the tendon in the groove directly behind it. Which muscle?", "sub": "Anatomy", "lec": "Sole and retinaculum around ankle", "per": "After", "hy": 0, "c": 3, "o": [["Tibialis anterior", "Passes in front of the ankle."], ["Peroneus longus", "Lies behind the lateral malleolus."], ["Peroneus brevis", "Lies behind the lateral malleolus."], ["Tibialis posterior", "Correct: its tendon grooves the back of the medial malleolus."], ["Extensor hallucis longus", "Anterior compartment."]]}, {"s": "Clergyman's knee is caused by inflammation of which structure?", "sub": "Anatomy", "lec": "Hip and knee joint", "per": "After", "hy": 0, "c": 1, "o": [["Prepatellar bursa", "Housemaid's knee."], ["Infrapatellar bursa", "Correct."], ["Suprapatellar bursa", "Communicates with the knee joint."], ["Pes anserine bursa", "Medial proximal tibia."], ["Semimembranosus bursa", "Baker's cyst."]]}, {"s": "Which statement best describes tibialis anterior?", "sub": "Anatomy", "lec": "Popliteal fossa and leg", "per": "After", "hy": 1, "c": 4, "o": [["It is supplied by the superficial fibular nerve.", "Supplied by the deep fibular nerve."], ["It attaches distally to the base of the 5th metatarsal.", "Attaches to the medial cuneiform and base of the 1st metatarsal."], ["Its paralysis causes inability to plantarflex.", "It causes foot drop (cannot dorsiflex)."], ["It acts primarily at the knee joint.", "Acts at the ankle."], ["It is paralyzed by a lesion of the common fibular nerve.", "Correct: the deep branch arises from it."]]}, {"s": "Which structure's integrity is tested by the anterior drawer test?", "sub": "Anatomy", "lec": "Hip and knee joint", "per": "After", "hy": 1, "c": 2, "o": [["Posterior cruciate ligament", "Posterior drawer."], ["Medial collateral ligament", "Valgus stress."], ["Anterior cruciate ligament", "Correct: prevents forward tibial displacement."], ["Lateral collateral ligament", "Varus stress."], ["Medial meniscus", "McMurray test."]]}, {"s": "A man with great saphenous varicose veins has a tourniquet test: the vein is occluded in the upper thigh and rapidly refills on release. Which valve is most likely incompetent?", "sub": "Anatomy", "lec": "Venous and lymphatic drainage of Lower limb", "per": "After", "hy": 0, "c": 0, "o": [["Saphenofemoral valve", "Correct: reflux from the femoral vein."], ["Perforator valves", "Would fill while still occluded."], ["Saphenopopliteal valve", "Small saphenous system."], ["Femoral vein valves", "Not tested by this maneuver."], ["Dorsal venous arch valves", "Not tested here."]]}, {"s": "A woman has right-sided breast cancer. To which lymph nodes is it NOT expected to metastasize?", "sub": "Anatomy", "lec": "Mammary Gland", "per": "Before", "hy": 0, "c": 3, "o": [["Right axillary nodes", "Main drainage."], ["Parasternal nodes", "Medial drainage."], ["Supraclavicular nodes", "Late spread."], ["Inguinal nodes", "Correct: not on the breast drainage pathway."], ["Infraclavicular nodes", "Spread via axillary chain."]]}, {"s": "At approximately what age do the milk (deciduous) central incisors erupt?", "sub": "Anatomy", "lec": "Forensics: Medicolegal aspects of MSK", "per": "After", "hy": 0, "c": 1, "o": [["3 months", "Too early; no teeth are usually present."], ["6 months", "Correct: the first milk teeth, used in forensic age estimation."], ["12 months", "Lateral incisors and first molars are erupting around now."], ["18 months", "Canines erupt around this age."], ["24 months", "Second molars erupt; the set is nearly complete."]]}, {"s": "The joint between the first metacarpal and the trapezium is which type?", "sub": "Anatomy", "lec": "Nerve injuries and joints of UL", "per": "Before", "hy": 0, "c": 2, "o": [["Ball and socket joint", "Shoulder and hip."], ["Hinge joint", "Elbow."], ["Saddle joint", "Correct: allows opposition of the thumb."], ["Pivot joint", "Proximal radioulnar joint."], ["Plane joint", "Intercarpal joints."]]}, {"s": "A mid-shaft humeral injury most likely damages which artery?", "sub": "Anatomy", "lec": "Axilla, Arm and Brachial Plexus", "per": "Before", "hy": 1, "c": 0, "o": [["Profunda brachii artery", "Correct: runs in the radial groove."], ["Posterior circumflex humeral artery", "Surgical neck."], ["Subscapular artery", "Axillary branch."], ["Thoracodorsal artery", "Supplies latissimus dorsi."], ["Radial recurrent artery", "Near the elbow."]]}, {"s": "After a mid-shaft humeral fracture a man cannot extend his wrist. Which nerve is affected?", "sub": "Anatomy", "lec": "Axilla, Arm and Brachial Plexus", "per": "Before", "hy": 1, "c": 4, "o": [["Median nerve", "Flexes the wrist."], ["Ulnar nerve", "Medial hand muscles."], ["Musculocutaneous nerve", "Arm flexors."], ["Axillary nerve", "Deltoid and teres minor."], ["Radial nerve", "Correct: runs in the radial groove, causing wrist drop."]]}, {"s": "A woman has a painful 0.2 cm tumour under the nail of her left index finger. Which nerve must be blocked for surgery?", "sub": "Anatomy", "lec": "Wrist – Carpal Tunnel & Hand", "per": "Before", "hy": 0, "c": 1, "o": [["Ulnar nerve", "Medial hand."], ["Median nerve", "Correct: digital branches supply the index finger."], ["Radial nerve", "Dorsal hand only."], ["Musculocutaneous nerve", "Lateral forearm."], ["Axillary nerve", "Shoulder."]]}, {"s": "Which statement about the cubital fossa is true?", "sub": "Anatomy", "lec": "Cubital fossa, Forearm and flexor retinaculum", "per": "Before", "hy": 0, "c": 0, "o": [["The median cubital vein lies in its roof.", "Correct. ⚠ Your source gave no answer; this is the only true option."], ["The ulnar nerve is a content of the fossa.", "It passes behind the medial epicondyle."], ["The brachial artery lies lateral to the biceps tendon.", "It lies medial to the tendon."], ["Brachioradialis forms the roof of the fossa.", "It forms the lateral border."], ["Pronator teres forms the lateral border.", "It forms the medial border."]]}, {"s": "A man ruptures his biceps tendon but can still flex his elbow. Which muscles are responsible?", "sub": "Anatomy", "lec": "Axilla, Arm and Brachial Plexus", "per": "Before", "hy": 0, "c": 3, "o": [["Triceps and anconeus", "Extensors."], ["Deltoid and supraspinatus", "Shoulder muscles."], ["Coracobrachialis and teres major", "Shoulder movers."], ["Brachialis and brachioradialis", "Correct: remaining elbow flexors."], ["Pectoralis major and latissimus dorsi", "Shoulder movers."]]}, {"s": "A man falls from a height, grabs a tree branch and hangs by one arm. Which part of the brachial plexus is most likely injured?", "sub": "Anatomy", "lec": "Axilla, Arm and Brachial Plexus", "per": "Before", "hy": 0, "c": 1, "o": [["Upper trunk (C5-C6)", "Injured by forced shoulder depression (Erb)."], ["Lower trunk (C8-T1)", "Correct: upward traction of the abducted arm (Klumpke). ⚠ Your source said upper root."], ["Middle trunk (C7)", "Rarely isolated."], ["Posterior cord", "Axillary and radial nerves."], ["Lateral cord", "Musculocutaneous and median."]]}, {"s": "Syndactyly results from failure of what process?", "sub": "Anatomy", "lec": "Development - MSK", "per": "Before", "hy": 1, "c": 2, "o": [["Apical ectodermal ridge formation", "Failure causes limb truncation."], ["Neural crest migration", "Not involved."], ["Apoptosis of tissue between the digital rays", "Correct: webbing persists."], ["Ossification of phalanges", "Affects bone, not webbing."], ["Myotome migration", "Muscle development."]]}, {"s": "The bone and cartilage of the limbs develop from which layer?", "sub": "Anatomy", "lec": "Development - MSK", "per": "Before", "hy": 0, "c": 0, "o": [["Parietal layer of lateral plate mesoderm", "Correct: somatopleure."], ["Visceral layer of lateral plate mesoderm", "Forms gut wall."], ["Paraxial mesoderm (somites)", "Forms limb muscles."], ["Intermediate mesoderm", "Urogenital system."], ["Neural crest", "Not the limb skeleton."]]}, {"s": "The muscle that initiates arm abduction is supplied by which nerve?", "sub": "Anatomy", "lec": "Pectoral & shoulder region including shoulder joint", "per": "Before", "hy": 1, "c": 3, "o": [["Axillary nerve", "Deltoid abducts after 15 degrees."], ["Long thoracic nerve", "Serratus anterior."], ["Thoracodorsal nerve", "Latissimus dorsi."], ["Suprascapular nerve", "Correct: supplies supraspinatus."], ["Upper subscapular nerve", "Subscapularis."]]}, {"s": "After a left mastectomy a woman's left scapula protrudes. Which muscle is injured?", "sub": "Anatomy", "lec": "Axilla, Arm and Brachial Plexus", "per": "Before", "hy": 0, "c": 2, "o": [["Trapezius", "Spinal accessory nerve."], ["Rhomboid major", "Dorsal scapular nerve."], ["Serratus anterior", "Correct: long thoracic nerve injury causes winging."], ["Latissimus dorsi", "Thoracodorsal nerve."], ["Levator scapulae", "Dorsal scapular nerve."]]}, {"s": "Which statement about the scapula is true?", "sub": "Anatomy", "lec": "Osteology of Upper Limb", "per": "Before", "hy": 0, "c": 0, "o": [["The spine divides the dorsal surface into two parts.", "Correct: supraspinous and infraspinous fossae."], ["The spine continues laterally as the coracoid process.", "It continues as the acromion."], ["The inferior angle lies at the level of T4.", "It lies at about T7."], ["The suprascapular nerve passes above the superior transverse ligament.", "It passes below it."], ["The subscapular fossa lies on the dorsal surface.", "It lies on the costal surface."]]}, {"s": "A man is injured on the posteromedial side of the elbow in a street fight. Which nerve is most likely injured?", "sub": "Anatomy", "lec": "Nerve injuries and joints of UL", "per": "Before", "hy": 1, "c": 4, "o": [["Radial nerve", "Spiral groove and lateral elbow."], ["Median nerve", "Cubital fossa."], ["Musculocutaneous nerve", "Lateral forearm."], ["Axillary nerve", "Shoulder."], ["Ulnar nerve", "Correct: passes behind the medial epicondyle."]]}, {"s": "A soccer player injures the area below the knee, and the tibia appears pushed backward on the femur. Which ligament is most likely injured?", "sub": "Anatomy", "lec": "Hip and knee joint", "per": "After", "hy": 0, "c": 3, "o": [["Anterior cruciate ligament", "Anterior tibial displacement."], ["Medial collateral ligament", "Valgus instability."], ["Lateral collateral ligament", "Varus instability."], ["Posterior cruciate ligament", "Correct. ⚠ Your source said medial meniscus, which is not a ligament."], ["Medial meniscus", "Locking and joint-line pain."]]}, {"s": "After a fracture of the neck of the fibula, which movement tests the common peroneal nerve?", "sub": "Anatomy", "lec": "Nerve injuries of LL", "per": "After", "hy": 1, "c": 1, "o": [["Plantarflexion of the ankle", "Tibial nerve."], ["Dorsiflexion of the ankle", "Correct: deep peroneal branch."], ["Knee flexion", "Hamstrings."], ["Hip abduction", "Superior gluteal nerve."], ["Toe flexion", "Tibial nerve."]]}, {"s": "Where is the posterior tibial artery best palpated?", "sub": "Anatomy", "lec": "Sole and retinaculum around ankle", "per": "After", "hy": 0, "c": 2, "o": [["Behind the lateral malleolus", "Peroneal tendons."], ["Dorsum of the foot", "Dorsalis pedis."], ["Behind the medial malleolus", "Correct."], ["In the popliteal fossa", "Popliteal pulse."], ["In front of the ankle", "Anterior tibial artery."]]}, {"s": "Where is the dorsalis pedis artery palpated?", "sub": "Anatomy", "lec": "Imaging and surface marking of LL", "per": "After", "hy": 0, "c": 1, "o": [["Behind the medial malleolus", "Posterior tibial artery."], ["On the dorsum of the foot, midway between the malleoli", "Correct: lateral to extensor hallucis longus."], ["Behind the lateral malleolus", "Peroneal tendons."], ["On the sole", "Plantar arteries."], ["In the popliteal fossa", "Popliteal artery."]]}, {"s": "In anterior compartment syndrome, which skin area tests the deep peroneal nerve?", "sub": "Anatomy", "lec": "Popliteal fossa and leg", "per": "After", "hy": 0, "c": 0, "o": [["Dorsum of the foot between the 1st and 2nd digits", "Correct: its only cutaneous area."], ["Lateral foot", "Sural nerve."], ["Sole of the foot", "Tibial nerve."], ["Medial malleolus", "Saphenous nerve."], ["Heel", "Tibial nerve."]]}, {"s": "Lateral ankle pain follows excessive inversion. Which ligament is affected?", "sub": "Anatomy", "lec": "Arches of foot and ankle joint", "per": "After", "hy": 0, "c": 4, "o": [["Deltoid ligament", "Medial ankle, eversion injury."], ["Spring ligament", "Supports the medial arch."], ["Long plantar ligament", "Supports the lateral arch."], ["Tibiofibular synde
