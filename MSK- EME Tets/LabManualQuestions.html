            { id: 64, tag: "pathology-oncology", text: "What feature confirms cutaneous squamous cell carcinoma?", options: ["Basaloid palisading", "Invasive malignant squamous cells infiltrating the dermis with keratin pearl formation", "Atypical melanocytes", "Glandular ducts", "Desmoplasia"], correct: 1, explanation: "Dermal invasion by squamous cells forming keratin pearls." },
            { id: 65, tag: "pathology-oncology", text: "What morphological features define Basal Cell Carcinoma?", options: ["Pearly, translucent papule with telangiectasia; microscopy shows basaloid nests with peripheral palisading and clefting", "Hyperkeratotic nodules", "Pigmented invasion", "Rubbery mass", "Desmoplastic stroma"], correct: 0, explanation: "Pearly papule with peripheral palisading and shrinkage clefts." },
            { id: 66, tag: "pathology-oncology", text: "What microscopic finding is critical in diagnosing Melanoma?", options: ["Pericanalicular stroma", "Atypical melanocytes invading the dermis with cellular pleomorphism and intracellular melanin pigment", "Urate crystals", "Giant cells", "Keratinization"], correct: 1, explanation: "Vertical dermal invasion by pleomorphic melanocytes with melanin pigment." },
            { id: 67, tag: "pathology-oncology", text: "What are the characteristics of a Fibroadenoma?", options: ["Infiltrative mass", "Well-circumscribed, rubbery, firm, grayish-white mass with proliferation of epithelial and stromal tissue", "Cartilage", "Hemorrhagic mass", "Ulcerated nodule"], correct: 1, explanation: "Benign biphasic breast tumor with glandular and stromal elements." },
            { id: 68, tag: "pathology-oncology", text: "What characterizes Invasive Breast Carcinoma?", options: ["Well-demarcated ducts", "Irregular, firm, infiltrative mass with malignant ductal cells surrounded by a desmoplastic stromal reaction", "Basaloid palisading", "Hyaline caps", "Urate tophi"], correct: 1, explanation: "Infiltrative malignant ducts with desmoplastic stroma." }
        ];

        let currentTagFilter = 'all';
        let currentStatusFilter = 'all';
        const userState = {};

        function renderQuiz() {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';
            let answered = 0, correct = 0, incorrect = 0;

            const filtered = questions.filter(q => {
                const state = userState[q.id] || {};
                if (currentTagFilter !== 'all' && q.tag !== currentTagFilter) return false;
                if (currentStatusFilter === 'unanswered') return state.selected === undefined;
                if (currentStatusFilter === 'incorrect') return state.selected !== undefined && state.selected !== q.correct;
                if (currentStatusFilter === 'bookmarked') return state.bookmarked === true;
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="bg-white p-8 rounded-xl shadow-sm text-center text-slate-500">No questions match filters.</div>`;
            }

            filtered.forEach((q, index) => {
                const state = userState[q.id] || {};
                const isAnswered = state.selected !== undefined;
                if (isAnswered) {
                    answered++;
                    if (state.selected === q.correct) correct++;
                    else incorrect++;
                }

                const card = document.createElement('div');
                card.className = "bg-white rounded-xl shadow-sm border border-slate-200 p-6 transition";
                
                let optionsHtml = '';
                q.options.forEach((opt, optIndex) => {
                    let btnClass = "w-full text-left p-3 rounded-lg border text-sm font-medium transition flex items-center justify-between ";
                    if (!isAnswered) {
                        btnClass += "border-slate-200 bg-white hover:bg-slate-50 text-slate-700";
                    } else {
                        if (optIndex === q.correct) btnClass += "border-emerald-500 bg-emerald-50 text-emerald-900 font-semibold";
                        else if (optIndex === state.selected) btnClass += "border-rose-500 bg-rose-50 text-rose-900";
                        else btnClass += "border-slate-200 bg-slate-50 text-slate-400 opacity-60";
                    }
                    optionsHtml += `
                        <button onclick="handleSelect(${q.id}, ${optIndex})" ${isAnswered ? 'disabled' : ''} class="${btnClass}">
                            <span><strong class="mr-2">${String.fromCharCode(65 + optIndex)}.</strong> ${opt}</span>
                            ${isAnswered && optIndex === q.correct ? '<span class="text-emerald-600 font-bold">✓ Correct</span>' : ''}
                            ${isAnswered && optIndex === state.selected && optIndex !== q.correct ? '<span class="text-rose-600 font-bold">✗ Choice</span>' : ''}
                        </button>
                    `;
                });

                card.innerHTML = `
                    <div class="flex items-start justify-between gap-4 mb-4">
                        <div class="flex items-center gap-2">
                            <span class="bg-indigo-100 text-indigo-800 text-xs font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">${q.tag.replace('-', ' ')}</span>
                            <span class="text-xs text-slate-400">QID: ${q.id}</span>
                        </div>
                        <button onclick="toggleBookmark(${q.id})" class="text-slate-400 hover:text-amber-500 transition">${state.bookmarked ? '⭐' : '☆'}</button>
                    </div>
                    <h3 class="text-base font-semibold text-slate-900 mb-4">${index + 1}. ${q.text}</h3>
                    <div class="space-y-2 mb-4">${optionsHtml}</div>
                    <div class="${isAnswered ? '' : 'hidden'} bg-slate-50 border-l-4 border-indigo-500 p-4 rounded-r-lg text-sm text-slate-700 mt-4">
                        <strong class="text-indigo-900 block mb-1">Explanation:</strong> ${q.explanation}
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById('stat-answered').innerText = answered;
            document.getElementById('stat-total').innerText = questions.length;
            document.getElementById('stat-accuracy').innerText = (answered > 0 ? Math.round((correct / answered) * 100) : 0) + '%';
            document.getElementById('stat-correct').innerText = correct + ' C';
            document.getElementById('stat-incorrect').innerText = incorrect + ' I';
        }

        function handleSelect(qId, optIndex) {
            if (!userState[qId]) userState[qId] = {};
            userState[qId].selected = optIndex;
            renderQuiz();
        }

        function toggleBookmark(qId) {
            if (!userState[qId]) userState[qId] = {};
            userState[qId].bookmarked = !userState[qId].bookmarked;
            renderQuiz();
        }

        function setTagFilter(tag) {
            currentTagFilter = tag;
            document.querySelectorAll('.tag-btn').forEach(b => {
                b.className = b.dataset.tag === tag ? "tag-btn px-3 py-1 rounded-full font-medium transition bg-indigo-600 text-white" : "tag-btn px-3 py-1 rounded-full font-medium transition bg-white border border-slate-300 text-slate-700 hover:bg-slate-100";
            });
            renderQuiz();
        }

        function setStatusFilter(status) {
            currentStatusFilter = status;
            document.querySelectorAll('.status-btn').forEach(b => {
                b.className = b.dataset.status === status ? "status-btn px-2.5 py-1 rounded bg-indigo-50 text-indigo-700 font-semibold" : "status-btn px-2.5 py-1 rounded bg-white border border-slate-300 text-slate-600";
            });
            renderQuiz();
        }

        renderQuiz();
    </script>
</body>
</html>
