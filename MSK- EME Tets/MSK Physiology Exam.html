<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>MSK Physiology Exam</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#5d6773;--bd:#d9dee5;--ac:#3b5bdb;--gb:#e3f6e8;--gt:#1c7a3a;--rb:#fde6e6;--rt:#b3261e;--tag:#eef1f6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1216;--card:#181c22;--tx:#e8ebef;--mu:#9aa5b1;--bd:#2c333c;--ac:#8ea2ff;--gb:#12301c;--gt:#6fdc92;--rb:#3a1717;--rt:#ff9a93;--tag:#232a33}}
:root[data-theme="dark"]{--bg:#0f1216;--card:#181c22;--tx:#e8ebef;--mu:#9aa5b1;--bd:#2c333c;--ac:#8ea2ff;--gb:#12301c;--gt:#6fdc92;--rb:#3a1717;--rt:#ff9a93;--tag:#232a33}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:720px;margin:0 auto}
.t{font-weight:700}.cnt{color:var(--mu);font-size:14px}
button.reset{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer}
.bar{max-width:720px;margin:8px auto 0;height:6px;background:var(--tag);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .25s}
main{max-width:720px;margin:0 auto;padding:14px}
.q{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.qn{color:var(--mu);font-size:13px;margin-bottom:4px}.hy{background:#ffd43b;color:#5c4400;border-radius:6px;padding:1px 7px;font-weight:700;font-size:12px;margin-left:6px}
.qt{font-weight:600;margin-bottom:10px}
.o{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px;font:inherit;cursor:pointer}
.o b{display:inline-block;width:22px;color:var(--mu)}.o small{display:none;margin-top:4px;font-size:13px;color:var(--mu)}
.done .o{cursor:default}.done .o small{display:block}
.o.ok{background:var(--gb);border-color:var(--gt)}.o.ok small,.o.ok b{color:var(--gt)}
.o.no{background:var(--rb);border-color:var(--rt)}.o.no small,.o.no b{color:var(--rt)}
.tags{display:none;flex-wrap:wrap;gap:6px;margin-top:6px}.done .tags{display:flex}
.tags span{background:var(--tag);color:var(--mu);border-radius:999px;padding:2px 9px;font-size:12px}
#score{display:none;background:var(--card);border:2px solid var(--ac);border-radius:14px;padding:16px}
#score h2{margin:0 0 4px}.big{font-size:34px;font-weight:800}
.bk{margin-top:12px}.bk h3{margin:14px 0 6px;font-size:15px}
.br{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--bd)}
.br span:last-child{white-space:nowrap}.g{color:var(--gt)}.r{color:var(--rt)}
.lec{font-weight:600;color:var(--ac);font-size:13px;margin-bottom:6px}#ov{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:14px}#ov summary{font-weight:700;cursor:pointer}.zero{color:var(--rt)}</style></head><body>
<header><div class="row"><span class="t">MSK Physiology Exam</span><span class="cnt" id="cnt">0 / 0 answered</span><button class="reset" id="rs">Reset</button></div><div class="bar"><i id="pb"></i></div></header>
<main><div id="ov"></div><div id="qs"></div><div id="score"></div></main>
<script>
const D=[{"s": "A person lifting weights is given an extra 10 kg to lift. The extra force is most likely due to what?", "sub": "Physiology", "lec": "Types of muscle contractions & length tension relationship", "per": "Before", "hy": 0, "c": 3, "o": [["Hypertrophy of muscle fibers", "Takes weeks."], ["Hyperplasia of fibers", "Does not occur acutely."], ["Increased fiber length", "Not the mechanism."], ["Recruitment of additional motor units", "Correct: size principle."], ["Increased myoglobin", "Aerobic adaptation."]]}, {"s": "A marathon runner trains for a month and the thigh muscle enlarges. What is the cause?", "sub": "Physiology", "lec": "Types and properties of muscles", "per": "Before", "hy": 1, "c": 1, "o": [["Hyperplasia of muscle fibers", "Rare in humans."], ["Hypertrophy of individual muscle fibers", "Correct: more myofibrils per fiber."], ["Fat infiltration", "Not training related."], ["Edema", "Transient."], ["Connective tissue proliferation", "Not the cause."]]}, {"s": "Which ion's diffusion potential contributes most to the resting membrane potential, and so changes in hyperkalemia?", "sub": "Physiology", "lec": "Electrophysiology of the muscle", "per": "Before", "hy": 0, "c": 0, "o": [["K+", "Correct: high permeability, setting the negative RMP."], ["Na+", "Low resting permeability."], ["Ca2+", "Minor contribution."], ["Cl-", "Minor in muscle."], ["Mg2+", "Not a significant contributor."]]}, {"s": "What is a motor unit?", "sub": "Physiology", "lec": "Types and properties of muscles", "per": "Before", "hy": 0, "c": 3, "o": [["A single muscle fiber", "Not a unit."], ["A muscle spindle", "A sensory receptor."], ["A sarcomere", "Contractile unit."], ["A motor neuron and the muscle fibers it innervates", "Correct."], ["A neuromuscular junction", "Synapse only."]]}, {"s": "What is the function of troponin C?", "sub": "Physiology", "lec": "Molecular Basis of muscle contraction", "per": "Before", "hy": 1, "c": 1, "o": [["Blocks the myosin binding site", "Tropomyosin."], ["Binds calcium when intracellular calcium rises before contraction", "Correct."], ["Binds myosin heads", "Actin."], ["Pumps calcium back into the SR", "SERCA."], ["Hydrolyzes ATP", "Myosin ATPase."]]}, {"s": "Relaxation of skeletal muscle depends on pumping Ca2+ back into the sarcoplasmic reticulum by what?", "sub": "Physiology", "lec": "Excitation–contraction coupling in skeletal muscle", "per": "Before", "hy": 0, "c": 4, "o": [["Na-K ATPase", "Maintains ionic gradients."], ["Ryanodine receptor", "Releases calcium."], ["Dihydropyridine receptor", "Voltage sensor."], ["Na-Ca exchanger", "Minor in skeletal muscle."], ["SERCA (Ca-ATPase)", "Correct."]]}, {"s": "Which feature distinguishes smooth muscle from skeletal and cardiac muscle?", "sub": "Physiology", "lec": "Types and properties of muscles", "per": "Before", "hy": 0, "c": 2, "o": [["It has striations", "Skeletal and cardiac."], ["It has T tubules", "Skeletal and cardiac."], ["It lacks troponin and uses calmodulin for calcium regulation", "Correct. ⚠ Your source answer was 'caveolae'."], ["It has sarcomeres", "Skeletal and cardiac."], ["It has intercalated discs", "Cardiac."]]}, {"s": "What happens during a tetanic contraction?", "sub": "Physiology", "lec": "Types of muscle contractions & length tension relationship", "per": "Before", "hy": 0, "c": 0, "o": [["Intracellular calcium accumulates, sustaining cross-bridge cycling", "Correct."], ["Calcium is fully cleared between stimuli", "Twitch pattern."], ["Action potential frequency falls", "Opposite."], ["Troponin is inhibited", "Causes relaxation."], ["SERCA activity increases", "Causes relaxation."]]}, {"s": "An 18-year-old has fatigable weakness and ptosis worse at day's end, with antibodies against a neuromuscular junction receptor. Which receptor is affected?", "sub": "Physiology", "lec": "Neuromuscular and synaptic transmission", "per": "Before", "hy": 0, "c": 1, "o": [["Muscarinic M1 receptor", "Not the target."], ["Nicotinic acetylcholine receptor (Nm)", "Correct: myasthenia gravis."], ["Voltage-gated calcium channel", "Lambert-Eaton syndrome."], ["Ryanodine receptor", "Malignant hyperthermia."], ["Dystrophin-glycoprotein complex", "Muscular dystrophy."]]}, {"s": "A hand dynamometer used to test a patient with progressive proximal weakness measures what type of contraction?", "sub": "Physiology", "lec": "Types of muscle contractions & length tension relationship", "per": "Before", "hy": 0, "c": 0, "o": [["Isometric", "Correct: tension without a change in length."], ["Isotonic concentric", "Shortening against a load."], ["Isotonic eccentric", "Lengthening under load."], ["Auxotonic", "Variable load."], ["Isokinetic", "Constant velocity."]]}, {"s": "Which statement about the length-tension relationship is INCORRECT?", "sub": "Physiology", "lec": "Length tension and force relationship in muscle", "per": "Before", "hy": 0, "c": 1, "o": [["Passive tension increases as the muscle is stretched", "True."], ["Active tension is maximal when the muscle is stretched to its maximum length", "Correct (incorrect statement): overlap is lost."], ["Active tension is maximal at optimal sarcomere length", "True."], ["Total tension is the sum of active and passive tension", "True."], ["At very long lengths active tension falls due to reduced filament overlap", "True."]]}, {"s": "Which statement about excitation-contraction coupling is INCORRECT?", "sub": "Physiology", "lec": "Excitation–contraction coupling in skeletal muscle", "per": "Before", "hy": 0, "c": 0, "o": [["The action potential is transmitted through L tubules", "Correct (incorrect statement): T tubules, not L tubules."], ["The action potential spreads through T tubules", "True."], ["The DHP receptor acts as a voltage sensor", "True."], ["The ryanodine receptor releases calcium from the SR", "True."], ["Calcium binds troponin C", "True."]]}, {"s": "What does an acetylcholinesterase blocker cause?", "sub": "Physiology", "lec": "Neuromuscular and synaptic transmission", "per": "Before", "hy": 0, "c": 2, "o": [["Blockade of the Nm receptor", "Neuromuscular blockers."], ["Decreased acetylcholine release", "Not the mechanism."], ["Increased stimulation of the post-synaptic membrane", "Correct: acetylcholine persists in the cleft."], ["Decreased acetylcholine at the synapse", "Opposite effect."], ["Increased breakdown of acetylcholine", "Opposite effect."]]}, {"s": "A farmer works in his garden on a hot summer day. What is his body's response to this temperature?", "sub": "Physiology", "lec": "Lecture unsure", "per": "Unsure", "hy": 1, "c": 0, "o": [["Skin vessel vasodilation", "Correct: heat loss through increased skin blood flow."], ["Skin vessel vasoconstriction", "Conserves heat."], ["Shivering", "Generates heat."], ["Piloerection", "Traps heat."], ["Reduced sweating", "Opposite of the response."]]}, {"s": "Which of the following is likely to develop at the onset of fever?", "sub": "Physiology", "lec": "Lecture unsure", "per": "Unsure", "hy": 1, "c": 0, "o": [["Skin vasoconstriction", "Correct: the hypothalamic set point rises, so heat is conserved (chills)."], ["Feeling hot", "Occurs when the fever breaks."], ["Sweating", "Occurs when the fever breaks."], ["Reduced rate of metabolism", "Metabolism rises."], ["Convulsions", "Not a typical onset response."]]}, {"s": "What is the body's response to hot weather?", "sub": "Physiology", "lec": "Lecture unsure", "per": "Unsure", "hy": 1, "c": 0, "o": [["Sweating", "Correct: evaporative heat loss."], ["Shivering", "Cold response."], ["Skin vasoconstriction", "Cold response."], ["Piloerection", "Cold response."], ["Increased thyroid hormone secretion", "Cold response."]]}];
const L="ABCDE";const LECT=["Electrophysiology of the muscle", "Types and properties of muscles", "Neuromuscular and synaptic transmission", "Molecular Basis of muscle contraction", "Excitation–contraction coupling in skeletal muscle", "Length tension and force relationship in muscle", "Types of muscle contractions & length tension relationship", "Electromyography"];function ov(){const c={};D.forEach(q=>c[q.lec]=(c[q.lec]||0)+1);document.getElementById("ov").innerHTML='<details open><summary>'+D.length+' questions: lecture breakdown</summary>'+LECT.concat(Object.keys(c).filter(k=>!LECT.includes(k))).map(l=>'<div class="br"><span>'+l+'</span><span class="'+(c[l]?'':'zero')+'">'+(c[l]||"0, not covered yet")+'</span></div>').join('')+'</details>'}
let A=[];
function init(){A=Array(D.length).fill(null);const w=document.getElementById("qs");w.innerHTML="";ov();
D.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.id="q"+i;
d.innerHTML='<div class="qn">Question '+(i+1)+(q.hy?'<span class="hy">★ HIGH YIELD</span>':'')+'</div><div class="lec">'+q.lec+'</div><div class="qt">'+q.s+'</div>'+q.o.map((o,j)=>'<button class="o" data-i="'+i+'" data-j="'+j+'"><b>'+L[j]+'</b>'+o[0]+'<small>'+o[1]+'</small></button>').join('')+'<div class="tags"><span>'+q.sub+'</span><span>'+(q.per=="Unsure"?"Midterm unsure":q.per+" Midterm")+'</span></div>';w.appendChild(d)});
document.getElementById("score").style.display="none";upd()}
function upd(){const n=A.filter(a=>a!=null).length;document.getElementById("cnt").textContent=n+" / "+D.length+" answered";document.getElementById("pb").style.width=(100*n/D.length)+"%"}
document.addEventListener("click",e=>{const b=e.target.closest(".o");if(!b)return;const i=+b.dataset.i,j=+b.dataset.j;if(A[i]!=null)return;A[i]=j;
const c=document.getElementById("q"+i);c.classList.add("done");const bs=c.querySelectorAll(".o");bs[D[i].c].classList.add("ok");if(j!==D[i].c)bs[j].classList.add("no");upd();if(A.every(a=>a!=null))fin()});
function grp(k){const m={};D.forEach((q,i)=>{const key=k=="per"?(q.per=="Unsure"?"Midterm unsure":q.per+" Midterm"):q[k];m[key]=m[key]||[0,0];m[key][1]++;if(A[i]===q.c)m[key][0]++});
return Object.entries(m).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]).map(([n,v])=>{const p=Math.round(100*v[0]/v[1]);return '<div class="br"><span>'+n+' ('+v[0]+'/'+v[1]+')</span><span><span class="g">'+p+'% right</span> · <span class="r">'+(100-p)+'% wrong</span></span></div>'}).join('')}
function fin(){const s=D.filter((q,i)=>A[i]===q.c).length,p=Math.round(100*s/D.length);
const v=p>=85?"Excellent. You're exam-ready on this set.":p>=70?"Solid. Review the weak tags below.":p>=50?"Getting there. Focus on the weakest lectures first.":"Needs work. Revisit the lectures listed at the top below.";
const e=document.getElementById("score");e.style.display="block";e.innerHTML='<h2>Final score</h2><div class="big">'+s+' / '+D.length+' · '+p+'%</div><div>'+v+'</div><div class="bk"><h3>By lecture (weakest first)</h3>'+grp("lec")+'<h3>Before vs after midterm</h3>'+grp("per")+'</div>';e.scrollIntoView({behavior:"smooth"})}
document.getElementById("rs").onclick=()=>{init();window.scrollTo({top:0,behavior:"smooth"})};
init();
</script></body></html>
