<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>MSK Microbiology Exam</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#5d6773;--bd:#d9dee5;--ac:#3b5bdb;--gb:#e3f6e8;--gt:#1c7a3a;--rb:#fde6e6;--rt:#b3261e;--tag:#eef1f6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1216;--card:#181c22;--tx:#e8ebef;--mu:#9aa5b1;--bd:#2c333c;--ac:#8ea2ff;--gb:#12301c;--gt:#6fdc92;--rb:#3a1717;--rt:#ff9a93;--tag:#232a33}}
:root[data-theme="dark"]{--bg:#0f1216;--card:#181c22;--tx:#e8ebef;--mu:#9aa5b1;--bd:#2c333c;--ac:#8ea2ff;--gb:#12301c;--gt:#6fdc92;--rb:#3a1717;--rt:#ff9a93;--tag:#232a33}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:720px;margin:0 auto}
.t{font-weight:700}.cnt{color:var(--mu);font-size:14px}
button.reset{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer}
.bar{max-width:720px;margin:8px auto 0;height:6px;background:var(--tag);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .25s}
main{max-width:720px;margin:0 auto;padding:14px}
.q{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.qn{color:var(--mu);font-size:13px;margin-bottom:4px}.hy{background:#ffd43b;color:#5c4400;border-radius:6px;padding:1px 7px;font-weight:700;font-size:12px;margin-left:6px}
.qt{font-weight:600;margin-bottom:10px}
.o{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px;font:inherit;cursor:pointer}
.o b{display:inline-block;width:22px;color:var(--mu)}.o small{display:none;margin-top:4px;font-size:13px;color:var(--mu)}
.done .o{cursor:default}.done .o small{display:block}
.o.ok{background:var(--gb);border-color:var(--gt)}.o.ok small,.o.ok b{color:var(--gt)}
.o.no{background:var(--rb);border-color:var(--rt)}.o.no small,.o.no b{color:var(--rt)}
.tags{display:none;flex-wrap:wrap;gap:6px;margin-top:6px}.done .tags{display:flex}
.tags span{background:var(--tag);color:var(--mu);border-radius:999px;padding:2px 9px;font-size:12px}
#score{display:none;background:var(--card);border:2px solid var(--ac);border-radius:14px;padding:16px}
#score h2{margin:0 0 4px}.big{font-size:34px;font-weight:800}
.bk{margin-top:12px}.bk h3{margin:14px 0 6px;font-size:15px}
.br{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--bd)}
.br span:last-child{white-space:nowrap}.g{color:var(--gt)}.r{color:var(--rt)}
.lec{font-weight:600;color:var(--ac);font-size:13px;margin-bottom:6px}#ov{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:14px}#ov summary{font-weight:700;cursor:pointer}.zero{color:var(--rt)}</style></head><body>
<header><div class="row"><span class="t">MSK Microbiology Exam</span><span class="cnt" id="cnt">0 / 0 answered</span><button class="reset" id="rs">Reset</button></div><div class="bar"><i id="pb"></i></div></header>
<main><div id="ov"></div><div id="qs"></div><div id="score"></div></main>
<script>
const D=[{"s": "Some bacteria survive harsh conditions through spore formation. Which compound is responsible?", "sub": "Microbiology", "lec": "Lecture unsure", "per": "Unsure", "hy": 0, "c": 2, "o": [["Peptidoglycan", "Present in all cell walls."], ["Teichoic acid", "Gram-positive wall component."], ["Calcium dipicolinate", "Correct: stabilizes spore proteins and DNA."], ["Lipopolysaccharide", "Gram-negative outer membrane."], ["Mycolic acid", "Mycobacterial wall."]]}, {"s": "Which medium is used for fungal examination?", "sub": "Microbiology", "lec": "Superficial and cutaneous fungal infections", "per": "After", "hy": 0, "c": 4, "o": [["MacConkey agar", "Selective for Gram-negative enteric bacteria."], ["Blood agar", "General bacterial medium."], ["Chocolate agar", "For Haemophilus and Neisseria."], ["Lowenstein-Jensen medium", "For mycobacteria."], ["Sabouraud dextrose agar", "Correct."]]}, {"s": "A breastfeeding woman has acute mastitis. Aspirate culture shows Gram-positive cocci in clusters, golden colonies, and a positive coagulase test. Most likely cause?", "sub": "Microbiology", "lec": "Breast infections", "per": "After", "hy": 1, "c": 0, "o": [["Staphylococcus aureus", "Correct: coagulase positive."], ["Staphylococcus epidermidis", "Coagulase negative."], ["Streptococcus pyogenes", "Cocci in chains, catalase negative."], ["Streptococcus agalactiae", "Cocci in chains."], ["Escherichia coli", "Gram-negative rod."]]}, {"s": "Which statement about bacterial skin and soft tissue infections is NOT true?", "sub": "Microbiology", "lec": "Soft Tissue Infections", "per": "After", "hy": 0, "c": 2, "o": [["Staphylococcus aureus is coagulase positive.", "True."], ["Streptococcus pyogenes causes erysipelas.", "True."], ["The causative agent of Rocky Mountain spotted fever can be cultured on blood agar.", "Correct (false statement): Rickettsia are obligate intracellular."], ["Pseudomonas aeruginosa produces pyocyanin.", "True."], ["Clostridium perfringens causes gas gangrene.", "True."]]}, {"s": "A sexually active 23-year-old woman has inflammation of several joints with tenosynovitis. What is the causative agent?", "sub": "Microbiology", "lec": "Septic Arthritis", "per": "Before", "hy": 1, "c": 0, "o": [["Neisseria gonorrhoeae", "Correct: disseminated gonococcal infection."], ["Staphylococcus aureus", "Usually a single joint."], ["Borrelia burgdorferi", "Lyme disease."], ["Salmonella spp.", "Sickle cell or reactive."], ["Pseudomonas aeruginosa", "IV drug use."]]}, {"s": "An old man has vertebral osteomyelitis. What is the most common route of infection in this case?", "sub": "Microbiology", "lec": "Osteomyelitis", "per": "Before", "hy": 0, "c": 1, "o": [["Direct inoculation", "Surgery or trauma."], ["Spread through Batson's venous plexus, which lacks valves", "Correct per your source. ⚠ Arterial seeding is also common; I left it out."], ["Contiguous spread", "Less common."], ["Lymphatic spread", "Rare."], ["Inhalation", "Not a route."]]}, {"s": "A boy develops a gluteal abscess after an intramuscular injection; the pus is thick, white, with fibrin. What characterizes the organism?", "sub": "Microbiology", "lec": "Soft Tissue Infections", "per": "After", "hy": 0, "c": 2, "o": [["Coagulase negative, novobiocin resistant", "S. saprophyticus."], ["Catalase negative with beta hemolysis", "Streptococcus."], ["Coagulase positive and ferments mannitol on mannitol salt agar", "Correct: S. aureus."], ["Oxidase-positive Gram-negative rod", "Pseudomonas."], ["Lactose fermenter on MacConkey agar", "E. coli."]]}, {"s": "A boy has numerous white, non-itchy lesions on the shoulders and upper back; microscopy shows a spaghetti and meatball appearance. What is the infection?", "sub": "Microbiology", "lec": "Superficial and cutaneous fungal infections", "per": "After", "hy": 1, "c": 3, "o": [["Tinea corporis", "Itchy ring with hyphae."], ["Candidiasis", "Pseudohyphae and yeast."], ["Erythrasma", "Bacterial, coral-red fluorescence."], ["Tinea versicolor", "Correct: Malassezia."], ["Scabies", "Mites."]]}, {"s": "A man has reactivation of a prior viral infection, with painful vesicles confined to one dermatome. What was the previous infection?", "sub": "Microbiology", "lec": "Herpes virus infections", "per": "After", "hy": 0, "c": 0, "o": [["Varicella zoster virus", "Correct: shingles."], ["HSV-1", "Recurrent labialis."], ["HSV-2", "Genital recurrences."], ["EBV", "Mononucleosis."], ["CMV", "Disease in immunocompromised."]]}, {"s": "A farmer pricked by rusty metal develops lockjaw, neck stiffness and difficulty swallowing. Which organism?", "sub": "Microbiology", "lec": "Tetanus", "per": "After", "hy": 1, "c": 4, "o": [["Clostridium perfringens", "Gas gangrene."], ["Clostridium botulinum", "Flaccid paralysis."], ["Clostridium difficile", "Colitis."], ["Bacillus anthracis", "Anthrax."], ["Clostridium tetani", "Correct."]]}, {"s": "A man's thigh injury turns purplish with subcutaneous gas and foul-smelling pus. Which organism is most likely?", "sub": "Microbiology", "lec": "Soft Tissue Infections", "per": "After", "hy": 1, "c": 2, "o": [["Clostridium tetani", "Tetanus, no gas gangrene."], ["Staphylococcus aureus", "Pus, no gas."], ["Clostridium perfringens", "Correct: gas gangrene."], ["Streptococcus pyogenes", "Cellulitis, necrotizing fasciitis."], ["Pseudomonas aeruginosa", "Green pigment, wounds."]]}, {"s": "A mother brings a feverish baby with Koplik spots. Which virus is responsible?", "sub": "Microbiology", "lec": "Clinical viral infections affecting skin", "per": "Before", "hy": 1, "c": 0, "o": [["Measles virus", "Correct."], ["Rubella virus", "Mild rash and lymphadenopathy."], ["Varicella zoster virus", "Vesicular rash."], ["Parvovirus B19", "Slapped cheek."], ["HHV-6", "Roseola."]]}, {"s": "Ringworm lesions are present on the trunk. What is the diagnosis?", "sub": "Microbiology", "lec": "Superficial and cutaneous fungal infections", "per": "After", "hy": 0, "c": 1, "o": [["Tinea capitis", "Scalp."], ["Tinea corporis", "Correct."], ["Tinea pedis", "Feet."], ["Tinea cruris", "Groin."], ["Tinea versicolor", "Malassezia, hypopigmented macules."]]}, {"s": "Which toxin of Clostridium tetani blocks the release of inhibitory neurotransmitters in the spinal cord?", "sub": "Microbiology", "lec": "Tetanus", "per": "After", "hy": 1, "c": 3, "o": [["Botulinum toxin", "C. botulinum, blocks acetylcholine release."], ["Alpha toxin (lecithinase)", "C. perfringens."], ["Enterotoxin", "Causes diarrhea."], ["Tetanospasmin", "Correct."], ["Tetanolysin", "Hemolysin, not the neurotoxin."]]}, {"s": "Which organism most commonly causes mastitis?", "sub": "Microbiology", "lec": "Breast infections", "per": "After", "hy": 1, "c": 2, "o": [["Escherichia coli", "Uncommon."], ["Streptococcus pneumoniae", "Uncommon."], ["Staphylococcus aureus", "Correct."], ["Candida albicans", "Nipple thrush."], ["Pseudomonas aeruginosa", "Rare."]]}, {"s": "Osteomyelitis in adults usually involves which site?", "sub": "Microbiology", "lec": "Osteomyelitis", "per": "Before", "hy": 0, "c": 0, "o": [["Vertebral bodies", "Correct."], ["Metaphysis of long bones", "Typical in children."], ["Epiphysis", "Uncommon."], ["Skull", "Rare."], ["Ribs", "Rare."]]}, {"s": "Which combination of statements about tetanus is NOT correct? (1) Tetanolysin causes tetanus. (2) Opisthotonus is spasm of the neck, back and spine. (3) Synaptobrevin is activated by tetanus toxin. (4) Neonatal tetanus mortality is high due to low immunity. (5) Anti-tetanus serum provides active immunity.", "sub": "Microbiology", "lec": "Tetanus", "per": "After", "hy": 0, "c": 2, "o": [["2, 3 and 4", "2 and 4 are true."], ["3, 4 and 5", "4 is true."], ["1, 3 and 5", "Correct: the toxin is tetanospasmin, it cleaves synaptobrevin, and antiserum gives passive immunity. ⚠ Source wrote 'synaptoversion'."], ["1, 2 and 5", "2 is true."], ["2 and 5", "2 is true and 1, 3 are also false."]]}, {"s": "Which statement about bacterial skin and soft tissue infections is NOT true?", "sub": "Microbiology", "lec": "Soft Tissue Infections", "per": "After", "hy": 0, "c": 0, "o": [["Streptococcal gangrene is called type I necrotizing fasciitis", "Correct (false statement): it is type II."], ["Pasteurella and staphylococci are linked to dog and cat bites", "True."], ["HA-MRSA is more resistant than CA-MRSA", "True."], ["Borrelia burgdorferi causes Lyme disease", "True."], ["Hyaluronidase is a virulence factor of S. pyogenes", "True."]]}, {"s": "A 24-year-old with foot sweating who wears shoes all day has ringworm-like plantar and interdigital lesions; a KOH mount shows septate hyphae with pencil-shaped macroconidia and teardrop microconidia. What is the infection and cause?", "sub": "Microbiology", "lec": "Superficial and cutaneous fungal infections", "per": "After", "hy": 0, "c": 1, "o": [["Tinea versicolor, Malassezia furfur", "Trunk, spaghetti and meatballs."], ["Tinea pedis, Trichophyton rubrum", "Correct: athlete's foot."], ["Onychomycosis, Trichophyton rubrum", "Involves the nail."], ["Opportunistic mycosis, Candida albicans", "Pseudohyphae."], ["Piedra, Trichosporon", "Hair shaft nodules."]]}, {"s": "Which statement about skin viral infections is NOT true?", "sub": "Microbiology", "lec": "Clinical viral infections affecting skin", "per": "Before", "hy": 0, "c": 0, "o": [["The primary lesion of molluscum contagiosum is a vesicle", "Correct (false statement): it is a pearly umbilicated papule."], ["VZV causes chickenpox", "True."], ["Warts are caused by human papillomavirus", "True."], ["HHV-6 causes roseola infantum", "True."], ["Cold sores are associated with herpes simplex virus", "True."]]}, {"s": "A woman has breast inflammation with granulomatous inflammation on biopsy. Which organism is the cause?", "sub": "Microbiology", "lec": "Breast infections", "per": "After", "hy": 0, "c": 0, "o": [["Mycobacterium tuberculosis", "Correct: caseating granulomas."], ["Staphylococcus aureus", "Acute suppurative mastitis."], ["Streptococcus pyogenes", "Acute infection."], ["Escherichia coli", "Not granulomatous."], ["Candida albicans", "Nipple thrush."]]}, {"s": "Which statement about viral skin infections is INCORRECT?", "sub": "Microbiology", "lec": "Clinical viral infections affecting skin", "per": "Before", "hy": 0, "c": 2, "o": [["VZV causes chickenpox", "True."], ["HSV-1 causes cold sores", "True."], ["EBV causes in utero neonatal thrombocytopenic purpura", "Correct (incorrect statement): not an EBV effect."], ["HPV causes warts", "True."], ["Molluscum contagiosum is caused by a poxvirus", "True."]]}, {"s": "A woman develops Majocchi granuloma on a shaved leg. Which fungus is the usual cause?", "sub": "Microbiology", "lec": "Superficial and cutaneous fungal infections", "per": "After", "hy": 1, "c": 1, "o": [["Microsporum canis", "Tinea capitis and corporis."], ["Trichophyton rubrum", "Correct: follicular invasion after shaving."], ["Epidermophyton floccosum", "Tinea cruris and pedis."], ["Malassezia furfur", "Pityriasis versicolor."], ["Candida albicans", "Yeast infection."]]}, {"s": "Which is part of the management of an established tetanus patient?", "sub": "Microbiology", "lec": "Tetanus", "per": "After", "hy": 1, "c": 3, "o": [["Antibiotic alone", "Does not neutralize toxin."], ["Observation", "Unsafe."], ["Hydration alone", "Insufficient."], ["Human tetanus immunoglobulin", "Correct: neutralizes circulating toxin."], ["Tetanus toxoid only", "Does not neutralize toxin."]]}, {"s": "A child with sickle cell anemia develops osteomyelitis. Which organism is classically responsible?", "sub": "Microbiology", "lec": "Osteomyelitis", "per": "Before", "hy": 1, "c": 0, "o": [["Salmonella spp.", "Correct: classic sickle cell association."], ["Pseudomonas aeruginosa", "Puncture wounds."], ["Escherichia coli", "Neonates."], ["Group B Streptococcus", "Neonates."], ["Haemophilus influenzae type b", "Rare after vaccination."]]}, {"s": "How does Staphylococcus aureus stimulate osteoclastogenesis in osteomyelitis?", "sub": "Microbiology", "lec": "Osteomyelitis", "per": "Before", "hy": 0, "c": 2, "o": [["Stimulates osteoblasts to form bone", "Opposite effect."], ["Converts neutrophils to osteoclasts", "Osteoclasts derive from monocytes."], ["Monocytes and macrophages become osteoclasts through RANKL-RANK binding", "Correct."], ["Directly lyses osteocytes", "Not the mechanism."], ["Inhibits all cytokine release", "Not the mechanism."]]}, {"s": "Septic arthritis yields Gram-positive cocci that are coagulase positive and methicillin resistant. Which organism?", "sub": "Microbiology", "lec": "Septic Arthritis", "per": "Before", "hy": 0, "c": 3, "o": [["Staphylococcus saprophyticus", "Coagulase negative."], ["Streptococcus pyogenes", "Chains."], ["MSSA", "Methicillin sensitive."], ["Methicillin-resistant Staphylococcus aureus", "Correct."], ["Staphylococcus epidermidis", "Coagulase negative."]]}];
const L="ABCDE";const LECT=["Overview of Infectious, Immunologic, and Inflammatory Disorders of Musculoskeletal Infections", "Osteomyelitis", "Septic Arthritis", "Clinical viral infections affecting skin", "Soft Tissue Infections", "Superficial and cutaneous fungal infections", "Tetanus", "Herpes virus infections", "Breast infections"];function ov(){const c={};D.forEach(q=>c[q.lec]=(c[q.lec]||0)+1);document.getElementById("ov").innerHTML='<details open><summary>'+D.length+' questions: lecture breakdown</summary>'+LECT.concat(Object.keys(c).filter(k=>!LECT.includes(k))).map(l=>'<div class="br"><span>'+l+'</span><span class="'+(c[l]?'':'zero')+'">'+(c[l]||"0, not covered yet")+'</span></div>').join('')+'</details>'}
let A=[];
function init(){A=Array(D.length).fill(null);const w=document.getElementById("qs");w.innerHTML="";ov();
D.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.id="q"+i;
d.innerHTML='<div class="qn">Question '+(i+1)+(q.hy?'<span class="hy">★ HIGH YIELD</span>':'')+'</div><div class="lec">'+q.lec+'</div><div class="qt">'+q.s+'</div>'+q.o.map((o,j)=>'<button class="o" data-i="'+i+'" data-j="'+j+'"><b>'+L[j]+'</b>'+o[0]+'<small>'+o[1]+'</small></button>').join('')+'<div class="tags"><span>'+q.sub+'</span><span>'+(q.per=="Unsure"?"Midterm unsure":q.per+" Midterm")+'</span></div>';w.appendChild(d)});
document.getElementById("score").style.display="none";upd()}
function upd(){const n=A.filter(a=>a!=null).length;document.getElementById("cnt").textContent=n+" / "+D.length+" answered";document.getElementById("pb").style.width=(100*n/D.length)+"%"}
document.addEventListener("click",e=>{const b=e.target.closest(".o");if(!b)return;const i=+b.dataset.i,j=+b.dataset.j;if(A[i]!=null)return;A[i]=j;
const c=document.getElementById("q"+i);c.classList.add("done");const bs=c.querySelectorAll(".o");bs[D[i].c].classList.add("ok");if(j!==D[i].c)bs[j].classList.add("no");upd();if(A.every(a=>a!=null))fin()});
function grp(k){const m={};D.forEach((q,i)=>{const key=k=="per"?(q.per=="Unsure"?"Midterm unsure":q.per+" Midterm"):q[k];m[key]=m[key]||[0,0];m[key][1]++;if(A[i]===q.c)m[key][0]++});
return Object.entries(m).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]).map(([n,v])=>{const p=Math.round(100*v[0]/v[1]);return '<div class="br"><span>'+n+' ('+v[0]+'/'+v[1]+')</span><span><span class="g">'+p+'% right</span> · <span class="r">'+(100-p)+'% wrong</span></span></div>'}).join('')}
function fin(){const s=D.filter((q,i)=>A[i]===q.c).length,p=Math.round(100*s/D.length);
const v=p>=85?"Excellent. You're exam-ready on this set.":p>=70?"Solid. Review the weak tags below.":p>=50?"Getting there. Focus on the weakest lectures first.":"Needs work. Revisit the lectures listed at the top below.";
const e=document.getElementById("score");e.style.display="block";e.innerHTML='<h2>Final score</h2><div class="big">'+s+' / '+D.length+' · '+p+'%</div><div>'+v+'</div><div class="bk"><h3>By lecture (weakest first)</h3>'+grp("lec")+'<h3>Before vs after midterm</h3>'+grp("per")+'</div>';e.scrollIntoView({behavior:"smooth"})}
document.getElementById("rs").onclick=()=>{init();window.scrollTo({top:0,behavior:"smooth"})};
init();
</script></body></html>
