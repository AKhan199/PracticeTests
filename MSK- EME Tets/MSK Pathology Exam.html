<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>MSK Pathology Exam</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#5d6773;--bd:#d9dee5;--ac:#3b5bdb;--gb:#e3f6e8;--gt:#1c7a3a;--rb:#fde6e6;--rt:#b3261e;--tag:#eef1f6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1216;--card:#181c22;--tx:#e8ebef;--mu:#9aa5b1;--bd:#2c333c;--ac:#8ea2ff;--gb:#12301c;--gt:#6fdc92;--rb:#3a1717;--rt:#ff9a93;--tag:#232a33}}
:root[data-theme="dark"]{--bg:#0f1216;--card:#181c22;--tx:#e8ebef;--mu:#9aa5b1;--bd:#2c333c;--ac:#8ea2ff;--gb:#12301c;--gt:#6fdc92;--rb:#3a1717;--rt:#ff9a93;--tag:#232a33}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:720px;margin:0 auto}
.t{font-weight:700}.cnt{color:var(--mu);font-size:14px}
button.reset{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer}
.bar{max-width:720px;margin:8px auto 0;height:6px;background:var(--tag);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .25s}
main{max-width:720px;margin:0 auto;padding:14px}
.q{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.qn{color:var(--mu);font-size:13px;margin-bottom:4px}.hy{background:#ffd43b;color:#5c4400;border-radius:6px;padding:1px 7px;font-weight:700;font-size:12px;margin-left:6px}
.qt{font-weight:600;margin-bottom:10px}
.o{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px;font:inherit;cursor:pointer}
.o b{display:inline-block;width:22px;color:var(--mu)}.o small{display:none;margin-top:4px;font-size:13px;color:var(--mu)}
.done .o{cursor:default}.done .o small{display:block}
.o.ok{background:var(--gb);border-color:var(--gt)}.o.ok small,.o.ok b{color:var(--gt)}
.o.no{background:var(--rb);border-color:var(--rt)}.o.no small,.o.no b{color:var(--rt)}
.tags{display:none;flex-wrap:wrap;gap:6px;margin-top:6px}.done .tags{display:flex}
.tags span{background:var(--tag);color:var(--mu);border-radius:999px;padding:2px 9px;font-size:12px}
#score{display:none;background:var(--card);border:2px solid var(--ac);border-radius:14px;padding:16px}
#score h2{margin:0 0 4px}.big{font-size:34px;font-weight:800}
.bk{margin-top:12px}.bk h3{margin:14px 0 6px;font-size:15px}
.br{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--bd)}
.br span:last-child{white-space:nowrap}.g{color:var(--gt)}.r{color:var(--rt)}
.lec{font-weight:600;color:var(--ac);font-size:13px;margin-bottom:6px}#ov{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:14px}#ov summary{font-weight:700;cursor:pointer}.zero{color:var(--rt)}</style></head><body>

<script>
const D=[{"s": "A 22-year-old woman has a firm, rubbery, mobile, well-circumscribed breast mass; the cut surface is grey-white with slit-like spaces. Most likely diagnosis?", "sub": "Pathology", "lec": "Benign lesions of the breast", "per": "After", "hy": 1, "c": 0, "o": [["Fibroadenoma", "Correct: benign biphasic tumor of young women."], ["Phyllodes tumor", "Larger, leaf-like architecture."], ["Fat necrosis", "Follows trauma."], ["Intraductal papilloma", "Nipple discharge."], ["Invasive ductal carcinoma", "Hard, irregular mass."]]}, {"s": "An elevated, flat-topped skin lesion 6 mm in diameter is termed?", "sub": "Pathology", "lec": "Benign Skin conditions", "per": "After", "hy": 1, "c": 2, "o": [["Papule", "Elevated lesion under 5 mm."], ["Nodule", "Rounded and deeper, not flat-topped."], ["Plaque", "Correct: elevated flat-topped, over 5 mm. ⚠ Your source said nodule."], ["Macule", "Flat, not palpable."], ["Vesicle", "Fluid-filled."]]}, {"s": "The RAS-BRAF pathway is implicated in which neoplasm?", "sub": "Pathology", "lec": "Skin tumors", "per": "After", "hy": 1, "c": 0, "o": [["Malignant melanoma", "Correct: BRAF V600E is common."], ["Basal cell carcinoma", "Hedgehog pathway."], ["Squamous cell carcinoma", "UV-induced p53 mutation."], ["Merkel cell carcinoma", "Polyomavirus."], ["Kaposi sarcoma", "HHV-8."]]}, {"s": "Which is NOT significant in assessing the probability of metastasis in melanoma?", "sub": "Pathology", "lec": "Skin tumors", "per": "After", "hy": 1, "c": 3, "o": [["Breslow thickness", "Key prognostic factor."], ["Ulceration", "Poor prognostic sign."], ["Mitotic rate", "Higher means worse."], ["Number of benign moles elsewhere on the body", "Correct: not a prognostic factor for this tumor."], ["Regional lymph node status", "Strong prognostic factor."]]}, {"s": "A man has a painless, soft, well-circumscribed lump above the iliac crest with a yellow cut surface (lipoma). What is the prognosis?", "sub": "Pathology", "lec": "Soft tissue tumors", "per": "After", "hy": 0, "c": 0, "o": [["Benign, rarely recurs after excision", "Correct. ⚠ Source says 'will not recur'; recurrence is rare, not impossible."], ["Frequent malignant transformation", "Not typical."], ["Metastasis to the lungs", "Not a lipoma feature."], ["Aggressive local recurrence", "Fibromatosis behavior."], ["Requires chemotherapy", "Not required."]]}, {"s": "A 30-year-old has erythematous plaques with adherent silvery scales and Auspitz sign. Biopsy shows accumulation of which cell in the epidermis?", "sub": "Pathology", "lec": "Benign Skin conditions", "per": "After", "hy": 1, "c": 1, "o": [["Eosinophils", "Seen in allergic reactions."], ["Neutrophils", "Correct: Munro microabscesses in psoriasis."], ["Mast cells", "Not the characteristic cell."], ["Plasma cells", "Not characteristic."], ["Melanocytes", "Pigment cells."]]}, {"s": "A young woman has had dry eyes and mouth for 2 years. Which is the most serious complication of this condition?", "sub": "Pathology", "lec": "Connective tissue disorders", "per": "Before", "hy": 1, "c": 0, "o": [["B-cell lymphoma", "Correct: monoclonal B-cell proliferation in Sjogren syndrome. ⚠ Source wording was garbled ('monoclonal B-antibodies')."], ["Dental caries", "Common but not serious."], ["Keratoconjunctivitis sicca", "The presenting feature."], ["Parotid enlargement", "Usually benign."], ["Raynaud phenomenon", "A common, milder feature."]]}, {"s": "A 5-year-old boy has muscular dystrophy. How does absent dystrophin cause muscle wasting?", "sub": "Pathology", "lec": "Muscular dystrophy", "per": "Before", "hy": 0, "c": 1, "o": [["Blockade of acetylcholine receptors", "Myasthenia gravis."], ["Loss of structural integrity of the muscle membrane", "Correct: the sarcolemma tears with contraction."], ["Failure of calcium release", "Malignant hyperthermia."], ["Defective glycogen breakdown", "McArdle disease."], ["Mitochondrial failure", "Mitochondrial myopathy."]]}, {"s": "A man has severe pain in one joint with crepitus and eburnation of the underlying bone. What is the cause?", "sub": "Pathology", "lec": "Etiopathogenesis of Arthritis", "per": "Before", "hy": 0, "c": 2, "o": [["Autoimmune synovitis", "Rheumatoid arthritis."], ["Urate crystal deposition", "Gout."], ["Wear and tear of articular cartilage", "Correct: osteoarthritis."], ["Bacterial infection", "Septic arthritis."], ["Immune complex deposition", "SLE."]]}, {"s": "A mushroom-shaped bony outgrowth with a cartilage cap arises from the metaphysis near the growth plate. What is it?", "sub": "Pathology", "lec": "Bone tumors", "per": "Before", "hy": 0, "c": 0, "o": [["Osteochondroma", "Correct: the most common benign bone tumor."], ["Osteosarcoma", "Sunburst pattern."], ["Ewing sarcoma", "Onion-skin pattern."], ["Giant cell tumor", "Epiphyseal, soap-bubble."], ["Enchondroma", "Within the medullary cavity."]]}, {"s": "A bone tumor shows an onion-peel appearance on X-ray and small round cells on histology. What is it?", "sub": "Pathology", "lec": "Bone tumors", "per": "Before", "hy": 1, "c": 3, "o": [["Osteosarcoma", "Sunburst and Codman triangle."], ["Chondrosarcoma", "Cartilage matrix."], ["Giant cell tumor", "Multinucleated giant cells."], ["Ewing sarcoma", "Correct: t(11;22), small round blue cells."], ["Osteoid osteoma", "Small, nocturnal pain."]]}, {"s": "An 8-year-old with a greenstick fracture is in a cast for 3 weeks. What happens in the bone during remodeling?", "sub": "Pathology", "lec": "Bone fracture and healing", "per": "Before", "hy": 0, "c": 4, "o": [["Hematoma formation", "First phase."], ["Granulation tissue formation", "Early phase."], ["Soft callus formation", "Fibrocartilage phase."], ["Hard callus of woven bone", "Precedes remodeling."], ["Replacement of woven bone by compact lamellar bone", "Correct."]]}, {"s": "A 30-year-old woman is hit in the breast playing soccer; 2 weeks later she has a firm mass. What is the cause?", "sub": "Pathology", "lec": "Benign lesions of the breast", "per": "After", "hy": 1, "c": 1, "o": [["Fibroadenoma", "Not trauma related."], ["Fat necrosis", "Correct: traumatic fat injury with fibrosis."], ["Phyllodes tumor", "Large stromal tumor."], ["Invasive ductal carcinoma", "Not the likeliest cause."], ["Intraductal papilloma", "Nipple discharge."]]}, {"s": "A woman has masses in both breasts arising at different foci. What is this?", "sub": "Pathology", "lec": "Breast Cancer", "per": "After", "hy": 0, "c": 2, "o": [["Invasive ductal carcinoma", "Usually unifocal."], ["Medullary carcinoma", "Well-circumscribed."], ["Infiltrating lobular carcinoma", "Correct: often multicentric and bilateral."], ["Fibroadenoma", "Benign."], ["Mucinous carcinoma", "Usually unifocal."]]}, {"s": "A patient has dark pigmented back skin diagnosed as melanoma. Which factor best determines tumor behavior?", "sub": "Pathology", "lec": "Skin tumors", "per": "After", "hy": 1, "c": 3, "o": [["Tumor diameter", "Less reliable."], ["Patient age", "Minor."], ["Color variation", "Diagnostic, not prognostic."], ["Depth of tumor invasion", "Correct: Breslow thickness."], ["Anatomic location", "Minor."]]}, {"s": "A basketball player falls on his shoulder with sharp pain; weeks later he has a firm, painless mass there. Most probable diagnosis?", "sub": "Pathology", "lec": "Bone fracture and healing", "per": "Before", "hy": 1, "c": 0, "o": [["Fracture healing (callus)", "Correct: callus after a clavicle fracture."], ["Osteosarcoma", "Painful and progressive."], ["Osteomyelitis", "Painful, with fever."], ["Lipoma", "Soft, not post-traumatic."], ["Abscess", "Painful and fluctuant."]]}, {"s": "An infant has an erythematous, vesicular, oozing rash on the face. What is the condition?", "sub": "Pathology", "lec": "Benign Skin conditions", "per": "After", "hy": 0, "c": 1, "o": [["Impetigo", "Honey-colored crusts."], ["Acute eczema", "Correct: erythema, vesicles and oozing."], ["Tinea faciei", "Annular scaly plaque."], ["Psoriasis", "Silvery plaques."], ["Scabies", "Burrows and nocturnal itch."]]}, {"s": "A melanoma case gives tumor depth and other details. Which is the most important prognostic factor?", "sub": "Pathology", "lec": "Skin tumors", "per": "After", "hy": 1, "c": 2, "o": [["Tumor diameter", "Less reliable."], ["Color variation", "Diagnostic, not prognostic."], ["Depth of the tumor (Breslow thickness)", "Correct."], ["Patient age", "Minor."], ["Anatomic site", "Minor."]]}, {"s": "A woman has a breast mass with nipple retraction. Which is the most common risk factor for breast cancer?", "sub": "Pathology", "lec": "Breast Cancer", "per": "After", "hy": 0, "c": 0, "o": [["Increasing age", "Correct. ⚠ Your source said family history, but it accounts for only a minority of cases."], ["Family history", "Important, but about 15% of patients."], ["Early menopause", "Lowers risk."], ["Multiparity", "Protective."], ["Prolonged breastfeeding", "Protective."]]}, {"s": "A tumor around the elbow shows a biphasic pattern with spindle cells. What is it?", "sub": "Pathology", "lec": "Soft tissue tumors", "per": "After", "hy": 1, "c": 4, "o": [["Liposarcoma", "Lipoblasts."], ["Leiomyosarcoma", "Smooth muscle spindle cells."], ["Rhabdomyosarcoma", "Skeletal muscle differentiation."], ["Lipoma", "Benign fat tumor."], ["Synovial sarcoma", "Correct: biphasic spindle and epithelial cells, t(X;18)."]]}, {"s": "Which bones are fractured in a bimalleolar (Pott's) fracture?", "sub": "Pathology", "lec": "Bone fracture and healing", "per": "Before", "hy": 0, "c": 3, "o": [["Talus and calcaneus", "Hindfoot bones."], ["Tibia and talus", "Not the malleoli."], ["Fibula and calcaneus", "Not the malleoli."], ["Tibia and fibula (medial and lateral malleoli)", "Correct."], ["Navicular and cuboid", "Midfoot bones."]]}, {"s": "What causes the peau d'orange appearance in breast cancer?", "sub": "Pathology", "lec": "Breast Cancer", "per": "After", "hy": 0, "c": 1, "o": [["Shortening of Cooper's ligaments", "Causes dimpling."], ["Cutaneous (dermal) lymphatic obstruction with edema", "Correct."], ["Fibrosis around ducts", "Causes nipple retraction."], ["Fat necrosis", "Follows trauma."], ["Skin ulceration", "A late feature."]]}, {"s": "A 25-year-old woman has a mobile, rubbery breast lump. Histology shows proliferating glands and loose stroma compressing ducts into slit-like spaces. What is it?", "sub": "Pathology", "lec": "Benign lesions of the breast", "per": "After", "hy": 1, "c": 3, "o": [["Phyllodes tumor", "Leaf-like clefts, cellular stroma."], ["Fat necrosis", "Foamy macrophages and fibrosis."], ["Intraductal papilloma", "Fibrovascular cores in a duct."], ["Fibroadenoma", "Correct: biphasic benign tumor."], ["Invasive ductal carcinoma", "Malignant glands in desmoplastic stroma."]]}, {"s": "In a Colles fracture, which bone is fractured and in which direction is the fragment displaced?", "sub": "Pathology", "lec": "Bone fracture and healing", "per": "Before", "hy": 1, "c": 2, "o": [["Distal radius, displaced anteriorly", "Smith fracture."], ["Proximal radius with anterior displacement", "Not Colles."], ["Distal radius, displaced posteriorly (dorsally)", "Correct: dinner-fork deformity."], ["Ulnar shaft with radial head dislocation", "Monteggia fracture."], ["Scaphoid waist", "Snuffbox tenderness."]]}, {"s": "A tumor in the metaphysis of a long bone has a lobulated, bluish-white, glistening cartilaginous cut surface. What is it?", "sub": "Pathology", "lec": "Bone tumors", "per": "Before", "hy": 0, "c": 0, "o": [["Chondrosarcoma", "Correct: malignant cartilage-forming tumor."], ["Osteosarcoma", "Bone-forming, sunburst pattern."], ["Ewing sarcoma", "Small round blue cells."], ["Giant cell tumor", "Epiphyseal, hemorrhagic."], ["Osteochondroma", "Benign, cartilage cap."]]}, {"s": "A patient presents with dry eyes and a dry mouth. What is the syndrome?", "sub": "Pathology", "lec": "Connective tissue disorders", "per": "Before", "hy": 1, "c": 3, "o": [["Systemic lupus erythematosus", "Malar rash, multi-organ."], ["Systemic sclerosis", "Skin thickening."], ["Polymyositis", "Proximal muscle weakness."], ["Sjogren syndrome", "Correct: autoimmune destruction of lacrimal and salivary glands."], ["Mixed connective tissue disease", "Overlap syndrome."]]}, {"s": "What does a procallus consist of?", "sub": "Pathology", "lec": "Bone fracture and healing", "per": "Before", "hy": 0, "c": 4, "o": [["Woven bone with osteoblasts", "Hard callus."], ["Lamellar compact bone", "Remodeled bone."], ["Fibrin clot with platelets only", "Hematoma."], ["Neutrophils and macrophages only", "Early inflammation."], ["Fibroblasts, osteogenic cells and chondroblasts producing fibrocartilage", "Correct."]]}, {"s": "A patient has symmetric swelling of the MCP joints with ulnar deviation and swan-neck deformities. What is the diagnosis?", "sub": "Pathology", "lec": "Etiopathogenesis of Arthritis", "per": "Before", "hy": 0, "c": 1, "o": [["Osteoarthritis", "DIP and PIP nodes, spares MCP."], ["Rheumatoid arthritis", "Correct: symmetric pannus-forming synovitis."], ["Gout", "Asymmetric, tophi."], ["Psoriatic arthritis", "DIP involvement and nail changes."], ["Septic arthritis", "Single hot joint."]]}, {"s": "Which gene is mutated in Duchenne muscular dystrophy?", "sub": "Pathology", "lec": "Muscular dystrophy", "per": "Before", "hy": 0, "c": 0, "o": [["DMD gene (dystrophin)", "Correct: X-linked recessive."], ["DMPK", "Myotonic dystrophy."], ["SMN1", "Spinal muscular atrophy."], ["COL6A1", "Bethlem myopathy."], ["DYSF", "Limb-girdle dystrophy 2B."]]}, {"s": "Which breast cancer shows an Indian file pattern?", "sub": "Pathology", "lec": "Breast Cancer", "per": "After", "hy": 1, "c": 2, "o": [["Invasive ductal carcinoma", "Glands and cords."], ["Medullary carcinoma", "Solid sheets with lymphocytes."], ["Invasive lobular carcinoma", "Correct: single-file cells due to E-cadherin loss."], ["Mucinous carcinoma", "Mucin pools."], ["Papillary carcinoma", "Fibrovascular fronds."]]}, {"s": "An older man has a pearly ulcerated nodule with rolled borders on the nose. What is the diagnosis?", "sub": "Pathology", "lec": "Skin tumors", "per": "After", "hy": 0, "c": 3, "o": [["Squamous cell carcinoma", "Keratotic, scaly ulcer."], ["Melanoma", "Pigmented, asymmetric."], ["Actinic keratosis", "Rough scaly macule."], ["Basal cell carcinoma", "Correct: most common skin cancer, rarely metastasizes."], ["Seborrheic keratosis", "Waxy stuck-on plaque."]]}, {"s": "A benign tumor shows large round polygonal cells with abundant eosinophilic granular cytoplasm and cross-striations. What is it?", "sub": "Pathology", "lec": "Soft tissue tumors", "per": "After", "hy": 0, "c": 1, "o": [["Rhabdomyosarcoma", "Malignant, strap cells."], ["Rhabdomyoma", "Correct: benign skeletal muscle tumor."], ["Leiomyoma", "Smooth muscle, no striations."], ["Leiomyosarcoma", "Malignant smooth muscle."], ["Lipoma", "Fat cells."]]}, {"s": "A tumor shows spindle cells with cigar-shaped nuclei, atypia and mitoses. What is it?", "sub": "Pathology", "lec": "Soft tissue tumors", "per": "After", "hy": 0, "c": 4, "o": [["Leiomyoma", "Benign, few mitoses."], ["Synovial sarcoma", "Biphasic pattern."], ["Fibrosarcoma", "Herringbone pattern."], ["Rhabdomyosarcoma", "Skeletal muscle features."], ["Leiomyosarcoma", "Correct: malignant smooth muscle tumor."]]}, {"s": "A 26-year-old is hit by a steel beam on the arm. Three weeks later he has a painful, circumscribed 2 cm subcutaneous solid mass at the site. Most likely lesion?", "sub": "Pathology", "lec": "Soft tissue tumors", "per": "After", "hy": 0, "c": 2, "o": [["Superficial fibromatosis", "Slow growing, palmar or plantar."], ["Organizing abscess", "Needs infection and fluid."], ["Nodular fasciitis", "Correct: rapid, self-limited, often post-traumatic."], ["Lipoma", "Soft, painless."], ["Pleomorphic sarcoma", "Large, deep, aggressive."]]}, {"s": "Mammography in reproductive-age women shows 1-5 cm cysts with microcalcifications; aspiration yields turbid fluid with few cells. Which microscopic change is most likely?", "sub": "Pathology", "lec": "Benign lesions of the breast", "per": "After", "hy": 1, "c": 0, "o": [["Apocrine metaplasia", "Correct: fibrocystic change."], ["Ductal carcinoma in situ", "Atypical cells."], ["Sclerosing adenosis", "Calcifications, no cysts."], ["Fat necrosis", "Follows trauma."], ["Papillomatosis", "Epithelial proliferation, not cysts."]]}, {"s": "A 51-year-old woman has a swollen erythematous breast with nipple retraction, a 7 cm firm area and axillary lymphadenopathy. Excision biopsy most likely shows?", "sub": "Pathology", "lec": "Breast Cancer", "per": "After", "hy": 1, "c": 3, "o": [["Atypical epithelial hyperplasia", "Precursor lesion."], ["Sclerosing adenosis", "Benign."], ["Abscess", "Fluctuant and febrile."], ["Infiltrating ductal carcinoma", "Correct."], ["Fat necrosis", "Follows trauma."]]}, {"s": "Which statement about vitiligo is INCORRECT?", "sub": "Pathology", "lec": "Benign Skin conditions", "per": "After", "hy": 0, "c": 3, "o": [["It has an autoimmune basis", "True."], ["It is associated with autoimmune thyroid disease", "True."], ["There is loss of melanocytes", "True."], ["There is thinning of the basement membrane", "Correct (incorrect statement): the defect is absent melanocytes."], ["It produces depigmented macules", "True."]]}, {"s": "A non-healing ulcer from draining chronic osteomyelitis can lead to which malignancy?", "sub": "Pathology", "lec": "Osteomyelitis", "per": "Before", "hy": 0, "c": 0, "o": [["Squamous cell carcinoma", "Correct: Marjolin ulcer."], ["Basal cell carcinoma", "Not typical."], ["Melanoma", "Not typical."], ["Kaposi sarcoma", "Immunodeficiency related."], ["Lymphoma", "Not typical."]]}, {"s": "At the end of which week does woven bone, with subperiosteal trabeculae perpendicular to the cortical axis, form in fracture healing?", "sub": "Pathology", "lec": "Bone fracture and healing", "per": "Before", "hy": 0, "c": 2, "o": [["4 weeks", "Callus is maturing."], ["8 weeks", "Remodeling begins."], ["2 weeks", "Correct: woven bone callus."], ["1 week", "Hematoma and inflammation."], ["12 weeks", "Remodeling."]]}, {"s": "What is the life expectancy of patients with Duchenne muscular dystrophy?", "sub": "Pathology", "lec": "Muscular dystrophy", "per": "Before", "hy": 0, "c": 0, "o": [["25-30 years", "Correct (traditional figure)."], ["10-15 years", "Too short."], ["40-50 years", "Too long."], ["60-70 years", "Too long."], ["Normal", "Not normal."]]}, {"s": "A patient has osteophyte lipping with negative RF and anti-CCP antibodies. What is the diagnosis?", "sub": "Pathology", "lec": "Etiopathogenesis of Arthritis", "per": "Before", "hy": 0, "c": 3, "o": [["Gout", "Urate crystals."], ["Psoriatic arthritis", "DIP and nail changes."], ["Ankylosing spondylitis", "Sacroiliitis."], ["Osteoarthritis", "Correct: degenerative joint disease."], ["Rheumatoid arthritis", "RF or ACPA positive."]]}, {"s": "What is the best initial screening test for a patient with symptoms of SLE?", "sub": "Pathology", "lec": "Connective tissue disorders", "per": "Before", "hy": 1, "c": 0, "o": [["Antinuclear antibodies", "Correct: sensitive screening test."], ["Anti-dsDNA antibodies", "Specific, used for confirmation."], ["Anti-CCP antibodies", "Rheumatoid arthritis."], ["Anti-centromere antibodies", "Limited scleroderma."], ["Anti-Jo-1 antibodies", "Myositis."]]}];
const L="ABCDE";const LECT=["Bone fracture and healing", "Etiopathogenesis of Arthritis", "Osteomyelitis", "Bone tumors", "Muscular dystrophy", "Connective tissue disorders", "Benign lesions of the breast", "Breast Cancer", "Benign Skin conditions", "Skin tumors", "Soft tissue tumors"];function ov(){const c={};D.forEach(q=>c[q.lec]=(c[q.lec]||0)+1);document.getElementById("ov").innerHTML='<details open><summary>'+D.length+' questions: lecture breakdown</summary>'+LECT.map(l=>'<div class="br"><span>'+l+'</span><span class="'+(c[l]?'':'zero')+'">'+(c[l]||"0, not covered yet")+'</span></div>').join('')+'</details>'}

document.addEventListener("click",e=>{const b=e.target.closest(".o");if(!b)return;const i=+b.dataset.i,j=+b.dataset.j;if(A[i]!=null)return;A[i]=j;
const c=document.getElementById("q"+i);c.classList.add("done");const bs=c.querySelectorAll(".o");bs[D[i].c].classList.add("ok");if(j!==D[i].c)bs[j].classList.add("no");upd();if(A.every(a=>a!=null))fin()});
function grp(k){const m={};D.forEach((q,i)=>{const key=k=="per"?q.per+" Midterm":q[k];m[key]=m[key]||[0,0];m[key][1]++;if(A[i]===q.c)m[key][0]++});
return Object.entries(m).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]).map(([n,v])=>{const p=Math.round(100*v[0]/v[1]);return '<div class="br"><span>'+n+' ('+v[0]+'/'+v[1]+')</span><span><span class="g">'+p+'% right</span> · <span class="r">'+(100-p)+'% wrong</span></span></div>'}).join('')}
function fin(){const s=D.filter((q,i)=>A[i]===q.c).length,p=Math.round(100*s/D.length);
const v=p>=85?"Excellent. You're exam-ready on this set.":p>=70?"Solid. Review the weak tags below.":p>=50?"Getting there. Focus on the weakest lectures first.":"Needs work. Revisit the lectures listed at the top below.";
const e=document.getElementById("score");e.style.display="block";e.innerHTML='<h2>Final score</h2><div class="big">'+s+' / '+D.length+' · '+p+'%</div><div>'+v+'</div><div class="bk"><h3>By lecture (weakest first)</h3>'+grp("lec")+'<h3>Before vs after midterm</h3>'+grp("per")+'</div>';e.scrollIntoView({behavior:"smooth"})}
document.getElementById("rs").onclick=()=>{init();window.scrollTo({top:0,behavior:"smooth"})};
init();
</script></body></html>
