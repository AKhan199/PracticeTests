<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MSK OSPE Practice</title>
<style>
:root{--bg:#c9f2e3;color-scheme:light;--fg:#12302b;--mu:#6b6b66;--cd:#fff;--bd:#dcdcd6;--ac:#2f5fd0;--ok:#1d8a4a;--no:#c23b3b;--wa:#a86a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
#app{max-width:820px;margin:0 auto;padding:16px}
.mu{color:var(--mu);font-size:14px}.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
img{max-width:100%;border-radius:8px;background:#fff}
textarea{width:100%;box-sizing:border-box;min-height:90px;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--cd);color:var(--fg);font:inherit}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--cd);color:var(--fg);border-radius:8px;padding:8px 14px;margin:3px 4px 3px 0}
.pri{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.4;cursor:default}
.chip{border-radius:16px;padding:5px 12px}.chip.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 15%,transparent)}
.why{margin:6px 0;padding:8px 10px;border-left:3px solid var(--ac);font-size:15px}
.ok.on{background:var(--ok);color:#fff}.no.on{background:var(--no);color:#fff}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--bd);margin-right:4px}
.wa{color:var(--wa);font-size:14px;margin-top:6px}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.row{display:flex;justify-content:space-between;gap:8px;margin-top:8px}.big{font-size:40px;font-weight:700}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin-bottom:8px}#top .bar{margin-top:6px}.nav{margin:6px 0}.nv{min-width:36px;padding:4px 8px;margin:2px}.nv.rv{border-color:var(--ac)}.nv.dn{background:color-mix(in srgb,var(--ok) 25%,transparent)}.nv.cur{outline:2px solid var(--ac)}
</style></head><body><div id="app"></div>

const Q=S.flatMap(s=>s.qs.map((q,qi)=>({...q,s,qi})));
let si=0,ans=[],rev=[],res=Q.map(()=>[]);
const $=document.getElementById("app");
const esc=t=>t.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const pct=(a,b)=>b?Math.round(100*a/b):0;
const E=k=>res[k].filter(v=>v===1).length,MK=k=>res[k].filter(v=>v!==undefined).length;
const KS=n=>Q.map((q,k)=>q.s===S[n]?k:-1).filter(k=>k>=0);
function stats(){let g=0,m=0,t=0;Q.forEach((q,k)=>{g+=E(k);m+=MK(k);t+=q.parts.length});return{g,m,t}}
function refresh(){const s=stats();document.getElementById("top").innerHTML=`<b>Live score: ${s.g} / ${s.m}</b> <span class="mu">(${pct(s.g,s.m)}%) &middot; ${s.m} of ${s.t} marks judged</span><div class="bar"><i style="width:${pct(s.m,s.t)}%;background:var(--ac)"></i></div>`;
document.getElementById("nav").innerHTML=S.map((t,n)=>{const ks=KS(n),all=ks.every(k=>MK(k)===Q[k].parts.length),any=ks.some(k=>rev[k]);return `<button class="nv ${n===si?"cur":""} ${all?"dn":any?"rv":""}" data-g="${n}">Station ${t.n}</button>`}).join("")}
function go(n){si=n;show();scrollTo(0,0)}
function rv(k){if(rev[k])return;rev[k]=true;const y=scrollY;show();scrollTo(0,y)}
function qcard(k){const q=Q[k],m=res[k];
let h=`<div class="card"><div class="mu">Question ${q.qi+1} of ${q.s.qs.length}</div><b>${esc(q.q)}</b><div class="mu">${q.parts.length} mark${q.parts.length>1?"s":""} &middot; ${q.t.map(t=>`<span class="tag">${t}</span>`).join("")}</div><textarea data-k="${k}" placeholder="Type your answer, press Enter to show answers (Shift+Enter for new line)">${esc(ans[k]||"")}</textarea>`+(rev[k]?"":`<div><button class="pri" data-go="${k}">Show answers</button></div>`);
if(rev[k]){q.parts.forEach((p,pi)=>{h+=`<div class="card"><b>${p.p}</b><div class="mu">Accepted answers (tap for reasoning)</div><div>`+p.a.map((x,ai)=>`<button class="chip" data-k="${k}" data-p="${pi}" data-a="${ai}">${x[0]}</button>`).join("")+`</div><div id="w${k}_${pi}"></div><div class="row"><span>Did you get this right?</span><span><button class="ok ${m[pi]===1?"on":""}" data-k="${k}" data-m="${pi}" data-v="1">Right</button><button class="no ${m[pi]===0?"on":""}" data-k="${k}" data-m="${pi}" data-v="0">Wrong</button></span></div></div>`});
if(q.note)h+=`<div class="wa">Note: ${q.note}</div>`}
return h+`</div>`}
function show(){const s=S[si];
$.innerHTML=`<div id="top"></div><div id="nav" class="nav"></div><div class="mu">Station ${s.n} of ${S.length} &middot; ${s.qs.length} question${s.qs.length>1?"s":""}</div>`+(s.stem?`<div class="card">${esc(s.stem)}</div>`:"")+(s.img?`<img src="${IMG[s.img]}" alt="Station ${s.n} figures">`:"")+(s.imgs?s.imgs.map(im=>`<img src="${IMG[im]}" alt="Station ${s.n} figure">`).join(""):"")+KS(si).map(qcard).join("")+`<div class="row"><span><button id="pv" ${si?"":"disabled"}>Previous station</button><button id="nx" ${si<S.length-1?"":"disabled"}>Next station</button></span><button class="pri" id="fin">Finish &amp; see results</button></div>`;
refresh();const t=$.querySelector("textarea");if(t&&!rev[+t.dataset.k])t.focus({preventScroll:true})}
$.oninput=e=>{if(e.target.tagName==="TEXTAREA")ans[+e.target.dataset.k]=e.target.value};
$.onkeydown=e=>{if(e.target.tagName==="TEXTAREA"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();rv(+e.target.dataset.k)}};
$.onclick=e=>{const t=e.target;let b;
if(b=t.closest("[data-g]"))return go(+b.dataset.g);
if(b=t.closest("[data-go]"))return rv(+b.dataset.go);
if(b=t.closest(".chip")){const k=+b.dataset.k,p=+b.dataset.p,x=Q[k].parts[p].a[+b.dataset.a],on=!b.classList.contains("on");b.parentElement.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));b.classList.toggle("on",on);document.getElementById(`w${k}_${p}`).innerHTML=on?`<div class="why"><b>${x[0]}</b><br>${x[1]||"Accepted answer per the key."}</div>`:"";return}

if(b=t.closest("[data-m]")){const k=+b.dataset.k,p=+b.dataset.m,v=+b.dataset.v,m=res[k];m[p]=m[p]===v?undefined:v;$.querySelectorAll(`[data-k="${k}"][data-m="${p}"]`).forEach(x=>x.classList.toggle("on",m[p]===+x.dataset.v));return refresh()}
if(t.closest("#pv"))return go(si-1);if(t.closest("#nx"))return go(si+1);if(t.closest("#fin"))return results()};
function bar(l,a,b){return `<div style="margin:10px 0"><div class="row" style="margin:0"><span>${l}</span><b>${a}/${b} (${pct(a,b)}%)</b></div><div class="bar"><i style="width:${pct(a,b)}%"></i></div></div>`}
function results(){let tot=0,got=0,h="";const st={},tg={},ms=[];
Q.forEach((q,k)=>{const e=E(k),n=q.parts.length;tot+=n;got+=e;
(st[q.s.n]=st[q.s.n]||[0,0]);st[q.s.n][0]+=e;st[q.s.n][1]+=n;
q.t.forEach(t=>{(tg[t]=tg[t]||[0,0]);tg[t][0]+=e;tg[t][1]+=n});
q.parts.forEach((p,pi)=>{if(!res[k][pi])ms.push({q,p,k})})});
h+=`<div class="card"><div class="mu">Final mark</div><div class="big">${got} / ${tot}</div><div>${pct(got,tot)}%</div><div class="mu">Parts you did not mark count as missed.</div></div>`;
h+=`<div class="card"><b>By station</b>`+S.map(s=>bar("Station "+s.n,...st[s.n])).join("")+`</div>`;
h+=`<div class="card"><b>By subject</b><div class="mu">Questions with overlapping tags count toward each tag.</div>`+CAT.map(c=>{let a=0,b=0;const seen=new Set();Q.forEach((q,k)=>{if(q.t.some(t=>t.startsWith(c))){const e=E(k);a+=e;b+=q.parts.length}});return bar(c,a,b)}).join("")+`</div>`;
h+=`<div class="card"><b>By lecture</b>`+Object.keys(L).filter(t=>tg[t]).map(t=>bar(`${t} - ${L[t]}`,...tg[t])).join("")+`</div>`;
h+=`<div class="card"><b>Mistakes by lecture</b>`;
if(!ms.length)h+=`<p>No mistakes. Excellent!</p>`;
Object.keys(L).forEach(t=>{const l=ms.filter(x=>x.q.t.includes(t));if(!l.length)return;h+=`<h4 style="margin:14px 0 4px">${t} - ${L[t]} (${l.length})</h4>`+l.map(x=>`<div class="why">Station ${x.q.s.n}, Q${x.q.qi+1} - ${x.p.p}<br><span class="mu">${esc(x.q.q)}</span><br>Key: ${x.p.a[0][0]}</div>`).join("")});
h+=`</div><button class="pri" onclick="si=0;ans=[];rev=[];res=Q.map(()=>[]);show();scrollTo(0,0)">Restart exam</button> <button onclick="show();scrollTo(0,0)">Back to questions</button>`;
$.innerHTML=h}
show();
</script></body></html>
